hints:
- If both lists are empty, return `[]` immediately.
- Use a `scores = {}` dictionary. Iterate `dense_ranks` with `rank = i + 1`, adding
  `1.0 / (k + rank)`. Do the same for `sparse_ranks`.
- 'Round scores to 6 decimal places, sort by `(-score, doc_id)`, and return `[{''doc_id'':
  doc, ''rrf_score'': score}, ...]`.'
solution:
  code: "class Solution:\n    def reciprocal_rank_fusion(self, dense_ranks: list[str],\
    \ sparse_ranks: list[str], k: int = 60) -> list[dict]:\n        if not dense_ranks\
    \ and not sparse_ranks:\n            return []\n\n        scores: dict[str, float]\
    \ = {}\n\n        for idx, doc in enumerate(dense_ranks):\n            rank =\
    \ idx + 1\n            scores[doc] = scores.get(doc, 0.0) + (1.0 / (k + rank))\n\
    \n        for idx, doc in enumerate(sparse_ranks):\n            rank = idx + 1\n\
    \            scores[doc] = scores.get(doc, 0.0) + (1.0 / (k + rank))\n\n     \
    \   ranked = [\n            {\"doc_id\": doc, \"rrf_score\": round(score, 6)}\n\
    \            for doc, score in scores.items()\n        ]\n\n        # Primary:\
    \ score desc, Secondary: doc_id asc\n        ranked.sort(key=lambda x: (-x[\"\
    rrf_score\"], x[\"doc_id\"]))\n\n        return ranked\n"
  explanation: 'Reciprocal Rank Fusion converts arbitrary rank orders into normalized
    reciprocal penalties.

    By iterating both candidate sets and accumulating `1.0 / (k + rank)`, items retrieved
    near the top

    of both dense and sparse pipelines achieve the highest compound score, balancing
    lexical precision and semantic recall.

    '
  time: O(N + M + U log U) where N is dense length, M is sparse length, U is unique
    docs
  space: O(U) for dictionary and ranked output
pitch_script: "**(Clarify)** \"We need to combine results from two search systems\u2014\
  dense vector embeddings and sparse BM25 keywords\u2014using the Reciprocal Rank\
  \ Fusion algorithm.\"\n\n**(Basement Insight)** \"Directly adding BM25 scores to\
  \ vector similarity fails because BM25 scores are unbounded while cosine similarity\
  \ is bounded between -1 and 1. RRF normalizes across systems by evaluating only\
  \ ordinal rank positions.\"\n\n**(Solution)** \"For each document in both the dense\
  \ and sparse result lists, we add `1.0 / (k + rank)` to its score accumulator. Documents\
  \ retrieved by both systems receive compounded boosts. We round to 6 decimal places\
  \ and sort by score descending with doc_id tie-breaking.\"\n\n**(Complexity)** \"\
  Runs in O(N + M + U log U) time and O(U) space.\"\n"
