journey:
- id: w35_s1_dense_blindspot
  title: 'The Dense Embedding Blindspot: Serial Numbers, SKUs & Exact Codes'
  subtitle: Why semantic embeddings fail on precise alphanumeric identifiers
  scenario: 'Aircraft maintenance mechanics asked WisdomBot for exact fastener specifications:
    MS21042-4 locknut torque limits. Pure dense vector search retrieved general articles
    about "threaded fasteners and bolt tightening". Why did it fail to return the
    exact part document?'
  mechanism: Subword tokenizers break unfamiliar alphanumeric codes into generic fragments
    (MS, 21042, 4). The embedding model clusters the vector near general "fastener
    tightening". Documents containing completely different models score nearly identical
    cosine similarity, losing exact token identity.
  prediction:
    prompt: Why does dense vector search frequently fail on exact part numbers like
      MS21042-4 or error codes like ORA-01403?
    choices:
    - id: opt_a
      label: Embedding models project text into semantic concept space, blurring rare
        alphanumeric strings into general topical clusters and losing exact token
        identity.
      explanation: Correct! Dense embeddings optimize for broad conceptual meaning,
        making them blind to exact token matches.
      is_correct: true
    - id: opt_b
      label: Vector databases only support words found in standard dictionaries.
      explanation: Incorrect! Vector models process arbitrary subwords, but blur their
        exact meaning.
      is_correct: false
    - id: opt_c
      label: High-dimensional math cannot represent numbers greater than 100.
      explanation: Nonsense! Vector components are standard floating-point coordinates.
      is_correct: false
    revealed_explanation: Exact identifiers require lexical keyword indexes to guarantee
      precise token retrieval.
  controls:
  - id: query_type
    label: Query Structure
    type: select
    default: Exact Part Code (MS21042-4)
    options:
    - Exact Part Code (MS21042-4)
    - Natural Language Paraphrase
    description: Type of search query
  - id: retriever_engine
    label: Retriever Engine
    type: select
    default: Pure Dense Vector Search
    options:
    - Pure Dense Vector Search
    - Hybrid BM25 + Vector
    description: Active search system architecture
  visualizer_type: system_blueprint
  visualizer_config:
    title: Subword Fragmentation & Alphanumeric Blurring in Embeddings
- id: w35_s2_sparse_bm25_blindspot
  title: 'The Sparse BM25 Blindspot: Synonyms, Paraphrasing & Conceptual Queries'
  subtitle: Why keyword matching fails when vocabulary diverges
  scenario: 'A user queries: "How do I upgrade to the paid plan?" The documentation
    page uses the heading: "Subscription Billing & Tier Elevation". How does BM25
    perform?'
  mechanism: BM25 searches for term frequency and inverse document frequency of the
    exact tokens upgrade, paid, plan. None of these tokens appear in the target passage.
    BM25 scores it as 0.0, completely missing the most relevant document in the knowledge
    base.
  prediction:
    prompt: In what scenario does a sparse lexical retriever (like BM25) completely
      fail to return the correct document?
    choices:
    - id: opt_a
      label: When the user expresses their intent using synonyms or colloquial phrasing
        that does not contain the exact vocabulary used in the document text.
      explanation: Correct! Lexical search requires exact term overlap and cannot
        bridge synonymy.
      is_correct: true
    - id: opt_b
      label: When documents contain fewer than 10 words.
      explanation: Incorrect! BM25 functions on short documents as long as keywords
        match.
      is_correct: false
    - id: opt_c
      label: When the search index is stored on an SSD instead of RAM.
      explanation: Irrelevant! Hardware storage media does not alter ranking logic.
      is_correct: false
    revealed_explanation: Neither dense vector search nor sparse BM25 is sufficient
      on its own. Production enterprise RAG demands Hybrid Search.
  controls:
  - id: lexical_overlap
    label: Keyword Vocabulary Overlap
    type: slider
    default: 0
    min: 0
    max: 100
    step: 10
    description: Percentage of query words appearing in document text
  visualizer_type: system_blueprint
  visualizer_config:
    title: BM25 Term Frequency vs Synonym Vocabulary Disconnect
- id: w35_s3_uncalibrated_score_trap
  title: 'The Uncalibrated Score Trap: Why BM25 + Cosine Breaks'
  subtitle: The mathematical peril of adding unbounded lexical scores to bounded cosine
    metrics
  scenario: 'An engineer tries to combine BM25 and vector search by calculating a
    combined score: score = 0.5 * bm25_score + 0.5 * cosine_score. What goes wrong?'
  mechanism: Cosine similarity is bounded strictly between [-1.0, 1.0] (typically
    [0.0, 1.0] for text). BM25 scores, however, depend on document length and inverse
    document frequency, frequently reaching values like 18.5, 42.1, or higher. Adding
    them directly means BM25 completely drowns out the cosine score, effectively reducing
    the hybrid search to a pure keyword search.
  prediction:
    prompt: What happens if an engineer linearly sums raw BM25 scores and raw Cosine
      Similarity scores?
    choices:
    - id: opt_a
      label: 'Uncalibrated score mismatch: BM25 scores are unbounded [0, infinity)
        while Cosine scores are bounded [-1, 1], allowing BM25 magnitudes to completely
        dominate ranking.'
      explanation: Correct! Raw score combination allows arbitrary lexical score scales
        to overwhelm semantic similarity.
      is_correct: true
    - id: opt_b
      label: The scores cancel each other out to zero every time.
      explanation: Incorrect! Both scores are generally positive for relevant documents.
      is_correct: false
    - id: opt_c
      label: The CPU encounters a floating-point overflow interrupt.
      explanation: Nonsense! Standard 64-bit floats handle numbers up to 10^308.
      is_correct: false
    revealed_explanation: Linear score fusion without complex per-corpus normalization
      is fundamentally unstable. Reciprocal Rank Fusion eliminates score calibration
      entirely.
  controls:
  - id: bm25_score_val
    label: Simulated BM25 Raw Score
    type: slider
    default: 28
    min: 0
    max: 50
    step: 2
    description: Raw BM25 lexical score
  - id: cosine_score_val
    label: Simulated Cosine Similarity
    type: slider
    default: 0.85
    min: 0.0
    max: 1.0
    step: 0.05
    description: Bounded cosine similarity score
  visualizer_type: system_blueprint
  visualizer_config:
    title: 'Uncalibrated Scale Comparison: BM25 [0, inf) vs Cosine [0, 1]'
- id: w35_s4_rrf_mechanics
  title: Reciprocal Rank Fusion (RRF) Mechanics & Constant k=60
  subtitle: Ordinal rank fusion that balances dense and sparse signals without normalization
  scenario: How does Reciprocal Rank Fusion solve the uncalibrated score problem without
    requiring complex score normalization?
  mechanism: 'RRF ignores raw score values entirely and operates strictly on ordinal
    rank positions! RRF(d) = 1/(k + rank_dense(d)) + 1/(k + rank_sparse(d)). If a
    document ranks #1 in dense and #1 in sparse with k=60: Score = 1/61 + 1/61 = 0.03278.
    The constant k=60 dampens the exponential advantage of ranking #1 over ranking
    #2, rewarding documents that consistently appear across both retrieval lists.'
  prediction:
    prompt: In Reciprocal Rank Fusion, what happens to a document that ranks near
      the top of BOTH the dense vector search and sparse BM25 search?
    choices:
    - id: opt_a
      label: It receives a compounded score boost from both rank reciprocal terms,
        outranking documents that only scored well in a single retriever.
      explanation: Correct! Documents validated by both keyword and semantic retrieval
        receive cumulative rank reciprocals, rising to the top.
      is_correct: true
    - id: opt_b
      label: Its score is subtracted because duplicate appearances are penalized.
      explanation: Incorrect! RRF is additive; appearing in both lists is rewarded.
      is_correct: false
    - id: opt_c
      label: It is filtered out as an anomalous outlier.
      explanation: Nonsense! Dual-list presence is the strongest possible signal of
        relevance.
      is_correct: false
    revealed_explanation: RRF provides a mathematically stable, parameter-light method
      to fuse disparate retrieval systems in production.
  controls:
  - id: smoothing_constant_k
    label: RRF Smoothing Constant (k)
    type: slider
    default: 60
    min: 10
    max: 100
    step: 10
    description: 'Outlier damping parameter (standard value: 60)'
  - id: rank_scenario
    label: Candidate Document Ranks
    type: select
    default: 'Doc B: Rank #1 Dense, Rank #1 Sparse'
    options:
    - 'Doc B: Rank #1 Dense, Rank #1 Sparse'
    - 'Doc A: Rank #1 Dense, Missing Sparse'
    - 'Doc C: Missing Dense, Rank #1 Sparse'
    description: Simulated rank positions across retrievers
  visualizer_type: system_blueprint
  visualizer_config:
    title: 'RRF Curve: Rank Reciprocal Score vs Rank Position'
- id: w35_s5_cross_encoder_reranking
  title: 'Production Hybrid Architecture: Fast RRF + Deep Cross-Encoder'
  subtitle: The 2-stage retrieval pattern powering production search at OpenAI and
    Cohere
  scenario: How do top-tier RAG platforms achieve state-of-the-art retrieval accuracy
    at millisecond latencies?
  mechanism: 'Two-stage retrieval pipeline: Stage 1 (Fast Retrieval): Retrieve top
    50 candidates using Hybrid Search (BM25 + Dense Embeddings fused via RRF) in ~15ms.
    Stage 2 (Precision Reranking): Feed the 50 candidate passages through a Cross-Encoder
    model (which attends across query and document tokens simultaneously) to produce
    deeply contextual semantic scores, selecting the final top 3 passages for the
    LLM.'
  prediction:
    prompt: Why don't production search engines run Cross-Encoders across the entire
      10,000,000 document corpus directly?
    choices:
    - id: opt_a
      label: Cross-Encoders process full query-document token interactions simultaneously,
        making them hundreds of times too slow for full corpus search; using them
        as a second-stage reranker on top-50 candidates balances speed and accuracy.
      explanation: Correct! Cross-Encoders are O(N * (Q+D)^2) attention models, too
        expensive for millions of docs but ideal for top 50 reranking.
      is_correct: true
    - id: opt_b
      label: Cross-Encoders can only process documents written in Latin.
      explanation: Nonsense! Cross-encoders are multilingual transformer models.
      is_correct: false
    - id: opt_c
      label: Cross-Encoders consume 1TB of network bandwidth per query.
      explanation: Incorrect! The bottleneck is GPU tensor computation, not network
        bandwidth.
      is_correct: false
    revealed_explanation: The two-stage pipeline (Bi-Encoder/BM25 fast recall + Cross-Encoder
      precision rerank) represents the gold standard in modern information retrieval.
  controls:
  - id: first_stage_pool
    label: First-Stage Candidate Pool Size
    type: slider
    default: 50
    min: 10
    max: 100
    step: 10
    description: Number of candidates sent to cross-encoder
  - id: rerank_architecture
    label: Reranking Strategy
    type: select
    default: Two-Stage (RRF Recall -> Cross-Encoder Precision)
    options:
    - Two-Stage (RRF Recall -> Cross-Encoder Precision)
    - Single-Stage RRF Only (Fastest)
    description: Pipeline architecture configuration
  visualizer_type: system_blueprint
  visualizer_config:
    title: 'Two-Stage Retrieval: Bi-Encoder RRF + Cross-Encoder Reranker'
- id: w35_s6_transfer_challenge
  title: 'Transfer Challenge: Reciprocal Rank Fusion Hybrid Search Engine'
  subtitle: Build the production RRF ranking algorithm
  scenario: 'Implement `reciprocal_rank_fusion(dense_ranks: list[str], sparse_ranks:
