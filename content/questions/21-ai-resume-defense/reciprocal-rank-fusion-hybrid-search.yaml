slug: reciprocal-rank-fusion-hybrid-search
lc: 9602
citadel_id: ai_resume
brick_layer: 2
runner_type: python_practical
concept:
  problem_it_solves: '"Why do pure vector search and pure keyword search both fail
    in production enterprise RAG?" Dense vector embeddings excel at semantic paraphrasing
    ("how do I turn on debug logs?"), but fail on exact acronyms, error codes, and
    SKU identifiers (e.g., `ORA-01403: no data found`), blurring exact tokens into
    broad conceptual clusters. Sparse BM25 keyword search excels at exact tokens,
    but fails on synonyms.'
  brute_force: 'Naively adding raw scores: `0.5 * bm25_score + 0.5 * vector_cosine_score`.
    BM25 scores are unbounded $[0, \infty)$, while cosine scores are bounded $[-1,
    1]$. Uncalibrated score addition lets arbitrary BM25 magnitudes completely dominate
    semantic vector signals.'
  brute_force_complexity: O(N) uncalibrated fusion that breaks ranking accuracy.
  key_insight: 'Reciprocal Rank Fusion (RRF) discards uncalibrated raw scores entirely
    and operates solely on ordinal rank positions: $$\text{RRF}(d) = \sum_{m \in \{\text{dense},
    \text{sparse}\}} \frac{1}{k + \text{rank}_m(d)}$$ Where $\text{rank}_m(d)$ is
    the 1-based rank of document $d$ in retriever $m$, and $k$ (typically 60) dampens
    the impact of high-ranking outliers. Documents that appear near the top of both
    retrieval lists receive a compounded score boost, achieving the best of lexical
    precision and semantic depth.'
  real_world: WisdomBot hybrid retrieval, Elasticsearch / OpenSearch RRF plugin, Pinecone
    hybrid search, and Azure AI Search.
statement:
  clean: "Implement hybrid search result merging using reciprocal rank fusion:\n`def\
    \ reciprocal_rank_fusion(self, dense_ranks: list[str], sparse_ranks: list[str],\
    \ k: int = 60) -> list[dict]`.\n\nGiven:\n- `dense_ranks`: list of document ID\
    \ strings returned by dense vector search in descending order (index 0 is rank\
    \ 1)\n- `sparse_ranks`: list of document ID strings returned by sparse BM25 search\
    \ in descending order (index 0 is rank 1)\n- `k`: integer smoothing constant (default\
    \ 60)\n\n1. If both lists are empty, return `[]`.\n2. Maintain a running accumulator\
    \ of RRF scores for each document ID.\n3. For each document `doc` at 0-based index\
    \ `i` in `dense_ranks`:\n   - `rank = i + 1`\n   - Add `1.0 / (k + rank)` to `doc`'s\
    \ score.\n4. For each document `doc` at 0-based index `j` in `sparse_ranks`:\n\
    \   - `rank = j + 1`\n   - Add `1.0 / (k + rank)` to `doc`'s score.\n5. For each\
    \ unique document, round its score to 6 decimal places: `round(score, 6)`.\n6.\
    \ Sort all unique documents by:\n   - Primary: RRF score descending\n   - Secondary\
    \ (tie-breaker): document ID alphabetically ascending\n7. Return list of dicts:\
    \ `[{\"doc_id\": doc, \"rrf_score\": score}, ...]`.\n"
  oa_story: "**WisdomBot RAG Pipeline \u2014 Aerospace Part Number Retrieval**\n\n\
    When aircraft technicians searched for exact hardware specs like `MS21042-4 locknut\
    \ torque`,\npure vector search hallucinated general fastener passages without\
    \ the exact part number.\n\nBy fusing dense semantic retrieval with sparse BM25\
    \ keyword matching via Reciprocal Rank Fusion,\nWisdomBot guaranteed that exact\
    \ part numbers matched while retaining broader semantic context.\n"
  trigger_keywords:
  - reciprocal rank fusion
  - reciprocal_rank_fusion
  - dense_ranks
  examples:
  - input: dense_ranks = ["docA", "docB"], sparse_ranks = ["docB", "docC"], k = 60
    output: '[{"doc_id": "docB", "rrf_score": 0.032522}, {"doc_id": "docA", "rrf_score":
      0.016393}, {"doc_id": "docC", "rrf_score": 0.016129}]'
    explanation: docB appears in both lists (rank 2 dense + rank 1 sparse), receiving
      the highest fused score.
  - input: dense_ranks = ["d1"], sparse_ranks = ["d1"], k = 60
    output: '[{"doc_id": "d1", "rrf_score": 0.032787}]'
    explanation: 'Rank 1 in both: 1/61 + 1/61 = 2/61 ~ 0.032787.'
  constraints:
  - k >= 1
  - 0 <= len(dense_ranks), len(sparse_ranks) <= 100
constraint_quiz:
  prompt: 'Why is the constant k (typically 60) added to the denominator in the RRF
    formula: 1 / (k + rank)?'
  options:
  - It prevents a document with rank 1 from overwhelming all other documents, smoothing
    the penalty difference between adjacent ranks
  - It converts negative scores into positive numbers
  - It ensures the score is always a prime number
  - It limits the maximum number of documents to 60
  answer: 0
  explanation: Without k, rank 1 would have score 1.0 while rank 2 has score 0.5 (a
    massive 50% drop). With k=60, rank 1 is 1/61 (0.01639) and rank 2 is 1/62 (0.01613),
    smoothly rewarding consensus across multiple retrievers.
pattern_quiz:
  prompt: Why is RRF immune to differences in score distributions between BM25 and
    Vector Search?
  options:
  - Because RRF discards raw score magnitudes completely and relies solely on the
    ordinal rank positions of documents
  - Because RRF trains a neural network on every search
  - Because BM25 and Vector search use the exact same formula
  - Because RRF only runs on GPUs
  answer: 0
  explanation: Different retrieval algorithms produce non-comparable score ranges
    (BM25 is unbounded, cosine is [-1, 1]). RRF standardizes them by discarding scores
    and operating only on rank positions (1st, 2nd, 3rd).
