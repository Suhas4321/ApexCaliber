slug: gepa-genetic-prompt-optimizer
lc: 9603
citadel_id: ai_resume
brick_layer: 3
runner_type: python_practical
concept:
  problem_it_solves: '"How do you compress LLM system prompts to reduce API costs
    by 66% without degrading output accuracy?" Manually tweaking prompts is tedious,
    unscientific, and prone to regressions. Genetic and Evolutionary Prompt Architecture
    (GEPA / LLEGO) formalizes prompt engineering into an optimization search: treating
    prompts as genomes evaluated against a dual objective of accuracy and token brevity.'
  brute_force: 'Trial-and-error prompt edits: an engineer trims words manually, tests
    on 3 prompts, and ships to production, inevitably causing regressions on complex
    edge cases.'
  brute_force_complexity: O(E^M) heuristic trial-and-error with no guarantees of optimality
    or Pareto efficiency.
  key_insight: 'Evolutionary algorithms search the discrete space of prompt variations:
    1. Fitness evaluation: `fitness = accuracy - penalty`, where penalty penalizes
    candidates exceeding the target token budget. 2. Selection: candidates on the
    Pareto frontier (high accuracy, minimal tokens) are preserved. 3. Mutation: applying
    rules like removing conversational filler, condensing multi-line instructions
    into concise Markdown schemas. Over successive generations, the algorithm converges
    on the most token-efficient prompt that preserves benchmark accuracy.'
  real_world: Suhas's Drizz prompt optimization pipeline (66% token cost reduction
    via GEPA), DSPy teleprompter (MIPROv2), and LLEGO research.
statement:
  clean: "Implement a genetic prompt mutation and token budget optimizer using gepa\
    \ genetic optimization:\n`def optimize_prompt_generation(self, candidates: list[dict],\
    \ token_budget: int) -> dict`.\n\nGiven a list of `candidates`, where each candidate\
    \ is:\n- `prompt_id`: string identifier (e.g. `\"prompt_v1\"`)\n- `tokens`: integer\
    \ token count\n- `accuracy`: float accuracy score (e.g. `0.95` for 95%)\n\nAnd\
    \ `token_budget` (integer target token limit):\n1. If `candidates` is empty:\n\
    \   return `{\"selected_id\": None, \"tokens\": 0, \"accuracy\": 0.0, \"cost_penalty\"\
    : 0.0, \"fitness\": 0.0}`\n2. For each candidate:\n   - If `tokens > token_budget`:\n\
    \     `cost_penalty = round((tokens - token_budget) * 0.01, 4)`\n   - If `tokens\
    \ <= token_budget`:\n     `cost_penalty = 0.0`\n   - Calculate fitness:\n    \
    \ `fitness = round(accuracy - cost_penalty, 4)`\n3. Select the candidate with\
    \ the highest `fitness`.\n   Tie-breakers:\n   - Primary: highest `fitness`\n\
    \   - Secondary: lowest `tokens` (more compressed)\n   - Tertiary: original index\
    \ order in `candidates`\n4. Return a dictionary of the winning candidate:\n  \
    \ `{\"selected_id\": best[\"prompt_id\"], \"tokens\": best[\"tokens\"], \"accuracy\"\
    : best[\"accuracy\"], \"cost_penalty\": best[\"cost_penalty\"], \"fitness\": best[\"\
    fitness\"]}`\n"
  oa_story: "**Drizz Prompt Engineering Pipeline \u2014 66% Token Cost Trimming**\n\
    \nWhen running hundreds of automated UI classification tasks across GPT-4o, our\
    \ long-form\nsystem prompts generated high monthly API bills.\n\nBy running a\
    \ genetic algorithm across mutated instruction candidates, we automatically\n\
    selected prompt variants that reduced token volume by 66% while maintaining 100%\
    \ eval score.\n"
  trigger_keywords:
  - gepa genetic optimization
  - optimize_prompt_generation
  - candidates
  examples:
  - input: 'candidates = [{"prompt_id": "p1", "tokens": 150, "accuracy": 0.95}, {"prompt_id":
      "p2", "tokens": 80, "accuracy": 0.94}], token_budget = 100'
    output: '{"selected_id": "p2", "tokens": 80, "accuracy": 0.94, "cost_penalty":
      0.0, "fitness": 0.94}'
    explanation: p1 has tokens=150 (50 over budget of 100), penalty = 0.50, fitness
      = 0.45. p2 is within budget, fitness = 0.94.
  - input: 'candidates = [{"prompt_id": "p1", "tokens": 90, "accuracy": 0.90}, {"prompt_id":
      "p2", "tokens": 80, "accuracy": 0.90}], token_budget = 100'
    output: '{"selected_id": "p2", "tokens": 80, "accuracy": 0.90, "cost_penalty":
      0.0, "fitness": 0.90}'
    explanation: Both have 0.90 fitness, p2 wins tie-breaker with lower tokens (80
      < 90).
  constraints:
  - 0 <= len(candidates) <= 50
  - token_budget >= 1
constraint_quiz:
  prompt: Why is a token budget penalty term necessary in prompt optimization instead
    of simply maximizing accuracy alone?
  options:
  - Because without a token penalty, the optimizer would evolve increasingly bloated
    prompts containing repetitive few-shot examples, exploding latency and inference
    cost
  - Because LLMs crash if prompts contain fewer than 500 tokens
  - Because token counts are only measured in binary
  - Because genetic algorithms cannot handle floating point numbers
  answer: 0
  explanation: Maximizing accuracy alone produces bloated, overfitted prompts. Penalizing
    excess token usage forces the algorithm to explore the Pareto frontier of high
    accuracy and low cost.
pattern_quiz:
  prompt: In frameworks like DSPy and GEPA, what corresponds to a 'mutation' in prompt
    space?
  options:
  - Rephrasing instructions, reordering few-shot exemplars, or converting natural
    language instructions into structured JSON schemas
  - Changing the Python compiler version
  - Deleting the database indexes
  - Restarting the GPU container
  answer: 0
  explanation: 'Mutations in prompt optimization involve syntactic and semantic transformations:
    removing conversational fluff, reordering instructions, and restructuring few-shot
    demonstrations.'
