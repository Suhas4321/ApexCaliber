journey:
- id: w21_s1_lexical_gap
  title: 'The Lexical Gap: Why Keyword Search Misses Semantic Meaning'
  subtitle: Why exact token matching fails on synonyms, paraphrasing, and intent
  scenario: When aircraft maintenance engineers searched enterprise technical manuals
    for "engine overheating during takeoff", the legacy BM25 full-text search returned
    0 results. The manual chapter was titled "Turbofan High-Pressure Turbine Thermal
    Degradation", never using the casual words "overheating" or "engine". Why did
    this fail?
  mechanism: Inverted indexes match identical lexical stems or n-grams. Because the
    words "engine", "overheating", and "takeoff" do not literally appear in the heading
    or first paragraph, the BM25 lexical score is zero. The lexical gap prevents keyword
    engines from recognizing conceptual equivalence.
  prediction:
    prompt: Why does a BM25 keyword search fail when a user queries for "heart attack
      symptoms" and the article uses "myocardial infarction indicators"?
    choices:
    - id: opt_a
      label: Because BM25 relies on exact token matching and has zero understanding
        that "heart attack" and "myocardial infarction" are identical clinical concepts.
      explanation: Correct! Lexical inverted indexes match exact tokens; they cannot
        detect synonymy or semantic equivalence.
      is_correct: true
    - id: opt_b
      label: Because medical terms are blocked by search engine firewalls.
      explanation: Nonsense! BM25 simply matches strings without semantic understanding.
      is_correct: false
    - id: opt_c
      label: Because BM25 only searches single-letter words.
      explanation: Incorrect! BM25 processes arbitrary tokens.
      is_correct: false
    revealed_explanation: The lexical gap is the primary reason modern search systems
      require dense vector representations to bridge conceptual meaning.
  controls:
  - id: retrieval_mode
    label: Search Paradigm
    type: select
    default: Lexical Keyword (BM25)
    options:
    - Lexical Keyword (BM25)
    - Dense Semantic Embeddings
    description: Algorithm used to match documents
  - id: query_phrase
    label: Query Phrase
    type: select
    default: '"engine overheating during takeoff"'
    options:
    - '"engine overheating during takeoff"'
    - '"heart attack symptoms"'
    - '"fix memory leak"'
    description: Simulated user search query
  visualizer_type: system_blueprint
  visualizer_config:
    title: 'The Lexical Gap: BM25 Zero-Match vs Conceptual Equivalence'
- id: w21_s2_embedding_space_geometry
  title: High-Dimensional Embedding Spaces & Semantic Geometry
  subtitle: Mapping human knowledge into continuous geometric coordinate spaces
  scenario: How does an embedding neural network convert words and sentences into
    numbers that capture conceptual meaning?
  mechanism: The encoder maps text into an N-dimensional vector space (e.g. 1536 dimensions).
    During training on billions of text pairs, the network positions semantically
    related concepts close together. Words like "king" and "queen" share similar directional
    offsets to "man" and "woman", embedding latent semantic relationships directly
    into vector coordinates.
  prediction:
    prompt: In an embedding space, what geometric property indicates that two documents
      discuss similar topics?
    choices:
    - id: opt_a
      label: Their embedding vectors point in nearly the same geometric direction,
        resulting in a small angle between them.
      explanation: Correct! Semantic similarity maps to directional orientation in
        high-dimensional hyperspace.
      is_correct: true
    - id: opt_b
      label: Their vectors have identical file byte sizes on disk.
      explanation: Incorrect! All vectors of dimension N have the exact same byte
        footprint regardless of meaning.
      is_correct: false
    - id: opt_c
      label: Their coordinate values are always prime numbers.
      explanation: Nonsense! Embeddings consist of continuous floating-point numbers.
      is_correct: false
    revealed_explanation: Dense embeddings transform the subjective question of "What
      does this text mean?" into a rigorous geometric calculation.
  controls:
  - id: vector_dim
    label: Vector Dimensions
    type: slider
    default: 384
    min: 64
    max: 1536
    step: 64
    description: Embedding dimensionality (e.g. MiniLM vs text-embedding-3)
  - id: semantic_domain
    label: Knowledge Domain
    type: select
    default: Aerospace & Turbines
    options:
    - Aerospace & Turbines
    - Medical Pathology
    - Distributed Systems
    description: Domain cluster to visualize
  visualizer_type: system_blueprint
  visualizer_config:
    title: High-Dimensional Hypersphere Vector Projections
- id: w21_s3_dot_product_vs_cosine
  title: 'Dot Product vs Cosine Similarity: Isolating Angle from Magnitude'
  subtitle: Why unnormalized vector dot products skew rankings toward long documents
  scenario: 'You calculate the dot product between a short 5-word query vector and
    two candidate documents: Document A (a 10-word summary) and Document B (a 500-word
    detailed article). What unexpected bias occurs with raw dot product?'
  mechanism: "Dot product is A \xB7 B = ||A|| ||B|| cos(\u03B8). If a vector has a\
    \ large magnitude (common in unnormalized embeddings or longer passages), its\
    \ dot product can be artificially massive even when the angle \u03B8 is large\
    \ (poor conceptual match). Cosine Similarity divides by ||A|| ||B||, bounding\
    \ the score to [-1, 1] and measuring pure directional alignment."
  prediction:
    prompt: Why can raw Dot Product produce misleading retrieval rankings compared
      to Cosine Similarity?
    choices:
    - id: opt_a
      label: Raw dot product scales with vector magnitude; a long or heavily weighted
        document can achieve a higher dot product than a concise document that is
        much closer in actual semantic angle.
      explanation: "Correct! Dividing by norms isolates the angle \u03B8, ensuring\
        \ fair comparison regardless of text length or vector scale."
      is_correct: true
    - id: opt_b
      label: Dot product can only produce negative numbers.
      explanation: Incorrect! Dot products can be positive, negative, or zero.
      is_correct: false
    - id: opt_c
      label: Dot product is only supported on Apple Silicon chips.
      explanation: Nonsense! Dot product is a universal linear algebra operation.
      is_correct: false
    revealed_explanation: Cosine similarity standardizes vector comparisons, ensuring
      that retrieval is driven by semantic orientation rather than document length
      bias.
  controls:
  - id: metric_choice
    label: Distance Metric
    type: select
    default: Cosine Similarity (Normalized)
    options:
    - Cosine Similarity (Normalized)
    - Raw Dot Product (Unnormalized)
    description: Metric used for candidate ranking
  - id: doc_magnitude
    label: Document Vector Norm (Magnitude)
    type: slider
    default: 5
    min: 1
    max: 10
    step: 1
    description: Magnitude multiplier simulating passage length
  visualizer_type: system_blueprint
  visualizer_config:
    title: Dot Product Magnitude Skew vs Cosine Angle Normalization
- id: w21_s4_unit_normalization
  title: Unit Vector Normalization & Euclidean Equivalence
  subtitle: How pre-normalizing vectors turns expensive cosine calculations into fast
    dot products
  scenario: In production vector databases (pgvector, Milvus, Qdrant), computing cosine
    similarity across millions of rows is computationally intensive because of square
    roots and divisions. How do databases optimize this?
  mechanism: "Unit Normalization! During ingestion, every document vector is pre-normalized\
    \ to unit length: v_norm = v / ||v||, so ||v_norm|| = 1.0. When vectors are unit-normalized,\
    \ the cosine similarity formula simplifies to sim(A, B) = A_norm \xB7 B_norm.\
    \ The expensive square roots disappear, allowing real-time SIMD hardware dot products."
  prediction:
    prompt: When all vectors stored in a vector database are pre-normalized to unit
      length (||v|| = 1.0), what mathematical optimization becomes possible?
    choices:
    - id: opt_a
      label: Cosine similarity becomes identical to raw dot product, eliminating expensive
        square root calculations during real-time queries.
      explanation: Correct! Since the denominator ||A|| * ||B|| equals 1.0, cosine
        similarity reduces to a blazing-fast dot product.
      is_correct: true
    - id: opt_b
      label: The database size shrinks to 0 bytes.
      explanation: Incorrect! The floating-point numbers remain in storage.
      is_correct: false
    - id: opt_c
      label: Queries run in O(0) constant quantum time.
      explanation: Nonsense! Queries still require O(N * D) operations or index traversal.
      is_correct: false
    revealed_explanation: Pre-normalizing vectors at ingestion time is the bedrock
      optimization enabling vector databases to execute millions of nearest-neighbor
      checks per second.
  controls:
  - id: unit_normalization
    label: Pre-Normalize Vectors (||v|| = 1)
    type: toggle
    default: true
    description: Normalize vectors to unit sphere during indexing
  visualizer_type: system_blueprint
  visualizer_config:
    title: Unit Sphere Normalization & SIMD Dot Product Fast-Path
- id: w21_s5_top_k_rag_pipeline
  title: Top-K Nearest Neighbor Retrieval in Production RAG
  subtitle: Selecting the optimal context window budget for LLM generation
  scenario: 'A user asks an LLM: "Why did payment gateway webhook retries fail?" How
    does a RAG retrieval pipeline choose the exact passages to inject into the prompt?'
  mechanism: 'The query is embedded into a vector. The vector index executes a Top-K
    nearest neighbor search (e.g. K=3). The top 3 chunks with highest cosine similarity
    are retrieved and formatted into the LLM system prompt: "Context: {chunks} ...
    Answer: {query}". Choosing K balances context completeness against token cost
    and prompt distraction.'
  prediction:
    prompt: In a RAG pipeline, what happens if K is set too small (e.g. K=1) vs too
      large (e.g. K=50)?
    choices:
    - id: opt_a
      label: If K=1, crucial context might be missed (under-retrieval); if K=50, the
        LLM prompt context window is flooded with irrelevant noise (distraction and
        high token cost).
      explanation: Correct! Production RAG requires tuning K to provide sufficient
        factual grounding without diluting model attention.
      is_correct: true
    - id: opt_b
      label: If K=50, the LLM catches fire.
      explanation: Nonsense! The model simply spends more tokens and may hallucinate
        due to noise.
      is_correct: false
    - id: opt_c
      label: Changing K has zero effect on LLM output.
      explanation: Misconception! Context window contents directly dictate generative
        responses.
      is_correct: false
    revealed_explanation: Tuning Top-K and setting similarity cutoff thresholds are
      critical engineering levers in production RAG systems.
  controls:
  - id: top_k_slider
    label: Top-K Retrieved Chunks
    type: slider
    default: 3
    min: 1
    max: 10
    step: 1
    description: Number of document chunks injected into prompt
  - id: similarity_cutoff
    label: Similarity Cutoff Threshold
    type: slider
    default: 0.75
    min: 0.5
    max: 0.95
    step: 0.05
    description: Minimum cosine similarity required for inclusion
  visualizer_type: system_blueprint
  visualizer_config:
    title: RAG Prompt Context Assembly & Chunk Injection
