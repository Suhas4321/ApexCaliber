hints:
- If `not chunks or top_k <= 0`, return `[]` immediately.
- Compute `norm_q = math.sqrt(sum(q * q for q in query_vec))`. For each chunk, compute
  `dot` and `norm_c`.
- If either norm is 0, similarity is 0.0, else `round(dot / (norm_q * norm_c), 4)`.
  Sort chunks by similarity descending and return top_k results.
solution:
  code: "import math\n\nclass Solution:\n    def search_similar_chunks(self, query_vec:\
    \ list[float], chunks: list[dict], top_k: int) -> list[dict]:\n        if not\
    \ chunks or top_k <= 0:\n            return []\n\n        norm_q = math.sqrt(sum(q\
    \ * q for q in query_vec))\n        scored = []\n\n        for idx, chunk in enumerate(chunks):\n\
    \            emb = chunk.get(\"embedding\", [])\n            dot = sum(q * c for\
    \ q, c in zip(query_vec, emb))\n            norm_c = math.sqrt(sum(c * c for c\
    \ in emb))\n\n            if norm_q == 0.0 or norm_c == 0.0:\n               \
    \ sim = 0.0\n            else:\n                sim = round(dot / (norm_q * norm_c),\
    \ 4)\n\n            scored.append({\n                \"id\": chunk.get(\"id\"\
    ),\n                \"text\": chunk.get(\"text\"),\n                \"similarity\"\
    : sim,\n                \"_order\": idx,\n            })\n\n        scored.sort(key=lambda\
    \ x: (-x[\"similarity\"], x[\"_order\"]))\n\n        return [\n            {\"\
    id\": s[\"id\"], \"text\": s[\"text\"], \"similarity\": s[\"similarity\"]}\n \
    \           for s in scored[:top_k]\n        ]\n"
  explanation: 'Cosine similarity quantifies the angle between the query vector and
    document embeddings in D dimensions.

    By iterating through candidate chunks, computing normalized dot products, and
    sorting descending,

    the nearest semantic neighbors are identified and returned to ground the LLM''s
    response.

    '
  time: O(N * D + N log N) where N is chunks and D is embedding dimension
  space: O(N) for scored result items
pitch_script: '**(Clarify)** "We need to compute cosine similarity between a query
  embedding and candidate text chunks, returning the top-K chunks sorted by descending
  similarity."


  **(Basement Insight)** "Keyword matching fails when users use synonyms or colloquial
  terms. Dense embedding vectors map text to continuous vector spaces, where conceptual
  similarity corresponds to vector angle. Normalizing by vector length makes similarity
  independent of document verbosity."


  **(Solution)** "We compute query norm once. For each chunk, we calculate the dot
  product and chunk norm. If either norm is zero, similarity is 0.0; otherwise it
  is dot / (norm_q * norm_c). We sort candidates descending by score and slice the
  top-K elements."


  **(Complexity)** "Runs in O(N * D) math time and O(N log N) sort time, using O(N)
  space."

  '
twist:
  lc: 9602
  title: HNSW Approximate Nearest Neighbors (ANN) Graph Indexing
  why: Exact brute-force cosine comparison takes O(N * D), which is too slow for 10
    million vectors. Index the vectors using Hierarchical Navigable Small World (HNSW)
    graphs to search in O(log N) time.
