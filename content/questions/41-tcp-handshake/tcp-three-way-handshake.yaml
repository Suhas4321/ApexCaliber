slug: tcp-three-way-handshake
lc: 9702
citadel_id: computer_networking
brick_layer: 1
runner_type: python_practical
concept:
  problem_it_solves: How do two computers establish a reliable, in-order byte stream
    over an unreliable internet that drops, re-orders, and duplicates packets? If
    computers simply started transmitting data without synchronization (like UDP),
    lost packets corrupt data files, and out-of-order packets scramble financial transactions.
    Why can't we use a simple 2-way handshake (Client says "Connect", Server says
    "OK")? In distributed systems, network delays mean old, duplicated "Connect" packets
    from crashed past sessions can arrive minutes later. A 2-way handshake would force
    the server to allocate socket memory for a ghost connection! The TCP 3-Way Handshake
    (SYN → SYN-ACK → ACK) mathematically guarantees that BOTH sender and receiver
    agree on initial sequence numbers (ISNs) and confirm that both transmission and
    reception directions are operational before allocating connection memory.
  brute_force: Transmitting raw payloads without handshakes (UDP). Packets arrive
    jumbled, fragmented, or missing, requiring application code to manually invent
    retransmission and deduplication protocols.
  brute_force_complexity: O(N) uncoordinated dropped packets with silent data corruption.
  key_insight: 1. Client sends SYN with random sequence number `client_isn`. State
    transitions from CLOSED to SYN_SENT. 2. Server receives SYN, picks `server_isn`,
    and responds with SYN-ACK acknowledging `ack = client_isn + 1`. State transitions
    from LISTEN to SYN_RCVD. 3. Client receives SYN-ACK, confirms `ack == client_isn
    + 1`, and sends final ACK with `ack = server_isn + 1`. Client transitions to ESTABLISHED.
    4. Server receives ACK, validates `ack == server_isn + 1`, and transitions to
    ESTABLISHED. The socket is now ready for HTTP/TLS data exchange.
  real_world: Stripe and PayPal payment webhooks, database connection pool initializations,
    Nginx reverse proxy upstream handshakes, and TCP SYN flood mitigation (SYN Cookies).
statement:
  clean: "Implement a **TCP 3-Way Handshake Connection State Machine**:\n`simulate_tcp_handshake(client_isn:\
    \ int, server_isn: int, packet_events: list[str]) -> dict`.\n\n### Connection\
    \ States\n- Client states: `\"CLOSED\"` -> `\"SYN_SENT\"` -> `\"ESTABLISHED\"\
    `\n- Server states: `\"LISTEN\"` -> `\"SYN_RCVD\"` -> `\"ESTABLISHED\"`\n\n###\
    \ Handshake Rules:\n1. Initial State:\n   - `client_state = \"CLOSED\"`\n   -\
    \ `server_state = \"LISTEN\"`\n   - `client_seq = client_isn`\n   - `server_seq\
    \ = server_isn`\n   - `packets_transmitted: list[dict] = []`\n2. Step 1: Client\
    \ initiates connection\n   - Client transmits `SYN`: `{\"type\": \"SYN\", \"seq\"\
    : client_seq, \"ack\": 0}`.\n   - `client_state` becomes `\"SYN_SENT\"`.\n   -\
    \ Append packet to `packets_transmitted`.\n3. Step 2: Server responds to SYN\n\
    \   - If `\"DROP_SYN\"` is in `packet_events`: the SYN packet was lost in transit.\n\
    \     Connection stalls: return immediately with current states.\n   - Server\
    \ receives `SYN`: validates that `client_state == \"SYN_SENT\"`.\n   - Server\
    \ prepares `SYN-ACK`: `{\"type\": \"SYN-ACK\", \"seq\": server_seq, \"ack\": client_seq\
    \ + 1}`.\n   - `server_state` becomes `\"SYN_RCVD\"`.\n   - Append packet to `packets_transmitted`.\n\
    4. Step 3: Client acknowledges SYN-ACK\n   - If `\"DROP_SYN_ACK\"` is in `packet_events`:\
    \ the SYN-ACK packet was lost in transit.\n     Connection stalls: return immediately\
    \ with current states.\n   - Client receives `SYN-ACK`: checks if packet `ack\
    \ == client_seq + 1`.\n   - Client prepares final `ACK`: `{\"type\": \"ACK\",\
    \ \"seq\": client_seq + 1, \"ack\": server_seq + 1}`.\n   - `client_state` becomes\
    \ `\"ESTABLISHED\"`.\n   - Append packet to `packets_transmitted`.\n5. Step 4:\
    \ Server processes final ACK\n   - If `\"DROP_ACK\"` is in `packet_events`: the\
    \ final ACK was lost.\n     Return with current states.\n   - Server receives\
    \ `ACK`: checks if packet `ack == server_seq + 1`.\n   - `server_state` becomes\
    \ `\"ESTABLISHED\"`.\n6. Return summary dictionary:\n   - `\"client_state\"`:\
    \ str\n   - `\"server_state\"`: str\n   - `\"is_connected\"`: bool (`True` if\
    \ both client and server are `\"ESTABLISHED\"`, else `False`)\n   - `\"packets_transmitted\"\
    `: list of packet dictionaries\n   - `\"syn_ack_number\"`: int (the ack number\
    \ in SYN-ACK packet, or `0` if not reached)\n   - `\"final_ack_number\"`: int\
    \ (the ack number in final ACK packet, or `0` if not reached)\n"
  oa_story: '**Razorpay Payment Gateway — Zombie Connection Outage**


    During Diwali flash sales, a legacy payment webhook service crashed because it
    used a naive 2-way handshake.

    Delayed network packets from dropped cellular connections triggered the server
    to allocate 50,000 idle TCP socket control blocks (TCBs).

    The server ran out of Linux file descriptors, preventing real payments from completing.


    Implement this strict TCP 3-Way Handshake state machine with dropped-packet resilience
    to ensure sockets only enter ESTABLISHED when both endpoints acknowledge sequence
    numbers.

    '
  trigger_keywords:
  - TCP 3-Way Handshake
  - simulate_tcp_handshake
  - is_connected
  - packets_transmitted
  - SYN_SENT
  examples:
  - input: client_isn = 1000, server_isn = 5000, packet_events = []
    output: '{"client_state": "ESTABLISHED", "server_state": "ESTABLISHED", "is_connected":
      true, "packets_transmitted": [{"type": "SYN", "seq": 1000, "ack": 0}, {"type":
      "SYN-ACK", "seq": 5000, "ack": 1001}, {"type": "ACK", "seq": 1001, "ack": 5001}],
      "syn_ack_number": 1001, "final_ack_number": 5001}'
    explanation: Complete successful 3-way handshake with incremented acknowledgment
      numbers.
  - input: client_isn = 200, server_isn = 800, packet_events = ["DROP_SYN_ACK"]
    output: '{"client_state": "SYN_SENT", "server_state": "SYN_RCVD", "is_connected":
      false, "packets_transmitted": [{"type": "SYN", "seq": 200, "ack": 0}, {"type":
      "SYN-ACK", "seq": 800, "ack": 201}], "syn_ack_number": 201, "final_ack_number":
      0}'
    explanation: SYN-ACK was dropped; client remains in SYN_SENT and connection is
      not established.
  constraints:
  - 1 <= client_isn <= 1000000
  - 1 <= server_isn <= 1000000
  - 0 <= len(packet_events) <= 5
constraint_quiz:
  prompt: Why must both Client and Server increment the received Sequence Number by
    1 in their ACK response?
  options:
  - The SYN flag consumes exactly 1 sequence number in the TCP stream, so acknowledging
    it confirms receipt of that specific control byte
  - Because TCP only supports incrementing numbers by 1
  - To signal to the router to upgrade from IPv4 to IPv6
  - To allocate 1 MB of socket buffer in Linux kernel
  answer: 0
  explanation: 'Control flags like SYN and FIN consume one sequence number in TCP
    stream counting. Setting ACK = SEQ + 1 explicitly informs the sender: ''I have
    received your SYN at sequence SEQ, and I expect byte SEQ + 1 next''.'
pattern_quiz:
  prompt: What is a TCP SYN Flood attack and how do SYN Cookies defend against it?
  options:
  - An attacker sends millions of SYN packets with spoofed IPs without sending final
    ACKs to exhaust server memory; SYN Cookies encode connection state inside the
    server's ISN sequence number so zero memory is allocated until the final ACK arrives
  - An attacker sends large HTTP POST bodies to fill server disk space
  - An attacker overrides DNS cache records with malicious IP addresses
  - An attacker requests all ephemeral ports simultaneously
  answer: 0
  explanation: In a SYN flood, half-open connections in SYN_RCVD state exhaust the
    server's SYN backlog queue. SYN Cookies eliminate the state table entirely by
    cryptographically hashing client IP, port, and timestamp into the server ISN.
