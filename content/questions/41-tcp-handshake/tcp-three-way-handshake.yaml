  lab_starter_code: "class Solution:\n    def simulate_tcp_handshake(self, client_isn:\
    \ int, server_isn: int, packet_events: list[str]) -> dict:\n        # Implement\
    \ TCP 3-Way Handshake Connection State Machine\n        pass\n"
  lab_solution: "class Solution:\n    def simulate_tcp_handshake(self, client_isn:\
    \ int, server_isn: int, packet_events: list[str]) -> dict:\n        client_state\
    \ = \"CLOSED\"\n        server_state = \"LISTEN\"\n        packets_transmitted\
    \ = []\n\n        # Step 1: Client sends SYN\n        client_state = \"SYN_SENT\"\
    \n        packets_transmitted.append({\"type\": \"SYN\", \"seq\": client_isn,\
    \ \"ack\": 0})\n\n        if \"DROP_SYN\" in packet_events:\n            return\
    \ {\n                \"client_state\": client_state,\n                \"server_state\"\
    : server_state,\n                \"packets_transmitted\": packets_transmitted,\n\
    \                \"connected\": False,\n            }\n\n        # Step 2: Server\
    \ sends SYN-ACK\n        server_state = \"SYN_RCVD\"\n        packets_transmitted.append({\"\
    type\": \"SYN-ACK\", \"seq\": server_isn, \"ack\": client_isn + 1})\n\n      \
    \  if \"DROP_SYN_ACK\" in packet_events:\n            return {\n             \
    \   \"client_state\": client_state,\n                \"server_state\": server_state,\n\
    \                \"packets_transmitted\": packets_transmitted,\n             \
    \   \"connected\": False,\n            }\n\n        # Step 3: Client sends ACK\n\
    \        client_state = \"ESTABLISHED\"\n        packets_transmitted.append({\"\
    type\": \"ACK\", \"seq\": client_isn + 1, \"ack\": server_isn + 1})\n\n      \
    \  if \"DROP_ACK\" in packet_events:\n            return {\n                \"\
    client_state\": client_state,\n                \"server_state\": server_state,\n\
    \                \"packets_transmitted\": packets_transmitted,\n             \
    \   \"connected\": False,\n            }\n\n        # Step 4: Server processes\
    \ ACK\n        server_state = \"ESTABLISHED\"\n\n        return {\n          \
    \  \"client_state\": client_state,\n            \"server_state\": server_state,\n\
    \            \"packets_transmitted\": packets_transmitted,\n            \"connected\"\
    : True,\n        }\n"
