  - "Step 1: client sends `{'type': 'SYN', 'seq': client_isn, 'ack': 0}`, state becomes 'SYN_SENT'."
  - "If 'DROP_SYN' in packet_events, return immediately. Otherwise server state becomes 'SYN_RCVD', responds with SYN-ACK."
  - "If 'DROP_SYN_ACK' in packet_events, return. Otherwise client transitions to 'ESTABLISHED', sends ACK. If 'DROP_ACK' in packet_events, return; otherwise server becomes 'ESTABLISHED'."

solution:
  code: |
    class Solution:
        def simulate_tcp_handshake(self, client_isn: int, server_isn: int, packet_events: list[str]) -> dict:
            client_state = "CLOSED"
            server_state = "LISTEN"
            packets: list[dict] = []
            syn_ack_num = 0
            final_ack_num = 0

            # Step 1: Client sends SYN
            syn_pkt = {"type": "SYN", "seq": client_isn, "ack": 0}
            packets.append(syn_pkt)
            client_state = "SYN_SENT"

            if "DROP_SYN" in packet_events:
                return {
                    "client_state": client_state,
                    "server_state": server_state,
                    "is_connected": False,
                    "packets_transmitted": packets,
                    "syn_ack_number": syn_ack_num,
                    "final_ack_number": final_ack_num,
                }

            # Step 2: Server receives SYN and responds with SYN-ACK
            server_state = "SYN_RCVD"
            syn_ack_num = client_isn + 1
            syn_ack_pkt = {"type": "SYN-ACK", "seq": server_isn, "ack": syn_ack_num}
            packets.append(syn_ack_pkt)

            if "DROP_SYN_ACK" in packet_events:
                return {
                    "client_state": client_state,
                    "server_state": server_state,
                    "is_connected": False,
                    "packets_transmitted": packets,
                    "syn_ack_number": syn_ack_num,
                    "final_ack_number": final_ack_num,
                }

            # Step 3: Client receives SYN-ACK and sends final ACK
            client_state = "ESTABLISHED"
            final_ack_num = server_isn + 1
            ack_pkt = {"type": "ACK", "seq": client_isn + 1, "ack": final_ack_num}
            packets.append(ack_pkt)

            if "DROP_ACK" in packet_events:
                return {
                    "client_state": client_state,
                    "server_state": server_state,
                    "is_connected": False,
                    "packets_transmitted": packets,
                    "syn_ack_number": syn_ack_num,
                    "final_ack_number": final_ack_num,
                }

            # Step 4: Server receives ACK
            server_state = "ESTABLISHED"

            return {
                "client_state": client_state,
                "server_state": server_state,
                "is_connected": True,
                "packets_transmitted": packets,
                "syn_ack_number": syn_ack_num,
                "final_ack_number": final_ack_num,
            }
  explanation: >-
    The 3-way handshake prevents phantom half-open connections. Both sides exchange initial sequence numbers (ISNs)
    and acknowledge each other with seq + 1 before any application data buffers are allocated, ensuring guaranteed
    bidirectional ordering.
  time: O(1) state transitions
  space: O(1) packet buffers

pitch_script: |
  **(Clarify)** "We need to simulate the state transitions and packet sequence numbers of a TCP 3-way handshake under normal and dropped-packet scenarios."

  **(Brute force)** "A 2-way handshake allows duplicate delayed SYN packets to create phantom connections on the server, exhausting socket table memory."

  **(Trigger)** "Reliable connection establishment and sequence number negotiation signals the TCP SYN -> SYN-ACK -> ACK state machine."

  **(Optimal)** "Client sends SYN(seq=X) -> SYN_SENT. Server replies SYN-ACK(seq=Y, ack=X+1) -> SYN_RCVD. Client replies ACK(seq=X+1, ack=Y+1) -> ESTABLISHED. When server processes ACK, it enters ESTABLISHED."

  **(Complexity)** "Executes in O(1) constant time and space."

twist:
  lc: 9703
  title: HTTP/1.1 Head-of-Line Blocking vs HTTP/2 Binary Framing
  why: While TCP guarantees in-order byte delivery, any single dropped packet stalls all higher-level streams sharing the connection (Head-of-Line Blocking), which HTTP/3 solves by moving to QUIC over UDP.

