journey:
- id: w13_s1_pyobject_overhead
  title: PyObject Overhead & Why Python Consumes More RAM Than C
  subtitle: The 28-byte integer structure and pointer indirection overhead
  scenario: In C, an array of 1,000,000 64-bit integers takes exactly 8MB of RAM (10^6
    * 8 bytes). In Python, a list of 1,000,000 integers takes over 36MB. Why?
  mechanism: Every integer in CPython is a full PyLongObject structure containing
    ob_refcnt (8 bytes), ob_type pointer (8 bytes), ob_size (8 bytes), and a digit
    array (4+ bytes), totaling 28 bytes per int! The PyListObject is an array of 8-byte
    pointers pointing to these distinct heap allocations. Thus, eager collections
    suffer a massive memory amplification factor.
  prediction:
    prompt: How much heap memory does Python allocate for a list of 1,000,000 integers
      compared to a contiguous C array?
    choices:
    - id: opt_a
      label: Around 4x to 5x more memory (~36MB to 40MB vs 8MB) due to 28-byte PyObject
        headers and 8-byte pointer indirection for every single number.
      explanation: Correct! Python objects carry reference counts, type metadata,
        and pointer references that multiply memory consumption.
      is_correct: true
    - id: opt_b
      label: Exactly the same (8MB) because all modern compilers optimize memory identically.
      explanation: Misconception! Python is dynamically typed; each object requires
        runtime type metadata and reference counting headers.
      is_correct: false
    - id: opt_c
      label: Less memory (4MB) because Python automatically compresses lists.
      explanation: Incorrect! Standard Python lists do not compress data; they store
        arrays of pointers to heap objects.
      is_correct: false
    revealed_explanation: PyObject memory overhead explains why materializing millions
      of items into standard Python lists rapidly exhausts system RAM.
  controls:
  - id: element_count
    label: Element Count
    type: slider
    default: 1000000
    min: 100000
    max: 5000000
    step: 100000
    description: Simulated number of integers stored
  - id: data_structure
    label: Data Structure
    type: select
    default: Python List of Ints
    options:
    - Python List of Ints
    - NumPy Contiguous C Array
    - Python Generator
    description: Storage representation in physical memory
  visualizer_type: system_blueprint
  visualizer_config:
    title: PyLongObject Memory Layout vs Contiguous C Buffer
- id: w13_s2_eager_materialization_danger
  title: 'Eager Materialization: The Danger of readlines() and Lists'
  subtitle: How loading 10GB log files triggers the Linux kernel OOM killer
  scenario: 'You need to filter 5xx errors from a 10GB access log file on a server
    with 2GB of physical RAM. You run: errors = [line for line in open("log.txt").readlines()
    if "500" in line]. What happens?'
  mechanism: file.readlines() reads the entire 10GB file from disk into RAM at once,
    allocating thousands of string PyObject instances. Then the list comprehension
    creates a second list in memory. Because total memory demand exceeds physical
    RAM and swap space, the Linux kernel OOM killer terminates the process immediately
    with signal 9.
  prediction:
    prompt: What happens when an engineer calls .readlines() on a 10GB file on an
      8GB RAM production machine?
    choices:
    - id: opt_a
      label: The operating system runs out of physical memory and swap, triggering
        an Out-Of-Memory (OOM) kill that terminates the process with signal 9.
      explanation: Correct! readlines() attempts to eagerly buffer the entire file
        in RAM, triggering an immediate kernel OOM kill.
      is_correct: true
    - id: opt_b
      label: Python automatically pauses the code and downloads more RAM from the
        cloud.
      explanation: Nonsense! The operating system enforces hard memory limits.
      is_correct: false
    - id: opt_c
      label: Python writes the overflow lines to CPU cache without performance loss.
      explanation: Incorrect! CPU cache is tiny (a few megabytes) and cannot hold
        gigabytes of data.
      is_correct: false
    revealed_explanation: Eager materialization scales memory as O(N). Production
      data pipelines must never buffer unbounded datasets into memory lists.
  controls:
  - id: file_size_gb
    label: Log File Size (GB)
    type: slider
    default: 10
    min: 1
    max: 30
    step: 1
    description: Size of log file on disk
  - id: server_ram_gb
    label: Available System RAM (GB)
    type: slider
    default: 8
    min: 2
    max: 16
    step: 2
    description: Physical hardware memory allocation
  visualizer_type: system_blueprint
  visualizer_config:
    title: Heap Allocation Surge vs Linux OOM Killer Threshold
- id: w13_s3_generator_yield_state_machine
  title: The Generator Function & yield Stack Suspension
  subtitle: How CPython preserves execution frames for O(1) memory iteration
  scenario: When Python encounters a function containing the yield keyword, how does
    it differ from a standard function returning a list?
  mechanism: Calling a generator function does not execute the body immediately; it
    returns a generator object. When next() is called, the CPython interpreter executes
    bytecode until it hits yield. It captures the current value, saves the frame's
    execution state (instruction pointer, local variables), and yields control back
    to the caller. On the next call, it resumes exactly where it stopped. Memory consumption
    remains strictly O(1).
  prediction:
    prompt: When a Python function containing the yield keyword is invoked as gen
      = my_func(), what happens?
    choices:
    - id: opt_a
      label: The function does not run immediately; it returns a suspended generator
        object without executing any loop iterations or allocating collections.
      explanation: Correct! Generator functions return a suspended iterator object
        immediately; execution begins only when next() is called.
      is_correct: true
    - id: opt_b
      label: The entire function executes from start to end and returns a completed
        list.
      explanation: Misconception! If it executed eagerly, it would behave like a regular
        function, defeating the purpose of yield.
      is_correct: false
    - id: opt_c
      label: Python creates a background thread that executes the loop asynchronously.
      explanation: Incorrect! Generators are single-threaded coroutine state machines,
        not background threads.
      is_correct: false
    revealed_explanation: Generators turn function execution into an on-demand state
      machine, enabling infinite or massive sequences to be consumed with zero memory
      buildup.
  controls:
  - id: step_execution
    label: Step Next (yield)
    type: button
    default: true
    description: Advance generator to next yield point
  - id: frame_inspection
    label: Inspect Frame State
    type: select
    default: Instruction Pointer
    options:
    - Instruction Pointer
    - Local Variables
    - Heap Footprint
    description: Examine CPython frame state machine
  visualizer_type: system_blueprint
  visualizer_config:
    title: CPython Frame State Machine & yield Suspension
- id: w13_s4_chained_generator_pipelines
  title: Chained Generator Pipelines (Filter -> Transform -> Sink)
  subtitle: Processing petabyte-scale data streams with constant working memory
  scenario: How can we build an end-to-end log processing pipeline that reads a 100GB
    log file, extracts 5xx errors, parses JSON, and computes average latency in 50MB
    of RAM?
  mechanism: 'Chain multiple generator expressions: raw_lines = (line for line in
    open("log.txt")), error_lines = (l for l in raw_lines if " 500 " in l), parsed
    = (parse_log(l) for l in error_lines). Each record flows through all 3 stages
    individually in a "pull" architecture before the next line is read from disk,
    maintaining strictly O(1) working memory.'
  prediction:
    prompt: In a chained generator pipeline (Reader -> Filter -> Parser), how many
      log lines reside in RAM simultaneously?
    choices:
    - id: opt_a
      label: Exactly 1 record at any instant; each record is read, filtered, and processed
        before the next line is pulled from disk.
      explanation: Correct! Chained generators operate as a pull pipeline where one
        item at a time is demanded by the consumer.
      is_correct: true
    - id: opt_b
      label: All 100GB of log lines are loaded in parallel into a thread pool.
      explanation: Incorrect! There are no threads; execution is synchronous and lazy.
      is_correct: false
    - id: opt_c
      label: Exactly 1,024 lines because Python requires power-of-two buffer sizes.
      explanation: Misconception! While OS I/O buffers exist, application-level generator
        pipelines process items one by one.
      is_correct: false
    revealed_explanation: Chained generator pipelines allow Python applications to
      process datasets orders of magnitude larger than physical RAM with constant
      memory overhead.
  controls:
  - id: pipeline_stages
    label: Pipeline Stage Count
    type: slider
    default: 3
    min: 1
    max: 5
    step: 1
    description: Number of chained generator transformations
  - id: pull_mode
    label: Evaluation Mode
    type: select
    default: Lazy Pull Pipeline
    options:
    - Lazy Pull Pipeline
    - Eager Intermediate Lists
    description: Memory behavior of data flow
  visualizer_type: system_blueprint
  visualizer_config:
    title: Pipelined Generator Data Stream Flow
- id: w13_s5_generator_lifecycle_stopiteration
  title: 'Generator State Lifecycle: StopIteration & Resource Cleanup'
  subtitle: How for-loops terminate and how finally blocks protect file descriptors
  scenario: How does a for-loop know when a generator has finished, and how can resources
    (such as open file descriptors) be cleaned up cleanly?
  mechanism: 'When a generator reaches a return statement or the end of the code block,
    CPython raises a StopIteration exception. The standard Python for-loop catches
    this exception internally to terminate cleanly. If a generator is abandoned early,
    calling gen.close() raises a GeneratorExit exception inside the suspended frame,
    triggering any finally: cleanup blocks.'
  prediction:
    prompt: How does a standard Python "for item in generator:" loop determine when
      the generator has exhausted all items?
    choices:
    - id: opt_a
      label: The generator raises a StopIteration exception, which the for-loop catches
        internally to exit cleanly.
      explanation: 'Correct! Python iterators follow PEP 234: exhaustion is signaled
        via the StopIteration exception.'
      is_correct: true
    - id: opt_b
      label: The generator returns a special NULL pointer value.
      explanation: Incorrect! Python uses exception-driven iteration protocols, not
        NULL pointers.
      is_correct: false
    - id: opt_c
      label: Python polls the operating system file descriptor table.
      explanation: Nonsense! Iteration protocols are entirely internal to the Python
        runtime.
      is_correct: false
    revealed_explanation: Understanding StopIteration and GeneratorExit ensures proper
      exception handling and deterministic resource cleanup when streaming large datasets.
  controls:
  - id: lifecycle_action
    label: Trigger Lifecycle Event
    type: select
    default: Normal Exhaustion
    options:
    - Normal Exhaustion
    - Early Break (close)
    - Unhandled Exception
    description: Simulate generator termination scenarios
  visualizer_type: system_blueprint
  visualizer_config:
    title: 'Generator Lifecycle: yield -> StopIteration / GeneratorExit'
