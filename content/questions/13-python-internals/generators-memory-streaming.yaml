drills:
- title: Filter with yield
  skill: setup
  goal: Write a simple generator that yields only numbers meeting a threshold.
  instructions: 'Return a list of all numbers in `nums` that are >= `threshold`.

    '
  function:
    name: filter_ge
    params:
    - name: nums
    - name: threshold
  starter_code: "class Solution:\n    def filter_ge(self, nums: list[int], threshold:\
    \ int) -> list[int]:\n        pass\n"
  tests:
  - args:
    - - 100
      - 500
      - 200
      - 503
    - 500
    expected:
    - 500
    - 503
  - args:
    - - 200
      - 201
      - 204
    - 300
    expected: []
  - args:
    - []
    - 100
    expected: []
  solution: "class Solution:\n    def filter_ge(self, nums: list[int], threshold:\
    \ int) -> list[int]:\n        def _gen():\n            for x in nums:\n      \
    \          if x >= threshold:\n                    yield x\n        return list(_gen())\n"
  hint: Use `yield x` inside the loop and wrap the generator in `list()`.
