      - 2
      - 3
      - 4
      - 5
    - 2
    expected:
    - - 1
      - 2
    - - 3
      - 4
    - - 5
  - args:
    - - 1
      - 2
    - 3
    expected:
    - - 1
      - 2
  - args:
    - []
    - 2
    expected: []
  solution: "class Solution:\n    def chunk_list(self, items: list[int], k: int) ->\
    \ list[list[int]]:\n        res = []\n        for i in range(0, len(items), k):\n\
    \            res.append(items[i : i + k])\n        return res\n"
  hint: Use range(0, len(items), k) to slice items[i:i+k].
hints:
- Split each line with `.strip().split()` and verify it has 4 tokens.
- Check if 500 <= int(tokens[1]) <= 599.
- Create a generator function that yields parsed dicts, then collect into a list.
solution:
  code: "class Solution:\n    def parse_error_logs(self, raw_lines: list[str]) ->\
    \ list[dict]:\n        def _stream_errors():\n            for raw in raw_lines:\n\
    \                line = raw.strip()\n                if not line:\n          \
    \          continue\n                parts = line.split()\n                if\
    \ len(parts) != 4:\n                    continue\n                status = int(parts[1])\n\
    \                if 500 <= status <= 599:\n                    yield {\n     \
    \                   \"status\": status,\n                        \"path\": parts[2],\n\
    \                        \"latency\": int(parts[3]),\n                    }\n\
    \        return list(_stream_errors())\n"
  explanation: 'The internal generator `_stream_errors` processes the incoming lines
    sequentially.

    Empty strings and malformed records are cleanly ignored without raising uncaught
    exceptions.

    Matching 5xx records are yielded lazily, decoupling the parsing mechanics from
    the downstream

    consumption.

    '
  time: "O(N) \u2014 each line is scanned and split once"
  space: O(K) where K is the number of 5xx errors returned
pitch_script: '**(Clarify)** "We need to parse incoming log records, filter for 5xx
  server errors, and return structured dictionaries with status, path, and latency."


  **(Basement Insight)** "When parsing large logs in Python, naive operations like
  `file.readlines()` allocate all records into a single gigantic list on the heap,
  triggering an OOM crash. By utilizing generators and `yield`, each record is evaluated
  lazily in O(1) auxiliary memory."


  **(Solution)** "We build a generator pipeline that cleans whitespace, skips non-conforming
  lines, checks `500 <= status <= 599`, and yields the parsed dictionary. In production,
  this generator can feed directly into a streaming Kafka publisher or SQLite batch
  insert."


  **(Complexity)** "Time complexity is O(N) across N lines. Auxiliary memory is O(1)
  for the generator pipeline itself."

  '
