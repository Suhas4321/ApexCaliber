    expected: true
  - args:
    - PROCESSING
    expected: false
  solution: "class Solution:\n    def drill_is_terminal(self, status: str) -> bool:\n\
    \        return status in (\"SUCCESS\", \"FAILED\")\n"
  hint: Check status in ('SUCCESS', 'FAILED').
hints:
- Sort timeline milestones by integer timestamp.
- In each attempt, lookup the status for `current_time`. If terminal, return immediately;
  otherwise add interval and multiply interval by backoff factor.
- '| # Pseudocode Blueprint

  | current_time = 0, interval = initial_interval, attempts = 0

  | while attempts < max_attempts:

  |     attempts += 1

  |     st = lookup_status(current_time)

  |     if st in ["SUCCESS", "FAILED"]: return True, st, attempts, current_time

  |     current_time += interval

  |     interval = min(int(interval * multiplier), max_interval)

  | return False, "TIMEOUT", attempts, current_time'
solution:
  code: "class Solution:\n    def simulate_job_polling(self, job_timeline: dict, initial_interval_ms:\
    \ int, backoff_multiplier: float, max_interval_ms: int, max_attempts: int) ->\
    \ dict:\n        current_time = 0\n        interval = initial_interval_ms\n  \
    \      attempts = 0\n        sorted_milestones = sorted(int(k) for k in job_timeline.keys())\n\
    \n        def get_status(t: int) -> str:\n            current_status = \"PENDING\"\
    \n            for m in sorted_milestones:\n                if m <= t:\n      \
    \              current_status = job_timeline.get(str(m), job_timeline.get(m))\n\
    \                else:\n                    break\n            return current_status\n\
    \n        while attempts < max_attempts:\n            attempts += 1\n        \
    \    st = get_status(current_time)\n            if st in [\"SUCCESS\", \"FAILED\"\
    ]:\n                return {\n                    \"completed\": True,\n     \
    \               \"status\": st,\n                    \"attempts\": attempts,\n\
    \                    \"total_time_ms\": current_time,\n                }\n   \
    \         current_time += interval\n            interval = min(int(interval *\
    \ backoff_multiplier), max_interval_ms)\n\n        return {\n            \"completed\"\
    : False,\n            \"status\": \"TIMEOUT\",\n            \"attempts\": attempts,\n\
    \            \"total_time_ms\": current_time,\n        }\n"
  explanation: Simulating the polling client tracks time progression and polls status
    at each interval. Multiplying the interval by the backoff multiplier while capping
    at `max_interval_ms` prevents client polling storms while ensuring timely detection
    of terminal states.
  time: O(A * M) where A is max_attempts and M is milestone count
  space: O(M) for sorted timeline milestones
pitch_script: '**(Clarify)** "We need to simulate an asynchronous job polling loop
  with exponential backoff and a maximum interval cap, checking status progression
  until a terminal state or timeout occurs."


  **(Brute force)** "Polling in a tight fixed-interval loop floods backend services
  with millions of unnecessary database queries."


  **(Trigger)** "Tracking long-running job status transitions using expanding time
  intervals signals exponential backoff polling."


  **(Optimal)** "We start at time 0. For each attempt, we lookup the latest status
  on the timeline. If the job reached SUCCESS or FAILED, we return completion immediately.
  Otherwise, we increment time by the current interval and scale the interval by the
  multiplier, capped by `max_interval_ms`."


  **(Complexity)** "Executes in O(A * M) time for A attempts and M milestones with
  O(M) space." '
