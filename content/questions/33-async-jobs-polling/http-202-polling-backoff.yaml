journey:
- id: w33_s1_proxy_timeouts
  title: The 60-Second Proxy Timeout & Why Long Requests Fail
  subtitle: Why keeping HTTP connections open causes HTTP 504 Gateway Timeouts
  scenario: A user clicks "Generate 100-Page PDF Invoice". The PDF takes 90 seconds
    to render on the backend. What happens if the browser waits synchronously on a
    single POST request?
  mechanism: Modern cloud infrastructure routes traffic through reverse proxies and
    load balancers (Cloudflare, AWS ALB, Nginx). These intermediaries enforce hard
    connection timeout ceilings (typically 30s to 60s). If the backend does not return
    an HTTP response within this window, the proxy forcibly cuts the TCP socket and
    returns an HTTP 504 Gateway Timeout, even if the backend is still running the
    task.
  prediction:
    prompt: What happens to a client waiting synchronously on an HTTP request that
      takes 90 seconds on a cloud server behind an AWS ALB?
    choices:
    - id: opt_a
      label: The ALB drops the connection around 60 seconds and returns an HTTP 504
        Gateway Timeout error.
      explanation: Correct! Reverse proxies and load balancers terminate idle connections
        that exceed their timeout threshold.
      is_correct: true
    - id: opt_b
      label: The connection stays open indefinitely until the CPU finishes.
      explanation: Misconception! Cloud proxies actively protect their socket pools
        by enforcing timeout ceilings.
      is_correct: false
    - id: opt_c
      label: The browser automatically converts the connection into a WebSocket.
      explanation: Nonsense! Standard HTTP requests cannot magically upgrade protocols
        mid-flight.
      is_correct: false
    revealed_explanation: Synchronous HTTP is designed for sub-second request/response
      cycles. Long-running tasks must be handled asynchronously.
  controls:
  - id: task_duration_s
    label: Task Execution Time (Seconds)
    type: slider
    default: 90
    min: 10
    max: 180
    step: 10
    description: Time required by worker to complete task
  - id: proxy_timeout_s
    label: Proxy Timeout Ceiling (Seconds)
    type: slider
    default: 60
    min: 30
    max: 120
    step: 10
    description: Reverse proxy idle connection timeout
  visualizer_type: system_blueprint
  visualizer_config:
    title: Reverse Proxy 60s Timeout Cliff
- id: w33_s2_http_202_contract
  title: The HTTP 202 Accepted Pattern & Decoupled Task Ingestion
  subtitle: Returning job identifiers in milliseconds while background workers compute
  scenario: How should an API handle operations that take longer than a few seconds
    without risking gateway timeouts?
  mechanism: 'The asynchronous pattern: 1. The client sends POST /reports. 2. The
    server creates a background task (in Celery/SQS), generates a job_id, and immediately
    responds in 20ms with HTTP 202 Accepted and header Location: /jobs/42. 3. The
    client periodically polls GET /jobs/42 until status transitions from PENDING ->
    PROCESSING -> SUCCESS.'
  prediction:
    prompt: What is the primary semantic meaning of an HTTP 202 Accepted response
      code?
    choices:
    - id: opt_a
      label: The request has been accepted for processing, but processing has not
        been completed.
      explanation: Correct! RFC 9110 specifies 202 Accepted for batch and asynchronous
        processing workflows.
      is_correct: true
    - id: opt_b
      label: The request was rejected because the server is out of memory.
      explanation: Incorrect! 202 means successful acceptance, not rejection.
      is_correct: false
    - id: opt_c
      label: The transaction was committed and completed synchronously.
      explanation: Incorrect! Synchronous completion uses 200 OK or 201 Created.
      is_correct: false
    revealed_explanation: HTTP 202 decouples request acceptance from task execution,
      allowing workers to process workloads asynchronously.
  controls:
  - id: architecture_style
    label: Task Processing Architecture
    type: select
    default: Async Worker with HTTP 202
    options:
    - Async Worker with HTTP 202
    - Synchronous Blocking Handler
    description: How backend schedules long-running workload
  visualizer_type: system_blueprint
  visualizer_config:
    title: HTTP 202 Accepted & Task Queue Ingestion
- id: w33_s3_polling_thundering_herd
  title: The Polling Stampede & The Thundering Herd Problem
  subtitle: How 50,000 clients polling every 100ms generate 500,000 QPS and crash
    databases
  scenario: 50,000 users initiate background export tasks. If all client applications
    poll /jobs/{id} every 100 milliseconds in a simple loop, what happens to the database?
  mechanism: 50,000 clients * 10 requests/sec = 500,000 queries per second hitting
    the status endpoint! Because background tasks take 30-60 seconds, millions of
    redundant queries flood the API gateway and database, depleting connection pools
    and causing system-wide cascading failure.
  prediction:
    prompt: If 100,000 clients poll a status endpoint every 200ms while waiting for
      a 1-minute job, what query rate does the backend experience?
    choices:
    - id: opt_a
      label: 500,000 requests per second, creating a catastrophic thundering herd
        stampede that exhausts server connection pools.
      explanation: Correct! 100,000 * (1000ms / 200ms) = 500,000 requests every single
        second.
      is_correct: true
    - id: opt_b
      label: Only 1 request per second because the browser caches the response.
      explanation: Misconception! Polling endpoints return dynamic status and cannot
        be aggressively cached.
      is_correct: false
    - id: opt_c
      label: Exactly 0 requests because HTTP 202 eliminates polling.
      explanation: Nonsense! HTTP 202 requires the client to discover completion via
        polling or WebSockets.
      is_correct: false
    revealed_explanation: Fixed-interval tight polling loops generate unsustainable
      query volumes. Clients must back off exponentially.
  controls:
  - id: concurrent_clients
    label: Concurrent Polling Clients
    type: slider
    default: 50000
    min: 1000
    max: 100000
    step: 5000
    description: Number of active browser tabs polling for results
  - id: polling_strategy
    label: Polling Strategy
    type: select
    default: Fixed 100ms Tight Loop (Thundering Herd)
    options:
    - Fixed 100ms Tight Loop (Thundering Herd)
    - Exponential Backoff
    description: Client polling behavior
  visualizer_type: system_blueprint
  visualizer_config:
    title: 'Thundering Herd: 500k QPS Polling Stampede'
- id: w33_s4_exponential_backoff_progression
  title: Truncated Exponential Backoff Mechanics & Interval Caps
  subtitle: Balancing immediate response for fast jobs with 95% reduced load for slow
    jobs
  scenario: How can client SDKs stay responsive for fast jobs (done in 300ms) without
    overwhelming servers on slow jobs (done in 60s)?
  mechanism: 'Truncated Exponential Backoff! Start with a small interval (e.g. 200ms).
    After each non-terminal poll, multiply the interval: interval = min(int(interval
    * multiplier), max_interval). Fast tasks are detected immediately on early polls;
    longer tasks poll less and less frequently, automatically throttling client load
    by 95%+.'
  prediction:
    prompt: How does exponential backoff balance fast-job responsiveness with slow-job
      backend protection?
    choices:
    - id: opt_a
      label: It polls rapidly during initial milliseconds when quick jobs finish,
        then progressively widens intervals up to a maximum cap to prevent backend
        overload.
      explanation: Correct! Quick jobs finish during short intervals, while long jobs
        automatically reduce query frequency to prevent server exhaustion.
      is_correct: true
    - id: opt_b
      label: It increases polling frequency as time goes on to pressure the backend
        into working faster.
      explanation: Misconception! Polling faster increases server load, causing jobs
        to slow down further.
      is_correct: false
    - id: opt_c
      label: It cancels the job if it takes longer than 3 polls.
      explanation: Incorrect! Backoff allows long jobs to run to completion cleanly.
      is_correct: false
    revealed_explanation: Truncated exponential backoff is the industry-standard algorithm
      implemented in AWS Boto3, Google Cloud, and Stripe client SDKs.
  controls:
  - id: initial_interval_ms
    label: Initial Interval (ms)
    type: slider
    default: 200
    min: 50
    max: 1000
    step: 50
    description: Delay before first retry
  - id: backoff_multiplier
    label: Backoff Multiplier
    type: slider
    default: 1.5
    min: 1.1
    max: 3.0
    step: 0.1
    description: Factor by which interval grows
  - id: max_interval_ms
    label: Max Interval Cap (ms)
    type: slider
    default: 2000
    min: 500
    max: 10000
    step: 500
    description: Maximum polling interval ceiling
  visualizer_type: system_blueprint
  visualizer_config:
    title: Exponential Backoff Growth Curve with Ceiling Cap
- id: w33_s5_jitter_resonance_waves
  title: 'Decorrelated Jitter: Preventing Lockstep Resonance Waves'
  subtitle: Breaking synchronized retry spikes with randomized sleep intervals
  scenario: When 10,000 clients retry with pure deterministic exponential backoff
    (200ms -> 400ms -> 800ms), why do micro-bursts of traffic still occur?
  mechanism: Lockstep synchronization! If 10,000 clients all start simultaneously,
    deterministic multipliers cause all 10,000 clients to poll at the exact same millisecond
    intervals, creating periodic spikes of traffic (resonance waves). Adding randomness
    (Jitter) decorrelates client timers and flattens traffic into a smooth, manageable
    stream.
  prediction:
    prompt: Why does AWS Architecture recommend adding random "Jitter" to exponential
      backoff loops?
    choices:
    - id: opt_a
      label: Jitter decorrelates simultaneous client retries, preventing synchronized
        lockstep traffic spikes that hammer the server.
      explanation: Correct! Randomizing intervals breaks synchronous waves, spreading
        requests evenly over time.
      is_correct: true
    - id: opt_b
      label: Jitter encrypts the HTTP packets against packet sniffers.
      explanation: Nonsense! Jitter is a timing delay parameter, not an encryption
        cipher.
      is_correct: false
    - id: opt_c
      label: Jitter forces the CPU to use quantum randomness.
      explanation: Irrelevant! Standard pseudorandom number generators are sufficient.
      is_correct: false
    revealed_explanation: Decorrelated Jitter ensures that high-scale retries never
      form synchronized constructive interference waves against your infrastructure.
  controls:
  - id: jitter_enabled
    label: Random Jitter Enabled
    type: toggle
    default: true
    description: Add randomized spread to polling intervals
  visualizer_type: system_blueprint
  visualizer_config:
    title: Lockstep Resonance Waves vs Jittered Traffic Flow
- id: w33_s6_transfer_challenge
  title: 'Transfer Challenge: HTTP 202 Exponential Backoff Simulator'
  subtitle: Build the polling engine that simulates real-world backoff curves
  scenario: 'Implement `simulate_job_polling(job_timeline: dict, initial_interval_ms:
