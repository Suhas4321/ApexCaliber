- skill: core
  title: Get timeline status
  goal: Lookup latest milestone state <= current_time.
  instructions: Find the highest milestone time <= current_time and return its status.
  function:
    name: drill_get_status
    params:
    - name: timeline
    - name: current_time
  starter_code: "class Solution:\n    def drill_get_status(self, timeline: dict, current_time:\
    \ int) -> str:\n        pass\n"
  tests:
  - args:
    - '0': PENDING
      '500': SUCCESS
    - 600
    expected: SUCCESS
  - args:
    - '0': PENDING
      '500': SUCCESS
    - 200
    expected: PENDING
  solution: "class Solution:\n    def drill_get_status(self, timeline: dict, current_time:\
    \ int) -> str:\n        status = \"PENDING\"\n        for k in sorted(int(x) for\
    \ x in timeline.keys()):\n            if k <= current_time:\n                status\
    \ = timeline.get(str(k), timeline.get(k))\n            else:\n               \
    \ break\n        return status\n"
  hint: Iterate sorted milestone times.
- skill: edge
  title: Check terminal status
  goal: Return True if status is SUCCESS or FAILED.
  instructions: Return `status in ('SUCCESS', 'FAILED')`.
  function:
    name: drill_is_terminal
    params:
