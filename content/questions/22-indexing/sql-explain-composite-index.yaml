slug: sql-explain-composite-index
lc: 9307
citadel_id: sql_dbms
brick_layer: 2
runner_type: sql_sqlite
concept:
  problem_it_solves: 'How do database administrators inspect whether a query uses an index or visits all rows?
    SQLite EXPLAIN QUERY PLAN reports an access strategy such as SCAN or SEARCH and names an index when one is used.
    SEARCH means only a subset of table rows is visited; SCAN can also use an index when traversing all rows.
    Composite index usefulness depends on the leading columns and the query shape.'
  brute_force: Guessing index usage and blindly adding single-column indexes, multiplying write overhead without improving
    query speed.
  brute_force_complexity: Unnecessary index write amplification and slow query execution.
  key_insight: Running `EXPLAIN QUERY PLAN` outputs the exact access path. A composite index `(user_id, status, created_at)`
    supports an efficient indexed search when equality filters match `user_id` and `status`.
  real_world: PostgreSQL `EXPLAIN ANALYZE`, MySQL `EXPLAIN`, and SQLite query performance tuning.
statement:
  clean: "Write a SQL query using `EXPLAIN QUERY PLAN` to determine which composite index the SQLite optimizer selects for\
    \ a filtered, sorted transaction query.\n\nTable schema and indexes:\n```sql\nCREATE TABLE Transactions (\n    id INTEGER\
    \ PRIMARY KEY,\n    user_id INTEGER,\n    status TEXT,\n    created_at TEXT,\n    amount INTEGER\n);\n\nCREATE INDEX idx_user_status_date\
    \ ON Transactions (user_id, status, created_at);\nCREATE INDEX idx_date_amount ON Transactions (created_at, amount);\n\
    ```\n\nTarget Query to Evaluate:\n```sql\nSELECT * FROM Transactions\nWHERE user_id = 42 AND status = 'COMPLETED'\nORDER\
    \ BY created_at;\n```\n\nTask:\nExecute `EXPLAIN QUERY PLAN` on the target query above to inspect the optimizer's access\
    \ path.\n\nReturn the query plan result."
  oa_story: '**UrbanFix Payment History — Slow Query Diagnostic**


    UrbanFix users opening their order history experienced 8-second page loads. The query fetched transactions for a specific
    `user_id` with `status = ''COMPLETED''`, ordered by date. Two composite indexes existed, but developers were unsure which
    one the optimizer was picking.


    Use `EXPLAIN QUERY PLAN` to inspect the query execution path and prove whether the optimizer leverages the composite left-prefix
    B-Tree index.'
  trigger_keywords:
  - EXPLAIN QUERY PLAN
  - idx_user_status_date
  - Transactions
  examples:
  - input: 'Target query: SELECT * FROM Transactions WHERE user_id = 42 AND status = ''COMPLETED'' ORDER BY created_at'
    output: 'Plan detail includes SEARCH Transactions USING INDEX idx_user_status_date (user_id=? AND status=?); numeric planner fields may vary.'
    explanation: Optimizer uses idx_user_status_date using equality filters on leading columns.
  constraints:
  - Index idx_user_status_date is present on (user_id, status, created_at)
  - Index idx_date_amount is present on (created_at, amount)
constraint_quiz:
  prompt: What does `SEARCH ... USING INDEX` signify in an `EXPLAIN QUERY PLAN` output compared to `SCAN`?
  options:
  - '`SEARCH` visits a subset of rows; `SCAN` visits all rows, possibly in index order. Read the plan detail to see which index is used.'
  - '`SEARCH` is used only for text columns'
  - '`SCAN` is faster than `SEARCH`'
  - '`SEARCH` deletes rows after reading them'
  answer: 0
  explanation: In SQLite, `SEARCH` indicates a subset of rows is visited. `SCAN` visits all rows and may still use an index.
    The plan detail reports the chosen index and filter terms. Plan wording and numeric fields can change between SQLite versions.
pattern_quiz:
  prompt: Why did the optimizer pick `idx_user_status_date (user_id, status, created_at)` instead of `idx_date_amount (created_at,
    amount)`?
  options:
  - Because the query filters by `user_id` and `status`, satisfying the left-prefix rule for `idx_user_status_date` and allowing
    index-ordered retrieval
  - Because idx_user_status_date has a longer name
  - Because idx_date_amount is corrupted
  - Because amount is an integer
  answer: 0
  explanation: A composite B-Tree index can only be used if the query predicates constrain the leading columns (left prefix)
    of the index.
schema_sql: "CREATE TABLE Transactions (\n    id INTEGER PRIMARY KEY,\n    user_id INTEGER,\n    status TEXT,\n    created_at\
  \ TEXT,\n    amount INTEGER\n);\n\nCREATE INDEX idx_user_status_date ON Transactions (user_id, status, created_at);\nCREATE\
  \ INDEX idx_date_amount ON Transactions (created_at, amount);"
