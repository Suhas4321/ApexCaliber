solution:
  code: 'EXPLAIN QUERY PLAN

    SELECT * FROM Transactions

    WHERE user_id = 42 AND status = ''COMPLETED''

    ORDER BY created_at;

    '
  explanation: The optimizer selects `idx_user_status_date` because the equality conditions match the first two columns of
    the composite index (`user_id` and `status`). Since the third column is `created_at`, the index directly satisfies the
    `ORDER BY created_at` clause without requiring an in-memory temporary sort B-Tree.
  time: O(1) plan inspection
  space: O(1) memory overhead
pitch_script: '**(Clarify)** "We need to run `EXPLAIN QUERY PLAN` on a filtered and sorted query to prove whether the optimizer
  leverages the composite index."


  **(Brute force)** "Assuming an index is used without verifying the execution plan often masks silent full table scans in
  production."


  **(Trigger)** "Diagnosing index access paths and verifying left-prefix matching signals EXPLAIN QUERY PLAN."


  **(Optimal)** "We prepend `EXPLAIN QUERY PLAN` to the query. The output confirms that SQLite selects `idx_user_status_date
  (user_id=? AND status=?)`. Its column order also supports the requested date ordering without a separate sort."


  **(Complexity)** "Executes in O(1) plan inspection time and space." '
