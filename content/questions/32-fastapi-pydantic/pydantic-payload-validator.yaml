journey:
- id: w32_s1_declarative_schemas
  title: Imperative if/else Validation vs Declarative Pydantic Schemas
  subtitle: Why manual validation breaks down in production API gateways
  scenario: 'A developer writes 25 lines of if not isinstance(data.get("age"), int):
    return {"error": "bad age"} checks inside a route handler. What happens as new
    fields are added?'
  mechanism: Imperative validation leads to code bloat, forgotten field checks, inconsistent
    error response shapes, and security vulnerabilities (e.g., negative balances or
    missing required fields). Declarative Pydantic schemas define the data contract
    up front, automatically validating presence, types, and constraints in a single
    pass before business logic runs.
  prediction:
    prompt: What is the primary architectural advantage of declarative schema validation
      (like Pydantic) over manual if/else checks?
    choices:
    - id: opt_a
      label: It guarantees consistent validation rules, uniform error responses, and
        automatic type coercion before handler code executes.
      explanation: Correct! Declarative schemas separate request validation contracts
        from business logic, ensuring consistent behavior across all endpoints.
      is_correct: true
    - id: opt_b
      label: It speeds up network transmission by 500% over the wire.
      explanation: Misconception! Validation occurs on the server after network packets
        have arrived.
      is_correct: false
    - id: opt_c
      label: It converts all incoming JSON strings into compiled C binary code.
      explanation: Incorrect! While Pydantic v2 uses a Rust core (pydantic-core),
        the architectural benefit is schema consistency.
      is_correct: false
    revealed_explanation: Declarative schemas act as a strong gatekeeper at the API
      boundary, guaranteeing clean, type-safe data reaches your database and business
      services.
  controls:
  - id: validation_approach
    label: Validation Paradigm
    type: select
    default: Declarative Pydantic Schema
    options:
    - Declarative Pydantic Schema
    - Manual Imperative if/else Checks
    description: Architectural style for input validation
  - id: field_count
    label: Request Fields
    type: slider
    default: 5
    min: 2
    max: 20
    step: 1
    description: Number of fields in incoming payload
  visualizer_type: system_blueprint
  visualizer_config:
    title: 'FastAPI Request Pipeline: HTTP Ingress to Pydantic Barrier'
- id: w32_s2_cpython_bool_trap
  title: 'The CPython Boolean Trap: isinstance(True, int) == True'
  subtitle: Why Python booleans fool naive integer validators
  scenario: 'You have a schema requiring an integer technician_count. A client sends
    {"technician_count": True}. If your validator simply checks isinstance(val, int),
    does it pass?'
  mechanism: In Python, bool is an explicit subclass of int (issubclass(bool, int)
    is True). Therefore, isinstance(True, int) returns True! In raw Python math, True
    + 1 == 2. To prevent clients from passing booleans where integers are required,
    strict validators must verify isinstance(val, int) and not isinstance(val, bool).
  prediction:
    prompt: In standard CPython, what is the output of isinstance(True, int)?
    choices:
    - id: opt_a
      label: True! In CPython, bool inherits from int, so True is treated as a valid
        integer unless explicitly excluded.
      explanation: Correct! Because bool subclasses int, isinstance(True, int) evaluates
        to True, causing subtle bugs in naive validators.
      is_correct: true
    - id: opt_b
      label: False! Integers and Booleans belong to completely separate memory types
        in all languages.
      explanation: Misconception! In Python 2 and 3, bool was intentionally implemented
        as an int subclass for backwards compatibility.
      is_correct: false
    - id: opt_c
      label: It raises a TypeError at runtime.
      explanation: Incorrect! isinstance() evaluates cleanly to a boolean.
      is_correct: false
    revealed_explanation: Strict validation engines explicitly check "not isinstance(val,
      bool)" when validating integers and floats to avoid the CPython boolean inheritance
      trap.
  controls:
  - id: strict_mode
    label: Strict Boolean Discrimination
    type: toggle
    default: true
    description: Reject booleans passed into integer fields
  - id: tested_value
    label: Tested Input Value
    type: select
    default: True (Boolean)
    options:
    - True (Boolean)
    - False (Boolean)
    - 42 (Integer)
    - '"42" (String)'
    description: Value to test against integer validator
  visualizer_type: system_blueprint
  visualizer_config:
    title: 'CPython Type Hierarchy: object -> int -> bool'
- id: w32_s3_http_400_vs_422
  title: 'HTTP Status Semantics: 400 Bad Request vs 422 Unprocessable Entity'
  subtitle: Distinguishing malformed syntax from semantic schema failures
  scenario: 'A client sends a POST request with valid JSON syntax {"age": "twenty"}.
    Should the server respond with HTTP 400 Bad Request or HTTP 422 Unprocessable
    Entity?'
  mechanism: HTTP 400 Bad Request indicates that the HTTP message itself is malformed
    (e.g., invalid JSON syntax like trailing commas, corrupted headers). HTTP 422
    Unprocessable Entity indicates that the syntax is well-formed (valid JSON), but
    the semantic instructions cannot be processed due to validation errors (e.g.,
    age must be an int, not a string). FastAPI standardizes on HTTP 422 for all schema
    validation failures.
  prediction:
    prompt: When an incoming JSON payload is syntactically valid JSON but violates
      schema data types, which HTTP status code is standard in FastAPI?
    choices:
    - id: opt_a
      label: HTTP 422 Unprocessable Entity, indicating the syntax is valid JSON but
        fails semantic schema rules.
      explanation: Correct! RFC 4918 / RFC 9457 establish 422 as the standard code
        for well-formed requests with semantic validation errors.
      is_correct: true
    - id: opt_b
      label: HTTP 500 Internal Server Error, because the server encountered a bug.
      explanation: Misconception! 500 indicates a server failure; client validation
        errors are client-side 4xx errors.
      is_correct: false
    - id: opt_c
      label: HTTP 200 OK with an error message inside the body.
      explanation: Antipattern! Returning 200 OK for errors breaks HTTP caching, monitoring
        alerts, and client retry logic.
      is_correct: false
    revealed_explanation: FastAPI uses HTTP 422 to clearly inform clients that their
      JSON was parsed successfully but failed business and schema constraints.
  controls:
  - id: payload_condition
    label: Payload Malformation Type
    type: select
    default: Semantic Schema Violation (Type Mismatch)
    options:
    - Semantic Schema Violation (Type Mismatch)
    - Corrupted JSON Syntax (Missing Brace)
    description: Error scenario to evaluate
  visualizer_type: system_blueprint
  visualizer_config:
    title: 'HTTP Error Codes: 400 Syntax vs 422 Semantic'
- id: w32_s4_error_locators_frontend
  title: 'Structured Error Locators: loc, msg & type for Frontend UX'
  subtitle: How modern frontends highlight form inputs directly from API responses
  scenario: When an API rejects a nested request payload, how does the frontend know
    which form input field to highlight in red?
  mechanism: FastAPI / Pydantic error details include a loc array path (e.g. ["body",
    "address", "zipcode"]), an error message msg, and a machine-readable error type
    (missing, int_type, greater_than_equal). Client libraries (like React Hook Form
    or Formik) map these locators directly to form inputs to render inline error messages
    without custom parsing.
  prediction:
    prompt: 'Why does Pydantic return errors with a locator array like loc: ["body",
      "user", "email"]?'
    choices:
    - id: opt_a
      label: It allows frontend frameworks to map validation errors directly to the
        exact nested input field in the UI.
      explanation: Correct! Locator paths like ["body", "user", "email"] map directly
        to UI input component field names.
      is_correct: true
    - id: opt_b
      label: It informs the database which column index to delete.
      explanation: Nonsense! Error locators are strictly client communication contracts.
      is_correct: false
    - id: opt_c
      label: It traces the GPS coordinates of the mobile device.
      explanation: Irrelevant! loc refers to JSON payload location.
      is_correct: false
    revealed_explanation: Structured error locators transform vague error messages
      into actionable, field-specific feedback for frontend consumers.
  controls:
  - id: nesting_depth
    label: Schema Nesting Depth
    type: select
    default: Single Level (body.age)
    options:
    - Single Level (body.age)
    - Nested Object (body.address.zipcode)
    description: Complexity of field hierarchy
  visualizer_type: system_blueprint
  visualizer_config:
    title: Pydantic Error Object Schema & Frontend Form Binding
- id: w32_s5_boundary_constraints
  title: 'Value Constraints: Boundaries, Ranges & Business Rules'
  subtitle: Enforcing min, max, and range boundaries before SQL queries run
  scenario: An age field must be an integer between 18 and 120. A user submits age
    = 16. How are numeric boundary constraints applied?
  mechanism: 'After type verification, validators check boundary constraints: min
    (greater than or equal to) and max (less than or equal to). If val < min, the
    validator emits type: "greater_than_equal" with message "Input should be greater
    than or equal to {min}".'
  prediction:
    prompt: 'What error should be generated for a field with constraint min: 18 when
      the submitted value is 16?'
    choices:
    - id: opt_a
      label: '{"loc": ["body", "age"], "msg": "Input should be greater than or equal
        to 18", "type": "greater_than_equal"} with status 422.'
      explanation: Correct! Pydantic formats boundary violations with descriptive
        type tags and human-readable messages.
      is_correct: true
    - id: opt_b
      label: '{"error": "Underage"} with status 403 Forbidden.'
      explanation: Incorrect! 403 is for authorization/permissions; schema boundary
        checks produce 422.
      is_correct: false
    - id: opt_c
      label: The value is automatically rounded up to 18 with status 200.
      explanation: Dangerous! Silently mutating user input causes unexpected data
        corruption.
      is_correct: false
    revealed_explanation: Strict boundary validation catches invalid business data
      at the HTTP boundary before it can corrupt downstream transactional state.
  controls:
  - id: min_constraint
    label: Minimum Boundary (min)
    type: slider
    default: 18
    min: 0
    max: 100
    step: 1
    description: Minimum allowable numeric value
  - id: submitted_val
    label: Submitted Value
    type: slider
    default: 16
    min: 0
    max: 100
    step: 1
    description: User-submitted integer value
  visualizer_type: system_blueprint
  visualizer_config:
    title: 'Boundary Validation: Min/Max Range Verification'
- id: w32_s6_transfer_challenge
  title: 'Transfer Challenge: Pydantic Schema Validation Engine'
  subtitle: Build the complete FastAPI-style schema validator
  scenario: 'Implement `validate_payload(schema: dict, payload: dict) -> dict` to
    validate incoming requests against types and boundary constraints.'
  mechanism: '1. Check required fields: if missing, emit type: "missing". 2. Check
    types (str, int without bool, float without bool, bool): if mismatch, emit type:
    f"{expected}_type". 3. Check min and max bounds: emit type: "greater_than_equal"
    or "less_than_equal". 4. Return status_code 422 with detail list if errors, else
    200 with data.'
  prediction:
    prompt: 'Given schema {"name": {"type": "str", "required": True}, "age": {"type":
      "int", "required": True, "min": 18}} and payload {"name": "Aarav", "age": 16},
      what does validate_payload return?'
    choices:
    - id: opt_a
      label: '{"status_code": 422, "detail": [{"loc": ["body", "age"], "msg": "Input
        should be greater than or equal to 18", "type": "greater_than_equal"}], "valid":
        False}'
      explanation: 'Correct! Age 16 violates min: 18, producing an HTTP 422 with the
        exact locator and type descriptor.'
      is_correct: true
    - id: opt_b
      label: '{"status_code": 200, "data": {"name": "Aarav", "age": 16}, "valid":
        True}'
      explanation: Incorrect! The constraint is violated, so validation must fail.
      is_correct: false
    - id: opt_c
      label: '{"status_code": 400, "error": "Bad age"}'
      explanation: Incorrect! The function specifies HTTP 422 with structured detail
        locators.
      is_correct: false
    revealed_explanation: Implement the validation engine in the code editor below
      and test with all validation scenarios.
  controls:
  - id: run_verification
    label: Run Full Validation Engine Tests
    type: button
    default: true
    description: Execute test suite validating missing fields, type errors, boundary
      checks, and valid payloads
  lab_starter_code: "class Solution:\n    def validate_payload(self, schema: dict,\
    \ payload: dict) -> dict:\n        pass\n"
