    \        return isinstance(val, int) and not isinstance(val, bool)\n"
  hint: Return `isinstance(val, int) and not isinstance(val, bool)`.
- skill: edge
  title: Format 422 error object
  goal: Build standard Pydantic error dictionary.
  instructions: 'Return `{''loc'': [''body'', field], ''msg'': msg, ''type'': err_type}`.'
  function:
    name: drill_err_dict
    params:
    - name: field
    - name: msg
    - name: err_type
  starter_code: "class Solution:\n    def drill_err_dict(self, field: str, msg: str,\
    \ err_type: str) -> dict:\n        pass\n"
  tests:
  - args:
    - age
    - Too young
    - value_error
    expected:
      loc:
      - body
      - age
      msg: Too young
      type: value_error
  solution: "class Solution:\n    def drill_err_dict(self, field: str, msg: str, err_type:\
    \ str) -> dict:\n        return {\"loc\": [\"body\", field], \"msg\": msg, \"\
    type\": err_type}\n"
  hint: Construct the dictionary with loc, msg, and type.
hints:
- Iterate through `schema.items()`. First check if required fields are present in
  payload.
- Verify type matching strictly, taking special care that booleans are not treated
  as ints.
- '| # Pseudocode Blueprint

  | errors = []

  | for field, rules in schema.items():

  |     if field not in payload:

  |         if rules.required: errors.append(missing_error)

  |     else:

  |         val = payload[field]

  |         if not valid_type(val, rules.type): errors.append(type_error)

  |         if min and val < min: errors.append(min_error)

  |         if max and val > max: errors.append(max_error)

  | if errors: return 422, errors, False

  | return 200, payload, True'
solution:
  code: "class Solution:\n    def validate_payload(self, schema: dict, payload: dict)\
    \ -> dict:\n        errors = []\n        type_map = {\"str\": str, \"int\": int,\
    \ \"float\": (int, float), \"bool\": bool}\n\n        for field, rules in schema.items():\n\
    \            if field not in payload:\n                if rules.get(\"required\"\
    , False):\n                    errors.append({\"loc\": [\"body\", field], \"msg\"\
    : \"Field required\", \"type\": \"missing\"})\n                continue\n\n  \
    \          val = payload[field]\n            expected_type_name = rules.get(\"\
    type\", \"str\")\n            expected_type = type_map.get(expected_type_name,\
    \ str)\n\n            if expected_type_name == \"bool\" and not isinstance(val,\
    \ bool):\n                errors.append({\"loc\": [\"body\", field], \"msg\":\
    \ \"Input should be a valid boolean\", \"type\": \"bool_type\"})\n           \
    \     continue\n            elif expected_type_name == \"int\" and (isinstance(val,\
    \ bool) or not isinstance(val, int)):\n                errors.append({\"loc\"\
    : [\"body\", field], \"msg\": \"Input should be a valid integer\", \"type\": \"\
    int_type\"})\n                continue\n            elif not isinstance(val, expected_type):\n\
    \                errors.append({\"loc\": [\"body\", field], \"msg\": f\"Input\
    \ should be a valid {expected_type_name}\", \"type\": f\"{expected_type_name}_type\"\
    })\n                continue\n\n            min_val = rules.get(\"min\")\n   \
    \         max_val = rules.get(\"max\")\n            if min_val is not None and\
    \ val < min_val:\n                errors.append({\"loc\": [\"body\", field], \"\
    msg\": f\"Input should be greater than or equal to {min_val}\", \"type\": \"greater_than_equal\"\
    })\n            if max_val is not None and val > max_val:\n                errors.append({\"\
    loc\": [\"body\", field], \"msg\": f\"Input should be less than or equal to {max_val}\"\
    , \"type\": \"less_than_equal\"})\n\n        if errors:\n            return {\"\
    status_code\": 422, \"detail\": errors, \"valid\": False}\n        return {\"\
    status_code\": 200, \"data\": payload, \"valid\": True}\n"
  explanation: Iterating through the schema rules validates field presence, enforces
    strict type checking (guarding against Python's bool-is-int inheritance), and
    checks numeric boundaries. Accumulating all errors into an HTTP 422 payload provides
    granular client feedback in a single round-trip.
  time: O(S) where S is the number of schema fields
  space: O(E) for the accumulated errors list
pitch_script: '**(Clarify)** "We need to build a schema validation engine that checks
  payload presence, strict types, and boundary constraints, returning an HTTP 422
  response with detailed locators on failure."


  **(Brute force)** "Scattering ad-hoc `if-else` assertions in handler functions leads
  to unhandled 500 crashes and fragmented error formats."


  **(Trigger)** "Validating request bodies against declarative field rules and returning
  HTTP 422 signals Pydantic-style model validation."


  **(Optimal)** "We iterate through the schema. If a required field is missing, we
  append a missing error. If present, we strictly validate types, guarding against
  Python treating booleans as integers. We check min and max constraints. If any errors
  occurred, we return 422 with the details list; otherwise 200 with the clean data."


  **(Complexity)** "Executes in O(S) time where S is schema size and O(E) space for
  errors." '
