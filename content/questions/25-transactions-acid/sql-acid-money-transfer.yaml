    name: execute_sql
    params: []
  starter_code: 'SELECT CASE WHEN (SELECT balance FROM Accounts WHERE id = 1) >= 200
    THEN ''COMMITTED'' ELSE ''ROLLEDBACK'' END AS status;

    '
  tests:
  - args: []
    expected:
    - - COMMITTED
  solution: 'SELECT CASE WHEN (SELECT balance FROM Accounts WHERE id = 1) >= 200 THEN
    ''COMMITTED'' ELSE ''ROLLEDBACK'' END AS status;

