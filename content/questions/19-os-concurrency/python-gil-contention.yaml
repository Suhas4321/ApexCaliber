solution:
  code: "class Solution:\n    def classify_concurrency_workload(self, workload_type:\
    \ str, worker_count: int) -> dict:\n        if workload_type == \"cpu_bound\"\
    :\n            return {\n                \"gil_contention\": True,\n         \
    \       \"recommended_runtime\": \"multiprocessing\",\n                \"core_utilization\"\
    : worker_count,\n                \"summary\": \"CPU-bound Python loops hold the\
    \ GIL, serializing threads on 1 core. Use multiprocessing.\",\n            }\n\
    \        elif workload_type == \"io_bound\":\n            return {\n         \
    \       \"gil_contention\": False,\n                \"recommended_runtime\": \"\
    asyncio\",\n                \"core_utilization\": 1,\n                \"summary\"\
    : \"I/O bound tasks release the GIL during network/disk wait. Use asyncio.\",\n\
    \            }\n        else:\n            return {\"error\": f\"Unknown workload:\
    \ {workload_type}\"}\n"
  explanation: 'In CPython, the Global Interpreter Lock prevents multiple threads
    from executing Python bytecode in parallel.

    For CPU-bound tasks, threads serialize on a single core; spawning processes via
    `multiprocessing` bypasses

    the GIL to achieve true multi-core speedups.


    For I/O-bound tasks, threads and async tasks release the GIL while waiting on
    network sockets,

    making single-threaded `asyncio` extremely fast and capable of managing 10,000+
    connections with low memory overhead.

    '
  time: O(1) decision classification
  space: O(1) dictionary response
pitch_script: '**(Clarify)** "We need to categorize workloads as CPU-bound or I/O-bound,
  diagnosing GIL contention and recommending the optimal Python concurrency runtime."


  **(Basement Insight)** "CPython''s GIL protects memory reference counts by restricting
  execution to one OS thread at any instant. For CPU-bound tasks, threading fails
  because threads contest the GIL on a single core. In contrast, during I/O operations,
  Python drops the GIL, allowing concurrent I/O progress."


  **(Solution)** "For CPU workloads, we recommend `multiprocessing` to run independent
  interpreters on multiple cores. For I/O workloads, we recommend `asyncio` to multiplex
  sockets on an event loop without OS thread switching overhead."


  **(Complexity)** "Executes in O(1) time and space."

  '
twist:
  lc: 9403
  title: Free-Threaded Python 3.13 (PEP 703)
  why: Python 3.13 introduces experimental free-threaded builds (--disable-gil) replacing
    the global lock with mimalloc thread-safe memory allocation, allowing true multi-threaded
    CPU execution.
viz:
  title: Python GIL Contention Timeline
journey:
- id: w28_s1_refcounting_gil
  title: CPython Reference Counting & The Need for the GIL
  subtitle: Why Python wraps the bytecode interpreter in a global mutual exclusion
    lock
  scenario: In CPython, memory cleanup relies on reference counting (ob_refcnt, Py_INCREF,
    Py_DECREF). Why does this necessitate the Global Interpreter Lock (GIL)?
  mechanism: 'Incrementing and decrementing ob_refcnt is not atomic in standard C.
    Without locking, two threads reading and updating ob_refcnt simultaneously cause
    race conditions: an object with active references could have its refcount drop
    to 0 and be freed prematurely (use-after-free vulnerability), or memory can be
    leaked indefinitely. The GIL solves this globally by ensuring only one thread
    executes bytecode at a time.'
  prediction:
    prompt: What happens if multiple native OS threads modify CPython object reference
      counts concurrently without the GIL or atomic operations?
    choices:
    - id: opt_a
      label: Race conditions corrupt ob_refcnt, triggering heap corruption, segmentation
        faults, and use-after-free security vulnerabilities.
      explanation: Correct! Reference counting without locks is not thread-safe; concurrent
        access can cause memory corruption or crashes.
      is_correct: true
    - id: opt_b
      label: CPython automatically converts all variables into atomic CPU registers
        without overhead.
      explanation: Misconception! Atomic CPU instructions on every increment/decrement
        would add substantial performance overhead to single-threaded code.
      is_correct: false
    - id: opt_c
      label: Python switches to Java's generational garbage collector automatically.
      explanation: Incorrect! CPython is written in C and uses reference counting
        paired with a cyclic garbage collector.
      is_correct: false
    revealed_explanation: The GIL was introduced in CPython to make single-threaded
      execution fast and C extension integration simple, at the cost of serializing
      multi-threaded bytecode execution.
  controls:
  - id: thread_count
    label: OS Thread Count
    type: slider
    default: 4
    min: 1
    max: 8
    step: 1
    description: Number of native threads attempting to execute Python bytecode
  - id: atomic_refcount
    label: Atomic Refcounting Enabled
    type: toggle
    default: false
    description: Use atomic instructions instead of GIL mutex
  visualizer_type: system_blueprint
  visualizer_config:
    title: CPython PyObject Reference Counting & GIL Architecture
- id: w28_s2_cpu_bound_threads
  title: The CPU-Bound Multithreading Paradox (1 Core Ceiling)
  subtitle: Why adding 8 threads to an 8-core CPU can make Python code run slower
  scenario: You run a CPU-intensive mathematical loop (calculating prime numbers)
    on an 8-core server. You split the workload across 8 threads using threading.Thread.
    How does total wall-clock time compare to 1 thread?
  mechanism: Because the GIL prevents simultaneous bytecode execution, all 8 threads
    take turns acquiring the GIL, running for a switch interval (default 5ms), and
    releasing it. The 8 threads must serialize onto a single CPU core. Furthermore,
    OS thread context-switching overhead, cache thrashing, and lock contention make
    the 8-thread run SLOWER than a single thread.
  prediction:
    prompt: How does running an intensive CPU-bound computation across 8 Python threads
      compare to 1 Python thread on an 8-core machine?
    choices:
    - id: opt_a
      label: The 8-thread program is actually slower or at best equal, utilizing only
        100% of 1 core (out of 800%) due to GIL lock serialization and context switching.
      explanation: Correct! All 8 threads fight for the single interpreter lock, wasting
        CPU cycles in lock contention while executing on only 1 physical core.
      is_correct: true
    - id: opt_b
      label: It runs 8x faster because modern OS schedulers bypass Python locks automatically.
      explanation: Misconception! The OS kernel scheduler cannot bypass the GIL mutex
        inside the CPython process.
      is_correct: false
    - id: opt_c
      label: It utilizes 800% CPU capacity with zero context switching.
      explanation: Incorrect! Pure Python bytecode cannot execute on multiple cores
        concurrently within a single interpreter.
      is_correct: false
    revealed_explanation: Threading in Python does not provide multi-core parallelism
      for CPU-bound tasks. In fact, thread contention adds overhead that degrades
      performance.
  controls:
  - id: worker_count
    label: Worker Threads
    type: slider
    default: 8
    min: 1
    max: 16
    step: 1
    description: Number of threads competing for single interpreter GIL
  - id: task_workload
    label: Workload Type
    type: select
    default: CPU-Bound
    options:
    - CPU-Bound
    - I/O-Bound
    description: Type of computational workload
  visualizer_type: system_blueprint
  visualizer_config:
    title: GIL Lock Contention & Core Serialization Timeline
- id: w28_s3_io_bound_release
  title: I/O-Bound Workloads & Voluntary GIL Release
  subtitle: Why threading and asyncio excel for networking and disk operations
  scenario: You have 100 concurrent HTTP requests fetching device screenshots from
    remote mobile testing farms. Each spends 95% of its time waiting for network packets.
    If you use 100 threads, does the GIL block them?
  mechanism: Before initiating blocking system calls (like recv(), select(), or disk
    reads), CPython executes Py_BEGIN_ALLOW_THREADS, dropping the GIL. While Thread
    1 waits on socket I/O, Thread 2 acquires the GIL and submits its request. Thus,
    I/O-bound multithreading in Python achieves true concurrency.
  prediction:
    prompt: When a Python thread makes a blocking network socket call (e.g. requests.get()
      or database query), what happens to the GIL?
    choices:
    - id: opt_a
      label: The thread voluntarily releases the GIL before waiting on the socket,
        allowing other threads to run Python code concurrently.
      explanation: Correct! Standard library I/O calls drop the GIL during kernel
        syscalls so other Python threads can execute.
      is_correct: true
    - id: opt_b
      label: The thread holds the GIL until all data packets arrive, freezing all
        other threads.
      explanation: Misconception! If this were true, Python could not handle concurrent
        web servers. The GIL is released during I/O waits.
      is_correct: false
    - id: opt_c
      label: The GIL crashes because sockets are incompatible with Python bytecode.
      explanation: Nonsense! Networking and sockets are fundamental capabilities of
        Python.
      is_correct: false
    revealed_explanation: Because I/O releases the GIL, Python threads and asyncio
      coroutines are exceptionally effective for high-concurrency network servers
      and database clients.
  controls:
  - id: concurrent_requests
    label: Concurrent Network Requests
    type: slider
    default: 50
    min: 10
    max: 200
    step: 10
    description: Number of concurrent HTTP calls in flight
  - id: network_latency_ms
    label: Network Round-Trip Latency (ms)
    type: slider
    default: 50
    min: 10
    max: 500
    step: 10
    description: Time spent in kernel socket wait outside the GIL
  visualizer_type: system_blueprint
  visualizer_config:
    title: 'I/O Concurrency: Voluntary GIL Release & Overlapping Waits'
- id: w28_s4_multiprocessing_vs_threading
  title: Multiprocessing vs Threading vs Asyncio Architectural Trade-offs
  subtitle: Choosing the right concurrency model for memory, IPC, and core utilization
  scenario: 'Drizz Mobile needs to choose an architecture for: A) 1,000 concurrent
    REST API calls, and B) 8-core OCR image edge detection. Which concurrency model
    fits each?'
  mechanism: 'asyncio: Single-threaded event loop utilizing non-blocking OS I/O primitives
    (epoll/kqueue). Lowest memory footprint (~2KB per coroutine), ideal for massive
    I/O concurrency. threading: Native OS threads (~8MB stack each). Good for I/O
    when synchronous legacy libraries are required, but limited by GIL for CPU tasks.
    multiprocessing: Spawns separate OS processes via fork/spawn. Each process has
    its own Python interpreter and GIL, providing true multi-core CPU scaling, but
    incurs memory duplication and IPC serialization overhead.'
  prediction:
    prompt: For an OCR image processing pipeline that needs to max out an 8-core CPU,
      which concurrency primitive must be used in Python?
    choices:
    - id: opt_a
      label: multiprocessing (or ProcessPoolExecutor), because each process has an
        independent interpreter and GIL running across physical cores.
      explanation: Correct! Spawning separate OS processes provides each worker with
        its own Python interpreter and GIL, achieving true 8-core scaling.
      is_correct: true
    - id: opt_b
      label: asyncio, because async code automatically runs on all CPU cores simultaneously.
      explanation: Misconception! asyncio is strictly single-threaded; coroutines
        run cooperatively on a single core.
      is_correct: false
    - id: opt_c
      label: threading, because threads share memory without any overhead.
      explanation: Incorrect! As demonstrated in Stage 2, CPU-bound threads in Python
        serialize on 1 core due to the GIL.
      is_correct: false
    revealed_explanation: 'Architectural Rule: Use asyncio for high-throughput I/O;
      use multiprocessing or external C extensions for CPU-bound multi-core workloads.'
  controls:
  - id: target_workload
    label: Target Workload
    type: select
    default: CPU-Bound
    options:
    - CPU-Bound
    - I/O-Bound
    description: Select workload profile to evaluate architecture
  - id: chosen_runtime
    label: Selected Runtime
    type: select
    default: multiprocessing
    options:
    - multiprocessing
    - threading
    - asyncio
    description: Concurrency model to evaluate
  visualizer_type: system_blueprint
  visualizer_config:
    title: 'Concurrency Decision Matrix: Memory vs Multi-Core Scaling'
- id: w28_s5_free_threading_extensions
  title: 'Bypassing the GIL: C Extensions & Python 3.13t Free-Threading'
  subtitle: How NumPy releases the GIL and how PEP 703 eliminates the lock entirely
  scenario: Modern data science libraries like NumPy, PyTorch, and Polars execute
    matrix operations in parallel across all CPU cores without multiprocessing. How?
    And what is Python 3.13t?
  mechanism: '1. C Extensions: Operations like numpy.dot() drop the GIL at the C level
    using Py_BEGIN_ALLOW_THREADS, execute parallel OpenMP/BLAS loops across all hardware
    cores, and re-acquire the GIL before returning to Python. 2. PEP 703 Free-Threaded
    Python (3.13t): Python 3.13 introduces an experimental build (--disable-gil) that
    disables the GIL entirely, replacing coarse locking with mimalloc thread-safe
    memory allocators, biased reference counting, and immortal objects.'
  prediction:
    prompt: How does NumPy run multi-threaded matrix multiplications across all CPU
      cores in a standard Python process?
    choices:
    - id: opt_a
      label: NumPy drops the GIL at the C level (Py_BEGIN_ALLOW_THREADS), executes
        hardware-accelerated C/BLAS threads across all cores, and re-acquires the
        GIL before returning.
      explanation: Correct! Compiled C extensions can release the GIL during pure
        computational loops, bypassing interpreter serialization.
      is_correct: true
    - id: opt_b
      label: NumPy forces the Linux kernel to rewrite the Python bytecode interpreter
        in assembly.
      explanation: Incorrect! NumPy uses standard C API hooks provided by CPython
        to release and re-acquire the GIL.
      is_correct: false
    - id: opt_c
      label: NumPy runs inside a virtual machine that ignores CPU registers.
      explanation: Nonsense! NumPy executes native compiled machine code optimized
        for CPU SIMD/AVX instructions.
      is_correct: false
    revealed_explanation: When building high-performance Python systems, developers
      either offload heavy computation to C/Rust extensions that release the GIL,
      or deploy on free-threaded Python 3.13t.
  controls:
  - id: library_type
    label: Implementation
    type: select
    default: NumPy C Extension
    options:
    - NumPy C Extension
    - Pure Python Loop
    description: Code implementation type
  - id: python_runtime
    label: CPython Runtime
    type: select
    default: CPython 3.12 (Standard GIL)
    options:
    - CPython 3.12 (Standard GIL)
    - Python 3.13t (Free-Threaded No GIL)
    description: Interpreter runtime configuration
  visualizer_type: system_blueprint
  visualizer_config:
    title: C Extension GIL Release vs Free-Threaded PEP 703 Architecture
