journey:
- id: w34_s1_cascading_failures
  title: The Cascading Failure Problem & Ingress Protection
  subtitle: Why uncontrolled traffic floods take down entire microservice clusters
  scenario: A single misconfigured microservice or malicious scraper starts sending
    5,000 requests per second to an expensive AI report generation endpoint.
  mechanism: Without rate limiting at the ingress layer (Nginx, Envoy, or Redis gateway),
    backend worker threads saturate, relational database connection pools exhaust,
    and timeouts cascade across all customer-facing endpoints.
  prediction:
    prompt: Where should rate limiting be enforced to protect a distributed microservice
      cluster with minimal server compute cost?
    choices:
    - id: opt_a
      label: At the reverse proxy or API gateway layer before requests ever reach
        heavy backend application workers.
      explanation: Correct! Dropping excessive traffic at the edge prevents worker
        starvation and preserves database connection pools.
      is_correct: true
    - id: opt_b
      label: Inside database trigger functions executed during record insertion.
      explanation: Misconception! Enforcing rate limits at the DB level exhausts DB
        connections and worsens cascading failures.
      is_correct: false
    - id: opt_c
      label: Inside the client-side JavaScript single page application bundle.
      explanation: Catastrophic misconception! Client-side checks are easily bypassed
        by bots and curl scripts.
      is_correct: false
    revealed_explanation: Edge rate limiting is the first line of defense protecting
      core database and compute infrastructure.
