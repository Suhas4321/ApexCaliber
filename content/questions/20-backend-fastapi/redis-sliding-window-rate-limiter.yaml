slug: redis-sliding-window-rate-limiter
lc: 9504
citadel_id: backend_apis
brick_layer: 4
runner_type: python_practical
concept:
  problem_it_solves: '"Why do fixed-window rate limiters fail at window boundaries,
    allowing 2x bursts to overwhelm upstream APIs?" A fixed 60-second window resets
    at :00. A client can send 100 requests at :59 and another 100 requests at :01.
    Both requests pass because they fall into separate 60-second fixed buckets, allowing
    200 requests within 2 seconds. The Sliding Window Log measures traffic over a
    continuous rolling window, completely eliminating boundary bursts.'
  brute_force: Fixed window counters with `INCR` and `EXPIRE`. Allows double-burst
    attacks at the boundary edges.
  brute_force_complexity: O(1) memory, but allows 200% traffic spikes that crash downstream
    services.
  key_insight: 'Using Redis Sorted Sets (`ZSET`): Each request is recorded with score
    = timestamp. When a request arrives at time $T$: 1. Prune expired logs: `ZREMRANGEBYSCORE
    key 0 (T - window_seconds)`. 2. Count current entries: `ZCARD key`. 3. If `count
    < max_requests`, add timestamp (`ZADD`) and allow HTTP 200. 4. If `count >= max_requests`,
    reject with HTTP 429 Too Many Requests and calculate `Retry-After`.'
  real_world: Stripe API rate limiters, FastAPI `slowapi` Redis middleware, and Drizz
    multi-tenant LLM token bucket gateways.
statement:
  clean: "Implement an accurate rolling log rate limiter using a redis sliding window\
    \ limiter:\n`def check_rate_limit(self, requests: list[dict], window_seconds:\
    \ int, max_requests: int) -> list[dict]`.\n\nGiven a list of incoming `requests`\
    \ in chronological order, where each element is:\n- `ip`: client IP address string\n\
    - `timestamp`: integer timestamp in seconds\n\nAnd `window_seconds` (sliding duration)\
    \ and `max_requests` (limit per window):\nFor each request:\n1. Maintain an in-memory\
    \ sliding log of accepted timestamps for each IP.\n2. Evict timestamps strictly\
    \ older than `timestamp - window_seconds` (keep only timestamps where `t > timestamp\
    \ - window_seconds`).\n3. If the count of timestamps currently in the window is\
    \ `< max_requests`:\n   - Append the current `timestamp` to that IP's log.\n \
    \  - Append to results: `{\"ip\": ip, \"allowed\": True, \"status_code\": 200,\
    \ \"remaining\": max_requests - len(log)}`\n4. If the count of timestamps currently\
    \ in the window is `>= max_requests`:\n   - The oldest active timestamp in the\
    \ window is `oldest = log[0]`.\n   - Compute seconds until the oldest request\
    \ expires: `retry_after = (oldest + window_seconds) - timestamp`.\n   - Append\
    \ to results: `{\"ip\": ip, \"allowed\": False, \"status_code\": 429, \"retry_after\"\
    : retry_after}`\n5. Return the list of result dictionaries.\n"
  oa_story: '**Drizz Multi-Tenant LLM Gateway — Burst Mitigation**


    When executing test suites across external LLM APIs (OpenAI / Anthropic), fixed-window
    limiters

    frequently allowed test suites to fire double-bursts across minute boundaries,
    triggering immediate 429 bans.


    Implement this Redis sliding window log simulator to enforce rolling rate compliance
    across all client IPs.

    '
  trigger_keywords:
  - redis sliding window limiter
  - check_rate_limit
  - requests
  examples:
  - input: 'requests = [{"ip": "1.1.1.1", "timestamp": 10}, {"ip": "1.1.1.1", "timestamp":
      20}, {"ip": "1.1.1.1", "timestamp": 30}], window_seconds = 60, max_requests
      = 2'
    output: '[{"ip": "1.1.1.1", "allowed": True, "status_code": 200, "remaining":
      1}, {"ip": "1.1.1.1", "allowed": True, "status_code": 200, "remaining": 0},
      {"ip": "1.1.1.1", "allowed": False, "status_code": 429, "retry_after": 40}]'
    explanation: Third request at timestamp 30 is rejected because 2 requests are
      already active in the [0, 60] window. Oldest (10) expires at 70 (70 - 30 = 40s
      wait).
  constraints:
  - 0 <= len(requests) <= 50
  - window_seconds >= 1
  - max_requests >= 1
constraint_quiz:
  prompt: What is the primary memory trade-off of the Sliding Window Log algorithm
    compared to the Token Bucket algorithm?
  options:
  - Sliding Window Log stores every individual request timestamp in memory (O(N) memory
    per client), whereas Token Bucket only stores an integer counter and last update
    timestamp (O(1) memory)
  - Sliding Window Log requires relational database foreign keys
  - Token Bucket cannot run on Redis
  - Sliding Window Log can only be written in C++
  answer: 0
  explanation: 'Sliding Window Log achieves 100% precision by storing every timestamp,
    using O(requests) memory. Token Bucket approximates rate limits using only 2 numbers:
    tokens available and last refill time.'
pattern_quiz:
  prompt: Which Redis data structure is ideally suited for implementing a Sliding
    Window Log?
  options:
  - Sorted Set (ZSET), using the request timestamp as the score for efficient ZREMRANGEBYSCORE
    and ZCARD operations
  - Redis Bitmaps
  - Redis Streams
  - Redis Geospatial Index
  answer: 0
  explanation: Redis Sorted Sets (ZSET) store members sorted by a numeric score (timestamp).
    `ZREMRANGEBYSCORE` evicts expired items in O(log(N) + M), and `ZCARD` counts active
    items in O(1).
