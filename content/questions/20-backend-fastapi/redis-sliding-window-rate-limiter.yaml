    - 60
    - 30
    expected: 40
  solution: "class Solution:\n    def calc_retry_after(self, oldest: int, window:\
    \ int, current: int) -> int:\n        return (oldest + window) - current\n"
  hint: Return (oldest + window) - current.
- title: IP log initialization
  skill: edge
