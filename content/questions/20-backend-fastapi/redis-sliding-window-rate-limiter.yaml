hints:
- 'Maintain a dictionary `logs: dict[str, list[int]]` where keys are IP addresses
  and values are lists of accepted request timestamps.'
- For each request, evict timestamps from the IP's log that are `<= timestamp - window_seconds`.
- 'If `len(log) < max_requests`, append `timestamp` and return `allowed: True, status_code:
  200, remaining: max_requests - len(log)`. Else compute `retry_after = (log[0] +
  window_seconds) - timestamp` and return 429.'
solution:
  code: "class Solution:\n    def check_rate_limit(self, requests: list[dict], window_seconds:\
    \ int, max_requests: int) -> list[dict]:\n        logs: dict[str, list[int]] =\
    \ {}\n        results = []\n\n        for req in requests:\n            ip = req[\"\
    ip\"]\n            ts = req[\"timestamp\"]\n            log = logs.setdefault(ip,\
    \ [])\n\n            # Evict timestamps outside the rolling window (keep strictly\
    \ ts - window_seconds < t)\n            cutoff = ts - window_seconds\n       \
    \     valid_log = [t for t in log if t > cutoff]\n            logs[ip] = valid_log\n\
    \n            if len(valid_log) < max_requests:\n                valid_log.append(ts)\n\
    \                results.append({\n                    \"ip\": ip,\n         \
    \           \"allowed\": True,\n                    \"status_code\": 200,\n  \
    \                  \"remaining\": max_requests - len(valid_log),\n           \
    \     })\n            else:\n                oldest = valid_log[0]\n         \
    \       retry_after = (oldest + window_seconds) - ts\n                results.append({\n\
    \                    \"ip\": ip,\n                    \"allowed\": False,\n  \
    \                  \"status_code\": 429,\n                    \"retry_after\"\
    : retry_after,\n                })\n\n        return results\n"
  explanation: 'The sliding window log tracks each client IP''s request history.

    By filtering out timestamps older than `ts - window_seconds` on each arrival,
    the algorithm ensures

    that at any instant, only requests within the active duration window are counted.


    If the threshold is reached, HTTP 429 is returned along with the exact `Retry-After`
    seconds

    calculated from the oldest item in the window.

    '
  time: O(N * M) where N is requests and M is max_requests per window
  space: O(K * M) where K is unique IPs and M is retained timestamps
pitch_script: '**(Clarify)** "We need to simulate a sliding window log rate limiter
  that tracks requests per client IP and returns HTTP 200 with remaining permits,
  or HTTP 429 with Retry-After."


  **(Basement Insight)** "Fixed-window rate limiters fail at boundary edges, allowing
  twice the configured traffic burst across bucket transitions. Sliding window log
  using Redis Sorted Sets ensures that across ANY rolling window of duration W, requests
  never exceed the configured limit."


  **(Solution)** "For each request, we evict timestamps older than `ts - window_seconds`.
  If active requests are below `max_requests`, we append the timestamp and return
  200 OK with `remaining` permits. Otherwise, we calculate `Retry-After = (oldest
  + window_seconds) - ts` and return 429 Too Many Requests."


  **(Complexity)** "Runs in O(N * M) time where M <= max_requests, using O(K * M)
  space for active timestamps."

  '
twist:
  lc: 9601
  title: Sliding Window Counter Approximation for Low Memory
  why: Under high traffic (100,000+ RPS), storing every timestamp in Redis ZSET consumes
    substantial RAM. Upgrade to Cloudflare's Sliding Window Counter which weights
    the previous fixed window and current window with O(1) memory.
