    - 50
  solution: "class Solution:\n    def filter_active(self, log: list[int], current:\
    \ int, window: int) -> list[int]:\n        return [t for t in log if t > current\
    \ - window]\n"
  hint: Keep timestamps strictly greater than current - window.
- title: Retry-After calculation
  skill: core
  goal: Compute seconds until oldest timestamp slides out.
  instructions: 'Return `(oldest + window) - current`.

    '
  function:
    name: calc_retry_after
    params:
