slug: http-status-code-diagnostics
lc: 9501
citadel_id: backend_apis
brick_layer: 1
runner_type: python_practical
concept:
  problem_it_solves: '"When an API call fails in production, how do clients know whether
    to retry immediately, retry with backoff, or abort?" Standardizing error responses
    using RFC 9110 status codes allows client SDKs and upstream API gateways (Envoy,
    Kong) to automatically distinguish transient network/rate-limiting faults (429,
    502, 504) from permanent client bugs (400, 401, 403, 422).'
  brute_force: Catching all Python exceptions in a top-level `except Exception:` block
    and returning `HTTP 500 Internal Server Error` with a generic JSON payload. This
    blinds downstream microservices and breaks automated retry pipelines.
  brute_force_complexity: O(1) error classification that destroys system observability.
  key_insight: 'HTTP status codes fall into deterministic semantic tiers: - 401 Unauthorized:
    Client did not provide valid authentication credentials (e.g., missing or expired
    JWT Bearer token). - 403 Forbidden: Client is authenticated, but lacks the RBAC
    permission scope for the requested resource. - 422 Unprocessable Entity: Request
    format is valid JSON, but payload violates Pydantic schema constraints. - 429
    Too Many Requests: Rate limit exceeded (transient, retryable with exponential
    backoff). - 502 Bad Gateway: Upstream dependency crashed or dropped socket connection.
    - 504 Gateway Timeout: Upstream worker exceeded reverse-proxy timeout window.'
  real_world: FastAPI global exception handlers, AWS API Gateway response mapping,
    and Drizz automated test runner retry engines.
statement:
  clean: "Implement an HTTP status diagnostics classifier for API failures:\n`def\
    \ classify_http_error(self, scenario: dict) -> dict`.\n\nGiven a `scenario` dictionary\
    \ describing an API failure scenario:\n1. If `scenario.get(\"rate_limit_exceeded\"\
    )` is True:\n   return `{\"status_code\": 429, \"reason\": \"Too Many Requests\"\
    , \"retryable\": True}`\n2. If `scenario.get(\"upstream_timeout\")` is True:\n\
    \   return `{\"status_code\": 504, \"reason\": \"Gateway Timeout\", \"retryable\"\
    : True}`\n3. If `scenario.get(\"downstream_offline\")` is True:\n   return `{\"\
    status_code\": 502, \"reason\": \"Bad Gateway\", \"retryable\": True}`\n4. If\
    \ `scenario.get(\"validation_errors\")`:\n   return `{\"status_code\": 422, \"\
    reason\": \"Unprocessable Entity\", \"retryable\": False}`\n5. If `scenario.get(\"\
    error_type\") == \"auth\"`:\n   - If not `scenario.get(\"authenticated\", False)`:\n\
    \     return `{\"status_code\": 401, \"reason\": \"Unauthorized\", \"retryable\"\
    : False}`\n   - If `scenario.get(\"authenticated\", False)` and not `scenario.get(\"\
    has_role\", False)`:\n     return `{\"status_code\": 403, \"reason\": \"Forbidden\"\
    , \"retryable\": False}`\n6. If `scenario.get(\"error_type\") == \"conflict\"\
    `:\n   return `{\"status_code\": 409, \"reason\": \"Conflict\", \"retryable\"\
    : False}`\n7. If `scenario.get(\"error_type\") == \"not_found\"`:\n   return `{\"\
    status_code\": 404, \"reason\": \"Not Found\", \"retryable\": False}`\n8. Otherwise\
    \ (unhandled runtime crash):\n   return `{\"status_code\": 500, \"reason\": \"\
    Internal Server Error\", \"retryable\": False}`\n"
  oa_story: '**Drizz Egress Gateway Diagnostics — Automated Test Runner**


    During automated mobile app test execution, microservice calls intermittently
    failed.

    Without proper status classification, our test harness failed builds on transient
    504 gateway timeouts

    while endlessly retrying 401 unauthorized errors.


    Implement this diagnostic classifier to establish clear retry vs. abort semantics
    across all backend services.

    '
  trigger_keywords:
  - http status diagnostics
  - classify_http_error
  - scenario
  examples:
  - input: 'scenario = {"rate_limit_exceeded": True}'
    output: '{"status_code": 429, "reason": "Too Many Requests", "retryable": True}'
    explanation: 'Rate limits are transient: client can retry after backoff.'
  - input: 'scenario = {"error_type": "auth", "authenticated": True, "has_role": False}'
    output: '{"status_code": 403, "reason": "Forbidden", "retryable": False}'
    explanation: Caller has valid token but lacks role permissions (Forbidden).
  - input: 'scenario = {"validation_errors": ["missing email field"]}'
    output: '{"status_code": 422, "reason": "Unprocessable Entity", "retryable": False}'
    explanation: Pydantic validation failure returns HTTP 422.
  constraints:
  - scenario is a valid dictionary
  - Keys in scenario may be missing or None
constraint_quiz:
  prompt: What is the key technical difference between HTTP 401 and HTTP 403?
  options:
  - 401 means unauthenticated (who are you?), while 403 means unauthorized/forbidden
    (I know who you are, but you do not have permission)
  - 401 is for GET requests, 403 is for POST requests
  - 401 is returned by the client, 403 is returned by the server
  - 401 is retryable, 403 is never retryable
  answer: 0
  explanation: 401 Unauthorized indicates missing or invalid credentials (authentication
    failure). 403 Forbidden indicates the caller is recognized, but lacks sufficient
    permissions (authorization failure).
pattern_quiz:
  prompt: Why should upstream reverse proxy timeouts return 504 Gateway Timeout instead
    of 500 Internal Server Error?
  options:
  - Because 504 informs client SDKs that the failure is upstream and transient, making
    safe exponential-backoff retries possible
  - Because 504 compresses HTTP response headers better than 500
  - Because HTTP 500 is deprecated in HTTP/2
  - Because 504 automatically restarts the backend container
  answer: 0
  explanation: 504 indicates an upstream worker deadline exceeded. Automated client
    SDKs safely retry idempotent 504 requests, whereas a generic 500 may indicate
    a permanent database mutation bug.
function:
  name: classify_http_error
  params:
  - name: scenario
    type: any
  returns: any
starter_code: "class Solution:\n    def classify_http_error(self, scenario: dict)\
  \ -> dict:\n        pass\n"
tests:
- args:
  - rate_limit_exceeded: true
  expected:
    status_code: 429
    reason: Too Many Requests
    retryable: true
  note: Transient rate limit returns 429
- args:
  - upstream_timeout: true
  expected:
    status_code: 504
    reason: Gateway Timeout
    retryable: true
  note: Timeout returns 504
- args:
  - error_type: auth
    authenticated: true
    has_role: false
  expected:
    status_code: 403
    reason: Forbidden
    retryable: false
  note: Role forbidden returns 403
- args:
  - error_type: auth
    authenticated: false
  expected:
    status_code: 401
    reason: Unauthorized
    retryable: false
  note: Unauthenticated returns 401
- args:
  - validation_errors:
    - field missing
  expected:
    status_code: 422
    reason: Unprocessable Entity
    retryable: false
  note: Pydantic validation returns 422
- args:
  - {}
  expected:
    status_code: 500
    reason: Internal Server Error
    retryable: false
  note: Unknown crash defaults to 500
visualize_test: 0
