slug: agent-state-machine-graph
lc: 9631
citadel_id: ai_resume
brick_layer: 5
runner_type: python_practical
concept:
  problem_it_solves: How do agentic orchestration frameworks like LangGraph and CrewAI
    coordinate multi-step LLM workflows without fragile if-else spaghetti? By modeling
    execution as a directed cyclic StateGraph, shared state dictionaries flow through
    node functions, while conditional routing edges dynamically inspect output state
    to steer control flow or terminate safely.
  brute_force: Hardcoded sequential script execution that cannot handle non-linear
    branching, human-in-the-loop validation, or cyclical agent retries.
  brute_force_complexity: O(N) rigid script execution that breaks on unpredictable
    LLM outputs.
  key_insight: Separating state mutation (nodes) from control routing (conditional
    edges) allows deterministic testing of agent workflows with strict step budgets.
  real_world: LangGraph multi-agent customer support routers, Drizz autonomous mobile
    test agents, and LangChain graph executors.
statement:
  clean: "Implement a finite state machine workflow engine with nodes and conditional\
    \ edges:\n`run_state_graph(self, initial_state: dict, max_steps: int = 10) ->\
    \ dict`.\n\nThe workflow models an agentic customer support router across 4 nodes:\n\
    - `'classifier'`: Inspects `state['query']`.\n  - If query contains `'refund'`\
    \ (case-insensitive), set `state['intent'] = 'billing'`.\n  - If query contains\
    \ `'reset'` (case-insensitive), set `state['intent'] = 'auth'`.\n  - Otherwise,\
    \ set `state['intent'] = 'general'`.\n  - Append `'classified'` to `state['log']`.\n\
    - `'billing_agent'`: Appends `'billing_resolved'` to `state['log']`, sets `state['resolved']\
    \ = True`.\n- `'auth_agent'`: Appends `'auth_resolved'` to `state['log']`, sets\
    \ `state['resolved'] = True`.\n- `'general_agent'`: Appends `'general_resolved'`\
    \ to `state['log']`, sets `state['resolved'] = True`.\n\nConditional Edge Rules:\n\
    1. Start node is `'classifier'`.\n2. After `'classifier'`:\n   - If `state['intent']\
    \ == 'billing'` -> route to `'billing_agent'`.\n   - If `state['intent'] == 'auth'`\
    \ -> route to `'auth_agent'`.\n   - If `state['intent'] == 'general'` -> route\
    \ to `'general_agent'`.\n3. After any agent node (`billing_agent`, `auth_agent`,\
    \ `general_agent`) -> route to `'__end__'`.\n\nTermination & Guard:\n- Stop execution\
    \ when current node is `'__end__'` or when steps executed reaches `max_steps`.\n\
    - Return a dictionary:\n  `{'final_state': state, 'visited_nodes': visited_nodes,\
    \ 'status': 'completed' | 'max_steps_exceeded'}`."
  oa_story: "**PayLoop Agent Platform \u2014 Autonomous Support Escalation Engine**\n\
    \nDuring a major UPI network disruption, PayLoop's customer support inbox was\
    \ flooded with 200,000 queries an hour ranging from urgent refund requests to\
    \ PIN resets. Monolithic script bots crashed under unpredictable prompt variations.\n\
    \nThe AI platform team redesigned the pipeline as a LangGraph cyclic state machine.\
    \ Nodes encapsulate deterministic task execution while conditional edges dynamically\
    \ branch based on classified intents. Implement this state graph runner to route\
    \ queries reliably."
  trigger_keywords:
  - state machine workflow engine
  - conditional edges
  - visited_nodes
  examples:
  - input: 'initial_state = {''query'': ''I need a refund on order 123'', ''log'':
      []}, max_steps = 10'
    output: '{''final_state'': {''query'': ''I need a refund on order 123'', ''log'':
      [''classified'', ''billing_resolved''], ''intent'': ''billing'', ''resolved'':
      True}, ''visited_nodes'': [''classifier'', ''billing_agent''], ''status'': ''completed''}'
    explanation: Classifier routes to billing_agent which marks resolved and transitions
      to __end__.
  - input: 'initial_state = {''query'': ''Please reset my password'', ''log'': []},
      max_steps = 10'
    output: '{''final_state'': {''query'': ''Please reset my password'', ''log'':
      [''classified'', ''auth_resolved''], ''intent'': ''auth'', ''resolved'': True},
      ''visited_nodes'': [''classifier'', ''auth_agent''], ''status'': ''completed''}'
    explanation: Classifier routes to auth_agent which resolves the authentication
      intent.
  constraints:
  - 1 <= max_steps <= 100
  - query is a non-empty string
  - log is initially an empty or populated list
constraint_quiz:
  prompt: Why must an agentic StateGraph enforce an explicit max_steps execution guard?
  options:
  - To prevent infinite execution loops caused by cyclic agent critique and reflection
    edges
  - To reduce the size of the Python bytecode
  - To force all node functions to run asynchronously
  - Because Python dictionaries can only hold 10 keys
  answer: 0
  explanation: Agent graphs frequently contain cycles (e.g. generator -> critic ->
    generator). A max_steps guard prevents infinite loops and uncontrolled API cost
    blowouts if an agent fails to converge.
pattern_quiz:
  prompt: In LangGraph and StateGraph architectures, what is the primary role of a
    conditional edge?
  options:
  - Dynamically inspect current state values and return the string identifier of the
    next node to execute
  - Directly serialize state to disk as a JSON file
  - Compile Python functions into C extensions
  - Encrypt customer database queries
  answer: 0
  explanation: Conditional routing edges are pure functions that read the state dictionary
    and return the destination node ID, decoupling execution logic from workflow topology.
