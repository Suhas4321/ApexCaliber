hints:
  - "Maintain `cache: dict = {}`, `hits = 0`, `root_queries = 0`, and `results: list = []`."
  - "For each query in queries: if in cache, hits += 1 and append cached value."
  - "If not in cache: root_queries += 1, lookup in root_zone, store in cache if found, and append."

solution:
  code: |
    class Solution:
        def simulate_dns_resolver(self, root_zone: dict[str, str], queries: list[str]) -> dict:
            resolver_cache: dict[str, str] = {}
            cache_hits = 0
            cache_misses = 0
            root_queries = 0
            resolved_ips: list[any] = []

            for domain in queries:
                if domain in resolver_cache:
                    cache_hits += 1
                    resolved_ips.append(resolver_cache[domain])
                else:
                    cache_misses += 1
                    root_queries += 1
                    ip = root_zone.get(domain)
                    if ip is not None:
                        resolver_cache[domain] = ip
                    resolved_ips.append(ip)

            total = len(queries)
            hit_rate = round((cache_hits / total) * 100, 2) if total > 0 else 0.0

            return {
                "cache_hits": cache_hits,
                "cache_misses": cache_misses,
                "root_queries": root_queries,
                "resolved_ips": resolved_ips,
                "cache_hit_rate": hit_rate,
                "final_cache": resolver_cache,
            }
  explanation: >-
    Recursive DNS resolvers traverse the delegation tree to discover IP addresses. Caching answers locally
    satisfies repeat lookups in sub-millisecond RAM time, reducing load on global root and authoritative nameservers
    by over 98%.
  time: O(Q) where Q is the number of domain queries
  space: O(D) for cached unique domain records in resolver RAM

pitch_script: |
  **(Clarify)** "We need to simulate a recursive DNS resolver that resolves domain names to IP addresses, caching lookups locally to eliminate redundant authoritative root queries."

  **(Brute force)** "Sending every lookup over the wide area network to authoritative root servers introduces 200ms+ latency per web request and causes root server congestion."

  **(Trigger)** "Domain name to IP resolution and hierarchical caching signals the DNS recursive resolution pattern."

  **(Optimal)** "We check our in-memory resolver cache first. On hit, we return the cached IP in O(1) time. On miss, we perform an authoritative lookup, populate the resolver cache with the result, and record the IP."

  **(Complexity)** "Executes in O(Q) time and O(D) space where D is unique domains stored."

