hints:
  - "Maintain `frames: list = []`, `page_faults = 0`, `page_hits = 0`, and `evictions: list = []`."
  - "If page in frames: increment `page_hits`. If algorithm == 'LRU': remove and append page to update recency."
  - "If page not in frames: increment `page_faults`. If len(frames) == capacity: evict oldest with `victim = frames.pop(0)` and record it. Append new page."

solution:
  code: |
    class Solution:
        def simulate_page_replacement(self, capacity: int, pages: list[int], algorithm: str) -> dict:
            frames: list[int] = []
            page_faults = 0
            page_hits = 0
            evictions: list[int] = []
            frame_snapshots: list[list[int]] = []

            for p in pages:
                if p in frames:
                    page_hits += 1
                    if algorithm == "LRU":
                        frames.remove(p)
                        frames.append(p)
                else:
                    page_faults += 1
                    if len(frames) == capacity:
                        victim = frames.pop(0)
                        evictions.append(victim)
                    frames.append(p)
                frame_snapshots.append(list(frames))

            total = len(pages)
            hit_rate = round((page_hits / total) * 100, 2) if total > 0 else 0.0

            return {
                "page_faults": page_faults,
                "page_hits": page_hits,
                "hit_rate_pct": hit_rate,
                "evictions": evictions,
                "final_frames": frames,
                "frame_snapshots": frame_snapshots,
            }
  explanation: >-
    Virtual memory paging divides logical memory into pages mapped to physical page frames. When all frames are full,
    LRU exploits temporal locality by preserving recently accessed pages, whereas FIFO suffers from Belady's Anomaly.
    Simulating page replacement quantifies cache efficiency and explains why working sets exceeding physical RAM cause Thrashing.
  time: O(N * C) where N is memory references and C is frame capacity
  space: O(C) for resident frame memory

pitch_script: |
  **(Clarify)** "We need to simulate an OS page replacement engine executing FIFO or LRU policies to track page faults, page hits, and victim evictions under constrained physical memory frames."

  **(Brute force)** "Without paging, memory must be allocated contiguously, causing OOM crashes when total workload exceeds hardware RAM."

  **(Trigger)** "Page faults, victim eviction, and frame capacity constraints signal Virtual Memory Page Replacement."

  **(Optimal)** "We maintain a list of active page frames. On hit, we increment hits (and for LRU, update recency). On fault, we increment faults, evict the oldest frame from index 0 if full, and append the new page."

  **(Complexity)** "Executes in O(N * C) time and O(C) space where C is physical frame capacity."

