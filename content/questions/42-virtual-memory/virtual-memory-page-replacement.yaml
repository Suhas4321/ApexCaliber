slug: virtual-memory-page-replacement
lc: 9431
citadel_id: os_concurrency
brick_layer: 1
runner_type: python_practical
concept:
  problem_it_solves: 'How can an operating system run programs requiring 32 GB of
    memory when the machine only has 8 GB of physical RAM? Virtual memory decouples
    a program''s logical address space from physical hardware memory. The OS divides
    memory into fixed-size blocks called Pages (typically 4KB). Physical RAM is divided
    into matching Page Frames. When a CPU executes an instruction referencing a page
    not currently resident in physical RAM, the Memory Management Unit (MMU) triggers
    a hardware interrupt called a Page Fault. If physical RAM is full, the OS must
    choose a victim page to evict to disk swap space. If the page replacement policy
    is naive or the program''s working set exceeds physical RAM, the system enters
    Thrashing: the CPU spends 99% of its cycles waiting on disk I/O page swaps, freezing
    user applications.'
  brute_force: Allocating contiguous physical RAM for entire processes without paging.
    Multitasking becomes impossible once total process memory exceeds physical RAM
    limits, resulting in Out-Of-Memory (OOM) crashes.
  brute_force_complexity: O(1) fatal allocation limit with zero overcommit capability.
  key_insight: '1. Temporal Locality: Programs tend to access recently referenced
    memory pages repeatedly. 2. Least Recently Used (LRU) Eviction: When all page
    frames are occupied, evict the page that has not been accessed for the longest
    time. 3. Belady''s Anomaly in FIFO: First-In First-Out eviction can paradoxically
    suffer MORE page faults when given MORE physical frames, whereas LRU is a stack
    algorithm immune to Belady''s anomaly.'
  real_world: Linux kernel kswapd daemon and page cache reclaim, database buffer pool
    management in PostgreSQL/MySQL InnoDB, and mobile app background freeze/eviction
    in iOS/Android.
statement:
  clean: "Implement an **OS Virtual Memory Page Replacement Engine**:\n`simulate_page_replacement(capacity:\
    \ int, pages: list[int], algorithm: str) -> dict`.\n\n### Memory Model\n- `capacity`:\
    \ Number of physical page frames available in RAM (`int >= 1`).\n- `pages`: Sequence\
    \ of virtual page numbers accessed by the CPU (e.g. `[7, 0, 1, 2, 0, 3, 0, 4]`).\n\
    - `algorithm`: Either `\"FIFO\"` or `\"LRU\"`.\n\n### Execution Rules:\n1. Initialize:\n\
    \   - `frames: list[int] = []` (current pages loaded in physical RAM)\n   - `page_faults:\
    \ int = 0` (counter of page faults requiring disk fetch)\n   - `page_hits: int\
    \ = 0` (counter of references already in RAM)\n   - `evictions: list[int] = []`\
    \ (list of victim page numbers evicted from RAM)\n   - `frame_snapshots: list[list[int]]\
    \ = []` (snapshot of `list(frames)` after each page access)\n2. For each `p` in\
    \ `pages`:\n   - If `p in frames`:\n     - Increment `page_hits += 1`.\n     -\
    \ **For LRU**: Update recency by moving `p` to the most-recently-used position\
    \ (remove `p` and append `p` to back).\n     - **For FIFO**: Do NOT modify frame\
    \ ordering on hit.\n   - If `p not in frames`:\n     - Increment `page_faults\
    \ += 1`.\n     - If `len(frames) < capacity`:\n       - There is an empty frame:\
    \ append `p` to `frames`.\n     - If `len(frames) == capacity`:\n       - Evict\
    \ victim page:\n         - The victim is the front element: `victim = frames.pop(0)`.\n\
    \         - Record `evictions.append(victim)`.\n         - Insert new page: `frames.append(p)`.\n\
    \   - Record `frame_snapshots.append(list(frames))`.\n3. Return a telemetry summary\
    \ dictionary:\n   - `\"page_faults\"`: int\n   - `\"page_hits\"`: int\n   - `\"\
    hit_rate_pct\"`: float rounded to 2 decimal places (`(page_hits / len(pages) *\
    \ 100)` if len(pages) > 0 else 0.0)\n   - `\"evictions\"`: list[int]\n   - `\"\
    final_frames\"`: list[int]\n   - `\"frame_snapshots\"`: list[list[int]]\n"
  oa_story: "**Zerodha Kite Trading Terminal \u2014 High-Frequency Memory Thrashing**\n\
    \nDuring market opening volatility, Zerodha's trading engine allocated massive\
    \ historical tick buffers.\nPhysical RAM filled completely. Because the server\
    \ used a naive FIFO page replacement policy,\nthe OS entered severe Thrashing:\
    \ kernel page-fault interrupts overwhelmed the CPU,\ncausing order placement latencies\
    \ to spike from 15 milliseconds to 12 seconds.\n\nImplement this Virtual Memory\
    \ Page Replacement simulator to compare FIFO vs LRU eviction and prove how temporal\
    \ locality reduces page faults by 40%+.\n"
  trigger_keywords:
  - Page Replacement
  - simulate_page_replacement
  - page_faults
  - hit_rate_pct
  - final_frames
  examples:
  - input: capacity = 3, pages = [1, 2, 3, 1, 4], algorithm = "LRU"
    output: '{"page_faults: 4, "page_hits": 1, "hit_rate_pct": 20.0, "evictions":
      [2], "final_frames": [3, 1, 4]}'
    explanation: 'Pages 1, 2, 3 load. Page 1 hits and becomes MRU (frames: [2, 3,
      1]). Page 4 causes fault: evicts LRU page 2.'
  - input: capacity = 2, pages = [1, 2, 1, 2], algorithm = "FIFO"
    output: '{"page_faults": 2, "page_hits": 2, "hit_rate_pct": 50.0, "evictions":
      [], "final_frames": [1, 2]}'
    explanation: Initial loads fault; subsequent references hit in RAM.
  constraints:
  - 1 <= capacity <= 50
  - 0 <= len(pages) <= 1000
  - algorithm in ['FIFO', 'LRU']
constraint_quiz:
  prompt: What is Belady's Anomaly and which page replacement algorithm is vulnerable
    to it?
  options:
  - Belady's Anomaly is when increasing the number of physical page frames results
    in MORE page faults; FIFO is vulnerable, whereas LRU is immune
  - Belady's Anomaly is a CPU cache line false sharing bug in multi-threaded C++
  - Belady's Anomaly is an infinite loop in Dijkstra's shortest path algorithm
  - Belady's Anomaly occurs only when virtual memory is disabled
  answer: 0
  explanation: FIFO eviction does not consider access frequency or recency. In specific
    page reference strings, giving a FIFO system 4 frames instead of 3 can paradoxically
    increase total page faults. LRU is a stack algorithm and is mathematically immune
    to Belady's Anomaly.
pattern_quiz:
  prompt: What hardware component accelerates virtual-to-physical address translation
    to prevent double memory lookups per instruction?
  options:
  - The Translation Lookaside Buffer (TLB), an on-chip associative cache of recent
    page table translations
  - The Hard Drive disk swap partition
  - The GPU shader core
  - The BIOS battery
  answer: 0
  explanation: Without the TLB (Translation Lookaside Buffer), every memory reference
    would require at least two memory lookups (one for the page table, one for the
    data). A TLB hit resolves virtual-to-physical translations in sub-nanosecond hardware
    time.
