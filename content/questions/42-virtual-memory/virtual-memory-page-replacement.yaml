journey:
- id: w42_s1_address_space_illusion
  title: The Virtual Memory Illusion & 4KB Page Boundaries
  subtitle: How an operating system runs 32GB workloads on 8GB physical RAM
  scenario: How can an operating system run programs requiring 32 GB of memory when
    the machine only has 8 GB of physical RAM?
  mechanism: Virtual memory decouples a process's logical address space from physical
    hardware memory. The OS divides memory into fixed-size blocks called Pages (typically
    4KB). Physical RAM is divided into matching Page Frames. The CPU Memory Management
    Unit (MMU) uses Page Tables to translate virtual addresses to physical frames
    dynamically.
  prediction:
    prompt: What happens when total allocated virtual memory across running processes
      exceeds physical hardware RAM?
    choices:
    - id: opt_a
      label: The OS transparently maps active pages into RAM frames and stores dormant
        pages in disk swap space, triggering page faults when needed.
      explanation: 'Correct! Virtual memory enables overcommit: active working sets
        live in RAM, while inactive pages are swapped to disk.'
      is_correct: true
    - id: opt_b
      label: The computer immediately crashes with hardware memory controller damage.
      explanation: Misconception! Operating systems are designed to manage memory
        overcommit safely via paging and disk swap.
      is_correct: false
    - id: opt_c
      label: Virtual memory compresses physical RAM by 10x using lossless ZIP algorithms
        inside the CPU.
      explanation: Incorrect! While zswap/zram compressed caches exist, virtual memory
        fundamentally relies on address space paging and swap backing.
      is_correct: false
    revealed_explanation: Virtual memory isolates processes and allows systems to
      overcommit memory by keeping only the active working set resident in physical
      RAM frames.
  controls:
  - id: physical_ram_gb
    label: Physical RAM Capacity (GB)
    type: slider
    default: 8
    min: 4
    max: 64
    step: 4
    description: Total physical hardware memory installed
  - id: virtual_process_size_gb
    label: Total Virtual Allocated Memory (GB)
    type: slider
    default: 24
    min: 4
    max: 64
    step: 4
    description: Combined virtual address space of running processes
  visualizer_type: system_blueprint
  visualizer_config:
    title: MMU Virtual Address Translation & Page Table
- id: w42_s2_page_fault_trap
  title: The Anatomy of a Page Fault Interrupt
  subtitle: The 100,000x latency penalty when accessing non-resident pages
  scenario: A CPU instruction attempts to read address 0x7FFF0040. The MMU consults
    the page table entry and discovers the Present Bit is 0. What sequence unfolds?
  mechanism: The MMU triggers a hardware Page Fault interrupt (interrupt vector 14
    on x86). The CPU halts user execution, saves registers, switches to kernel mode,
    initiates disk swap I/O to read the 4KB page into an empty RAM frame, updates
    the Page Table entry with the frame number and Present Bit = 1, and resumes the
    user process.
  prediction:
    prompt: Why is a page fault hundreds of thousands of times slower than a direct
      physical RAM access?
    choices:
    - id: opt_a
      label: "RAM latency is ~50-100 nanoseconds, whereas reading a missing page from\
        \ disk swap takes ~100 microseconds (NVMe) to 10 milliseconds (HDD) \u2014\
        \ a 100,000x gap."
      explanation: Correct! Physical disk I/O introduces a massive mechanical or bus
        latency penalty compared to direct CPU memory bus access.
      is_correct: true
    - id: opt_b
      label: The CPU must reboot its memory controllers on every page fault.
      explanation: Incorrect! The hardware memory controller remains running; the
        delay is purely disk storage I/O and kernel interrupt handling.
      is_correct: false
    - id: opt_c
      label: The operating system must recompile the entire binary from source code.
      explanation: Nonsense! The binary is already compiled; only a 4KB chunk of machine
        code or data needs to be transferred.
      is_correct: false
    revealed_explanation: Because disk swap I/O is 100,000x slower than RAM, an efficient
      page replacement policy is critical to minimize page fault rates.
  controls:
  - id: storage_backing
    label: Swap Storage Medium
    type: select
    default: NVMe SSD
    options:
    - Mechanical HDD (10ms)
    - "NVMe SSD (100\u03BCs)"
    - "ZRAM Compressed (2\u03BCs)"
    description: Latency penalty incurred during page fault swap fetch
  visualizer_type: system_blueprint
  visualizer_config:
    title: 'Page Fault Interrupt Flow: User Mode to Kernel Trap'
- id: w42_s3_beladys_anomaly_fifo
  title: FIFO Eviction & Belady's Anomaly Paradox
  subtitle: Why adding physical RAM can counter-intuitively increase page faults
  scenario: First-In First-Out (FIFO) evicts the oldest page loaded into RAM. What
    happens when you test the reference string [1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5]
    with 3 frames vs 4 frames?
  mechanism: 'For this string, 3 frames produce 9 page faults. Increasing physical
    RAM to 4 frames counter-intuitively produces 10 page faults! This is Belady''s
    Anomaly: FIFO is not a stack algorithm, so the set of pages resident in k frames
    is not always a subset of pages in k+1 frames.'
  prediction:
    prompt: When FIFO page replacement is used, what unexpected behavior can occur
      if you allocate MORE physical RAM frames to a process?
    choices:
    - id: opt_a
      label: 'Belady''s Anomaly: The number of page faults can paradoxically INCREASE
        despite having more physical memory.'
      explanation: Correct! Belady proved in 1969 that FIFO can evict recently needed
        pages simply because they arrived earlier.
      is_correct: true
    - id: opt_b
      label: CPU cache thrashing causes the CPU to lock its clock frequency permanently.
      explanation: Incorrect! Belady's anomaly is an algorithmic property of FIFO,
        not a hardware clock issue.
      is_correct: false
    - id: opt_c
      label: Page faults always decrease linearly with frame count regardless of algorithm.
      explanation: Misconception! FIFO violates monotonic decrease because it lacks
        the stack inclusion property.
      is_correct: false
    revealed_explanation: FIFO fails to account for page access recency or frequency.
      Belady's Anomaly proved that memory replacement algorithms must satisfy the
      stack inclusion property.
  controls:
  - id: frame_capacity
    label: Page Frame Count
    type: slider
    default: 3
    min: 2
    max: 6
    step: 1
    description: Number of physical memory frames allocated
  - id: algorithm
    label: Eviction Policy
    type: select
    default: FIFO
    options:
    - FIFO
    - LRU
    description: Algorithm chosen for victim selection
  visualizer_type: system_blueprint
  visualizer_config:
    title: FIFO vs LRU Page Fault Comparison Matrix
- id: w42_s4_lru_temporal_locality
  title: Least Recently Used (LRU) & Temporal Locality
  subtitle: Exploiting program execution patterns with stack inclusion guarantees
  scenario: 'Real software exhibits strong temporal locality: memory pages accessed
    recently are overwhelmingly likely to be accessed again soon. How does LRU exploit
    this?'
  mechanism: 'LRU tracks page access order. On a page hit, the accessed page moves
    to the head (most recently used). When an eviction occurs, the page at the tail
    (least recently used) is selected. LRU is a Stack Algorithm: the contents of an
    n-frame memory are always a subset of an (n+1)-frame memory, mathematically guaranteeing
    immunity to Belady''s Anomaly.'
  prediction:
    prompt: Why is LRU mathematically guaranteed to NEVER experience Belady's Anomaly?
    choices:
    - id: opt_a
      label: 'LRU is a stack algorithm satisfying the inclusion property: pages resident
        in k frames are always a subset of pages in k+1 frames.'
      explanation: Correct! Because the top k elements in the recency stack are always
        preserved when adding an extra slot, page hits can never decrease.
      is_correct: true
    - id: opt_b
      label: LRU peeks into the future using hardware branch predictors to see next
        instructions.
      explanation: "Misconception! Looking into the future is the theoretical Optimal\
        \ algorithm (B\xE9l\xE1dy's MIN/OPT), not LRU."
      is_correct: false
    - id: opt_c
      label: Because LRU never evicts any pages from physical RAM.
      explanation: Incorrect! LRU evicts pages on every fault when capacity is reached,
        but chooses the least recently accessed page.
      is_correct: false
    revealed_explanation: LRU aligns with temporal locality and stack inclusion, making
      it the bedrock principle behind OS page replacement and database buffer pool
      managers.
  controls:
  - id: access_pattern
    label: Access Locality Pattern
    type: select
    default: Temporal Loop
    options:
    - Temporal Loop
    - Sequential Scan
    - Belady Sequence
    description: Simulated page reference pattern
  visualizer_type: system_blueprint
  visualizer_config:
    title: LRU Doubly-Linked Recency Queue
- id: w42_s5_thrashing_working_set
  title: The Working Set Model & The Thrashing Death Spiral
  subtitle: What happens when total active memory exceeds physical RAM
  scenario: What happens to a production server when active applications collectively
    demand more page frames than physical RAM provides?
  mechanism: "When the sum of all processes' Working Sets (the set of pages referenced\
    \ in a time window \u0394) exceeds physical RAM, every page fault evicts a page\
    \ that is immediately needed by another thread. The system spends 99% of CPU time\
    \ waiting for disk swap I/O transfers, causing CPU utilization to plummet. This\
    \ death spiral is known as Thrashing."
  prediction:
    prompt: If an operating system enters thrashing, what symptom appears in CPU and
      system monitoring metrics?
    choices:
    - id: opt_a
      label: User CPU utilization drops near 0% while iowait spikes to 95-99%, because
        threads spend all time blocked on swap disk I/O.
      explanation: Correct! Thrashing starves the CPU of runnable instructions; the
        disk controller is overwhelmed by continuous page swapping.
      is_correct: true
    - id: opt_b
      label: CPU utilization locks at 100% user space because the CPU executes user
        code faster.
      explanation: Incorrect! The CPU cannot execute user instructions because the
        necessary memory pages are not in RAM.
      is_correct: false
    - id: opt_c
      label: Network bandwidth increases by 10x automatically.
      explanation: Irrelevant! Thrashing is an internal memory/disk bottleneck.
      is_correct: false
    revealed_explanation: To recover from thrashing, modern kernels invoke kswapd
      to proactively reclaim page cache, and if necessary, trigger the OOM killer
      to terminate memory-heavy processes.
  controls:
  - id: working_set_size_pages
    label: Active Working Set (Pages)
    type: slider
    default: 20
    min: 4
    max: 30
    step: 2
    description: Number of unique pages referenced in active loop
  - id: ram_frames
    label: Available RAM Frames
    type: slider
    default: 8
    min: 4
    max: 16
    step: 2
    description: Physical page frames in memory
  visualizer_type: system_blueprint
  visualizer_config:
    title: 'Thrashing Curve: Page Fault Rate vs Working Set'
- id: w42_s6_transfer_challenge
  title: 'Transfer Challenge: OS Virtual Memory Page Replacement Engine'
