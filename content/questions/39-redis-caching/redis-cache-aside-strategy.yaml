drills:
  - skill: setup
    title: Check cache hit vs miss
    goal: Differentiate between cached in-memory data and missing keys.
    instructions: Return True if `key in cache`, else False.
    function:
      name: drill_is_cached
      params:
        - name: cache
        - name: key
    starter_code: |
      class Solution:
          def drill_is_cached(self, cache: dict, key: str) -> bool:
              pass
    tests:
      - args:
          - k1: v1
          - k1
        expected: true
      - args:
          - k1: v1
          - k2
        expected: false
    solution: |
      class Solution:
          def drill_is_cached(self, cache: dict, key: str) -> bool:
              return key in cache
    hint: Use Python `key in cache` operator.

  - skill: core
    title: Calculate cache hit rate percentage
    goal: Compute hit rate percentage rounded to 2 decimal places.
    instructions: Return `round((hits / (hits + misses)) * 100, 2)` if `(hits + misses) > 0` else `0.0`.
    function:
      name: drill_hit_rate
      params:
        - name: hits
        - name: misses
    starter_code: |
      class Solution:
          def drill_hit_rate(self, hits: int, misses: int) -> float:
              pass
    tests:
      - args:
          - 3
          - 1
        expected: 75.0
      - args:
          - 0
          - 0
        expected: 0.0
    solution: |
      class Solution:
          def drill_hit_rate(self, hits: int, misses: int) -> float:
              total = hits + misses
              return round((hits / total) * 100, 2) if total > 0 else 0.0
    hint: Guard against zero division when total reads is 0.

  - skill: edge
    title: Invalidate cache key safely
    goal: Delete key from cache dictionary if present without raising KeyError.
    instructions: Use `cache.pop(key, None)` to safely evict key from cache.
    function:
      name: drill_invalidate_key
      params:
        - name: cache
        - name: key
    starter_code: |
      class Solution:
          def drill_invalidate_key(self, cache: dict, key: str) -> dict:
              pass
    tests:
      - args:
          - item_1: milk
          - item_1
        expected: {}
      - args:
          - item_1: milk
          - item_2
        expected:
          item_1: milk
    solution: |
      class Solution:
          def drill_invalidate_key(self, cache: dict, key: str) -> dict:
              cache.pop(key, None)
              return cache
    hint: "`cache.pop(key, None)` safely deletes without KeyError."

hints:
  - "Maintain a local `cache = {}` dictionary and track four integer counters for hits, misses, reads, and writes."
  - "On GET: check `if item in cache: hits += 1; return cache[item]`. Otherwise: `misses += 1; db_reads += 1; val = database.get(item); cache[item] = val`."
  - "On SET: update `database[item] = new_val`, increment `db_writes += 1`, and invalidate cache: `cache.pop(item, None)`."

solution:
  code: |
    class Solution:
        def simulate_cache_aside(self, database: dict[str, str], operations: list[list[str]]) -> dict:
            cache: dict[str, str] = {}
            cache_hits = 0
            cache_misses = 0
            db_reads = 0
            db_writes = 0
            results: list[any] = []

            for op in operations:
                op_type = op[0]
                item_id = op[1]

                if op_type == "GET":
                    if item_id in cache:
                        cache_hits += 1
                        results.append(cache[item_id])
                    else:
                        cache_misses += 1
                        db_reads += 1
                        val = database.get(item_id)
                        if val is not None:
                            cache[item_id] = val
                        results.append(val)
                elif op_type == "SET":
                    new_val = op[2]
                    database[item_id] = new_val
                    db_writes += 1
                    cache.pop(item_id, None)
                    results.append("OK")

            total_reads = cache_hits + cache_misses
            hit_rate = round((cache_hits / total_reads) * 100, 2) if total_reads > 0 else 0.0

            return {
                "cache_hits": cache_hits,
                "cache_misses": cache_misses,
                "db_reads": db_reads,
                "db_writes": db_writes,
                "hit_rate_pct": hit_rate,
                "results": results,
                "final_cache": cache,
            }
  explanation: >-
    The Cache-Aside pattern delegates caching responsibility to the application layer. By checking the in-memory cache
    before falling back to the persistent database, repeat queries are answered in sub-millisecond RAM latency. Deleting the
    key on write guarantees that stale records are cleared immediately without complex two-phase distributed locks.
  time: O(O) where O is the number of operations, with each cache lookup running in O(1) time
  space: O(C) where C is the number of cached keys stored in RAM

pitch_script: |
  **(Clarify)** "We need to simulate the Cache-Aside pattern where reads query an in-memory cache before hitting the primary database, and writes persist to the database while invalidating the cache."

  **(Brute force)** "Without a cache, every read query hits the database. Under high concurrency, database connection pools saturate and cause 504 timeouts."

  **(Trigger)** "High-read to write ratios and database read offloading immediately signal an in-memory Cache-Aside pattern."

  **(Optimal)** "On GET, we check if the key is in our in-memory cache. If present, we count a cache hit and return the value. If missing, we count a miss, query the database, populate the cache, and return. On SET, we update the primary database, increment writes, and invalidate the key from the cache to prevent stale data."

  **(Complexity)** "Each operation runs in O(1) time, with overall space bounded by the number of unique cached keys in RAM."

twist:
  lc: 9404
  title: Single-Flight Cache Lock & Stampede Prevention
  why: Cache-aside protects against standard traffic, but when a hot key expires under 10k RPS, multiple threads simultaneously miss and overwhelm the DB (Cache Stampede). Single-flight locks coalesce concurrent misses into a single DB query.

