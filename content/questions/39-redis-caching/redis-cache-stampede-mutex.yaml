hints:
- 'Maintain `cache: dict`, `locks: set`, and counters for `hits`, `misses`, `db_queries`,
  and `lock_waits`.'
- 'When key is in cache: increment `cache_hits` and record `cache[key]`.'
- 'On miss: increment `cache_misses`. If `key in locks`: increment `lock_waits`, wait
  for completion, and record value. Otherwise: lock, query DB (`db_queries += 1`),
  populate cache, record value, and unlock.'
solution:
  code: "class Solution:\n    def simulate_stampede_mutex(self, database: dict[str,\
    \ str], requests: list[str]) -> dict:\n        cache: dict[str, str] = {}\n  \
    \      locks: set[str] = set()\n        cache_hits = 0\n        cache_misses =\
    \ 0\n        db_queries = 0\n        lock_waits = 0\n        results: list[any]\
    \ = []\n\n        for key in requests:\n            if key in cache:\n       \
    \         cache_hits += 1\n                results.append(cache[key])\n      \
    \      else:\n                cache_misses += 1\n                if key in locks:\n\
    \                    lock_waits += 1\n                    val = cache.get(key,\
    \ database.get(key))\n                    results.append(val)\n              \
    \  else:\n                    locks.add(key)\n                    db_queries +=\
    \ 1\n                    val = database.get(key)\n                    if val is\
    \ not None:\n                        cache[key] = val\n                    results.append(val)\n\
    \                    locks.remove(key)\n\n        return {\n            \"cache_hits\"\
    : cache_hits,\n            \"cache_misses\": cache_misses,\n            \"db_queries\"\
    : db_queries,\n            \"lock_waits\": lock_waits,\n            \"results\"\
    : results,\n            \"stampede_prevented\": db_queries < cache_misses,\n \
    \       }\n"
  explanation: A mutex lock coordinates concurrent misses on hot cache keys. The first
    caller acquires the lock and queries the database. All other simultaneous callers
    observe the active lock, avoiding redundant downstream load and safely consuming
    the freshly computed result once the lock holder populates the cache.
  time: O(N) where N is request volume
  space: O(C) for cached entries in RAM
pitch_script: '**(Clarify)** "We need to prevent cache stampedes where multiple concurrent
  requests for an expired key overload the primary database simultaneously."


  **(Brute force)** "Without a lock, 1,000 concurrent cache misses trigger 1,000 duplicate
  SQL queries, saturating DB connections."


  **(Trigger)** "Hot key expiration and database thundering herd signals Distributed
  Mutex Locking or Single-Flight request coalescing."


  **(Optimal)** "When a cache miss occurs, the worker attempts to acquire an exclusive
  lock for that key. The winner queries the database and backfills the cache. All
  other callers observe the lock, wait, and read the populated value from RAM."


  **(Complexity)** "Executes in O(N) time with O(1) lock coordination per request."

  '
twist:
  lc: 9404
  title: Single-Flight In-Flight Request Coalescing
  why: Mutex locks require distributed lock coordination (Redis NX); in single-process
    async web servers like FastAPI/Node.js, in-memory single-flight futures coalesce
    concurrent calls without needing network round trips.
