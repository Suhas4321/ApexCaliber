solution:
  code: |
    class Solution:
        def simulate_stampede_mutex(self, database: dict[str, str], requests: list[str]) -> dict:
            cache: dict[str, str] = {}
            locks: set[str] = set()
            cache_hits = 0
            cache_misses = 0
            db_queries = 0
            lock_waits = 0
            results: list[any] = []

            for key in requests:
                if key in cache:
                    cache_hits += 1
                    results.append(cache[key])
                else:
                    cache_misses += 1
                    if key in locks:
                        lock_waits += 1
                        val = cache.get(key, database.get(key))
                        results.append(val)
                    else:
                        locks.add(key)
                        db_queries += 1
                        val = database.get(key)
                        if val is not None:
                            cache[key] = val
                        results.append(val)
                        locks.remove(key)

            return {
                "cache_hits": cache_hits,
                "cache_misses": cache_misses,
                "db_queries": db_queries,
                "lock_waits": lock_waits,
                "results": results,
                "stampede_prevented": db_queries < cache_misses,
            }
  explanation: >-
    A mutex lock coordinates concurrent misses on hot cache keys. The first caller acquires the lock and queries
    the database. All other simultaneous callers observe the active lock, avoiding redundant downstream load and
    safely consuming the freshly computed result once the lock holder populates the cache.
  time: O(N) where N is request volume
  space: O(C) for cached entries in RAM

pitch_script: |
  **(Clarify)** "We need to prevent cache stampedes where multiple concurrent requests for an expired key overload the primary database simultaneously."

  **(Brute force)** "Without a lock, 1,000 concurrent cache misses trigger 1,000 duplicate SQL queries, saturating DB connections."

  **(Trigger)** "Hot key expiration and database thundering herd signals Distributed Mutex Locking or Single-Flight request coalescing."

  **(Optimal)** "When a cache miss occurs, the worker attempts to acquire an exclusive lock for that key. The winner queries the database and backfills the cache. All other callers observe the lock, wait, and read the populated value from RAM."

  **(Complexity)** "Executes in O(N) time with O(1) lock coordination per request."

twist:
  lc: 9404
  title: Single-Flight In-Flight Request Coalescing
  why: Mutex locks require distributed lock coordination (Redis NX); in single-process async web servers like FastAPI/Node.js, in-memory single-flight futures coalesce concurrent calls without needing network round trips.

