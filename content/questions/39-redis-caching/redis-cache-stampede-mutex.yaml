              return f"lock:{key}"
    hint: Return `f"lock:{key}"`.

  - skill: core
    title: Acquire mutex lock with NX check
    goal: Add key to lock list only if not already locked.
    instructions: If `key in locks`, return False. Otherwise `locks.append(key)` and return True.
    function:
      name: drill_acquire_lock
      params:
        - name: locks
        - name: key
    starter_code: |
      class Solution:
          def drill_acquire_lock(self, locks: list, key: str) -> bool:
              pass
    tests:
      - args:
          - []
          - key_a
        expected: true
      - args:
          - - key_a
          - key_a
        expected: false
    solution: |
      class Solution:
          def drill_acquire_lock(self, locks: list, key: str) -> bool:
              if key in locks:
                  return False
              locks.append(key)
              return True
    hint: "Check if key in locks: return False, else locks.append(key) and return True."

  - skill: edge
    title: Safe release of lock
    goal: Remove key from active locks list without throwing error if absent.
    instructions: If `key in locks`, remove it and return True. Otherwise return False.
    function:
      name: drill_release_lock
      params:
        - name: locks
        - name: key
    starter_code: |
      class Solution:
          def drill_release_lock(self, locks: list, key: str) -> bool:
              pass
    tests:
      - args:
          - - key_1
          - key_1
        expected: true
      - args:
          - []
          - key_1
        expected: false
    solution: |
      class Solution:
          def drill_release_lock(self, locks: list, key: str) -> bool:
              if key in locks:
                  locks.remove(key)
                  return True
              return False
    hint: "Check membership before removing."

