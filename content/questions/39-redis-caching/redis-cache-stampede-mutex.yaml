journey:
- id: w39_s1_origin_bottleneck
  title: The Origin Database Bottleneck & In-Memory Caching
  subtitle: Why relational databases cannot serve 50,000 identical queries per second
  scenario: A social media app reaches 100,000 active users. All users view the same
    viral homepage feed. The database CPU hits 100% and queries slow down to 8 seconds.
  mechanism: Reading from disk or executing complex SQL joins costs milliseconds per
    query and locks connection pool slots. In-memory data stores like Redis serve
    responses from RAM in <1ms over single-threaded in-memory hash tables, handling
    100,000+ QPS per node.
  prediction:
    prompt: What is the typical latency differential between querying an indexed relational
      database row on NVMe SSD versus querying a Redis key in RAM?
    choices:
    - id: opt_a
      label: Redis RAM lookups take <1ms, whereas relational database queries typically
        take 5ms to 50ms (or seconds under pool contention).
      explanation: Correct! RAM is orders of magnitude faster than disk I/O and SQL
        query parsing.
      is_correct: true
    - id: opt_b
      label: Relational databases are faster because SQL queries compile directly
        into GPU instructions.
      explanation: Incorrect! Standard RDBMS engines execute on CPU and read from
        storage.
      is_correct: false
    - id: opt_c
      label: There is zero performance difference because both store data on disk.
      explanation: Incorrect! Redis is an in-memory data structure store.
      is_correct: false
    revealed_explanation: In-memory caches are the primary architectural mechanism
      used to scale high-read web applications.
  controls:
  - id: traffic_volume_qps
    label: Inbound Query Volume (QPS)
    type: slider
    default: 2500
    min: 100
    max: 10000
    step: 100
    description: Simulate concurrent read query volume against database
  - id: enable_redis_cache
    label: Enable Redis In-Memory Caching
    type: toggle
    default: true
    description: Route reads through Redis cache layer
  visualizer_type: cache_relational
  visualizer_config:
    title: Origin DB vs Redis In-Memory Cache
- id: w39_s2_cache_aside_lifecycle
  title: The Cache-Aside (Lazy Loading) Architecture & TTL Expiration
  subtitle: How applications coordinate reads, cache misses, and database hydration
  scenario: How does the Cache-Aside pattern work during normal production operation?
  mechanism: '1. Application checks Redis: GET key. 2. If Cache HIT: Return data to
    client immediately (<1ms). 3. If Cache MISS: Query PostgreSQL origin database,
    store result in Redis with a Time-To-Live (SET key data EX 300), and return data
    to client.'
  prediction:
    prompt: What is the purpose of setting a TTL (Time-To-Live) on cached keys in
      Redis?
    choices:
    - id: opt_a
      label: To prevent RAM from exhausting and ensure the cache eventually evicts
        stale data if application update events are dropped.
      explanation: Correct! TTLs provide automatic memory hygiene and eventual consistency
        guarantees.
      is_correct: true
    - id: opt_b
      label: Because Redis keys automatically delete after 3 queries.
      explanation: Incorrect! Redis keys persist until TTL expires or memory eviction
        triggers.
      is_correct: false
    - id: opt_c
      label: To force the client browser to refresh its cookies.
      explanation: Incorrect! Redis TTL is an internal backend caching parameter.
      is_correct: false
    revealed_explanation: Cache-Aside keeps the cache decoupled from the database
      while TTL guarantees bounded memory usage.
  controls:
  - id: cache_ttl_seconds
    label: Cache Key TTL (seconds)
    type: slider
    default: 60
    min: 5
    max: 300
    step: 5
    description: Time-To-Live before cached key expires in Redis
  visualizer_type: cache_relational
  visualizer_config:
    title: Cache-Aside Flow & Eviction
- id: w39_s3_thundering_herd_stampede
  title: The Cache Stampede (Thundering Herd) Disaster
  subtitle: What happens when a viral key expires under 10,000 requests per second
  scenario: Key match_score_123 expires at 12:00:00. At 12:00:00.010, 5,000 concurrent
    users refresh the screen. What happens to the database?
  mechanism: All 5,000 requests experience a simultaneous cache miss. None see the
    key in Redis. All 5,000 workers fire the exact same SQL query to PostgreSQL simultaneously.
    The database runs out of connection pool slots, thread thrashing occurs, and queries
    time out.
  prediction:
    prompt: When an intensely requested cache key expires under 5,000 concurrent requests,
      what happens without mutex protection?
    choices:
    - id: opt_a
      label: Every concurrent worker queries the database simultaneously, exhausting
        the database connection pool and causing cascading 504 timeouts.
      explanation: Correct! This is the classic Thundering Herd (Cache Stampede) failure
        mode.
      is_correct: true
    - id: opt_b
      label: The database queues the queries sequentially without any performance
        loss.
      explanation: Misconception! 5,000 concurrent connections exhaust DB pool limits
        and trigger thread thrashing.
      is_correct: false
    - id: opt_c
      label: Redis automatically delays returning the miss until the database is ready.
      explanation: Incorrect! Redis immediately returns nil on an expired key.
      is_correct: false
    revealed_explanation: Cache Stampedes are among the most dangerous failure modes
      in distributed systems, turning a cache miss into an origin outage.
  controls:
  - id: stampede_concurrency
    label: Concurrent Misses at Expiration
    type: slider
    default: 1000
    min: 50
    max: 5000
    step: 50
    description: Simulate simultaneous incoming traffic when key TTL hits zero
  visualizer_type: cache_relational
  visualizer_config:
    title: Thundering Herd Connection Pool Crash
- id: w39_s4_mutex_lock_solution
  title: The Distributed Mutex Lock (SET NX EX) Pattern
  subtitle: Ensuring exactly ONE thread queries the database while others wait
  scenario: How can we ensure that out of 5,000 concurrent misses, exactly ONE worker
    queries the database while the other 4,999 wait and read the warm cache?
  mechanism: '1. On cache miss, attempt atomic lock acquisition: SET lock:key token
    NX EX 10. 2. The WINNER gets OK: queries PostgreSQL and writes SET key data EX
    60, then deletes the lock. 3. The LOSERS fail to acquire the lock: they sleep
    for 50ms and retry reading from Redis, hitting the freshly populated cache in
    RAM!'
  prediction:
    prompt: How does SET lock:key token NX EX 10 guarantee that only one thread queries
      the database?
    choices:
    - id: opt_a
      label: The NX flag ensures the key is set ONLY if it does not already exist,
        making lock acquisition an atomic single-winner test-and-set operation.
      explanation: Correct! Atomic NX guarantees exactly one winner among competing
        concurrent threads.
      is_correct: true
    - id: opt_b
      label: It reboots Redis so other threads cannot connect.
      explanation: Incorrect! Other threads continue reading from Redis normally.
      is_correct: false
    - id: opt_c
      label: It forces the database to refuse connections from all other worker threads.
      explanation: Incorrect! The database is completely unaware of the Redis mutex.
      is_correct: false
    revealed_explanation: The distributed mutex shelters origin databases by collapsing
      5,000 duplicate queries into exactly 1 database fetch.
  controls:
  - id: use_stampede_mutex
    label: Enable Stampede Mutex (SET NX EX)
    type: toggle
    default: true
    description: Single-flight mutex lock shielding database
  visualizer_type: cache_relational
  visualizer_config:
    title: Distributed Mutex Shelter
- id: w39_s5_db_constraints_vs_cache
  title: 'Database Constraints vs Cache Mutexes: Who Guarantees What?'
  subtitle: Why Redis locks protect performance, while database constraints protect
    correctness
  scenario: Does a Redis distributed lock replace database unique constraints or row-level
    ACID transactions for inventory purchases?
  mechanism: Redis locks are advisory and non-durable across network partitions (e.g.
    split-brain or GC pauses). The database primary key, foreign key, and UPDATE inventory
    SET stock = stock - 1 WHERE stock > 0 constraints guarantee financial and inventory
    correctness. The Redis mutex exists solely as an architectural shield to protect
    the origin database from resource exhaustion.
  prediction:
    prompt: If a Redis node crashes and releases a lock prematurely while a worker
      is still writing, how does a resilient architecture prevent double-selling inventory?
    choices:
    - id: opt_a
      label: The database enforces an atomic check or constraint (e.g. WHERE stock
        > 0); the DB remains the authoritative source of transactional truth.
      explanation: Correct! Never rely on caching layers for transactional invariant
        guarantees.
      is_correct: true
    - id: opt_b
      label: Redis locks are mathematically guaranteed to never fail even if servers
        lose power.
      explanation: Misconception! Redis memory is non-blocking and subject to network
        partitions.
      is_correct: false
    - id: opt_c
      label: By running the Redis cluster on three different operating systems.
      explanation: Incorrect! Hardware redundancy does not replace transactional database
        constraints.
      is_correct: false
    revealed_explanation: 'Separation of concerns: Redis shields origin latency; Relational
      ACID constraints guarantee business correctness.'
  controls:
  - id: enforce_db_constraints
    label: Enforce Database Atomic Constraints (WHERE stock > 0)
    type: toggle
    default: true
    description: Transactional safety fence at origin database layer
  visualizer_type: cache_relational
  visualizer_config:
    title: Transactional Defense in Depth
