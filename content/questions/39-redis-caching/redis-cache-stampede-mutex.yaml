  lab_solution: "class Solution:\n    def simulate_stampede_mutex(self, database:\
    \ dict[str, str], requests: list[str]) -> dict:\n        cache = {}\n        locks\
    \ = set()\n        db_queries = 0\n        cache_hits = 0\n        cache_misses\
    \ = 0\n        lock_waits = 0\n        results = []\n\n        for key in requests:\n\
    \            if key in cache:\n                cache_hits += 1\n             \
    \   results.append(cache[key])\n            else:\n                cache_misses\
    \ += 1\n                if key not in locks:\n                    locks.add(key)\n\
    \                    db_queries += 1\n                    val = database.get(key)\n\
    \                    if val is not None:\n                        cache[key] =\
    \ val\n                    results.append(val)\n                    locks.remove(key)\n\
    \                else:\n                    lock_waits += 1\n                \
    \    results.append(cache.get(key))\n\n        return {\n            \"db_queries\"\
