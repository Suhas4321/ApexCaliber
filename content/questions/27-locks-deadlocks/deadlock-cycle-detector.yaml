slug: deadlock-cycle-detector
lc: 9422
citadel_id: os_concurrency
brick_layer: 2
runner_type: python_practical
concept:
  problem_it_solves: How do operating systems and database engines detect when a set
    of concurrent processes are frozen in an unrecoverable deadlock? According to
    Coffman's conditions, deadlock occurs when there is Circular Wait. In a Wait-For
    Graph (WFG), a directed edge T_A -> T_B exists if T_A is waiting for a lock held
    by T_B. A directed cycle in this graph is both necessary and sufficient for deadlock.
  brute_force: Letting hung threads block indefinitely until customer requests time
    out.
  brute_force_complexity: System starvation and thread pool exhaustion.
  key_insight: Construct a Wait-For Graph from lock allocations and pending requests,
    then run 3-color DFS to detect directed cycles.
  real_world: PostgreSQL `deadlock_timeout` background detection worker, MySQL InnoDB
    lock table cycle detection, and OS kernel thread monitors.
statement:
  clean: "Implement an OS wait-for graph cycle detector to identify deadlock situations:\n\
    `detect_deadlock(allocations: dict[str, str], requests: list[list[str]]) -> dict`.\n\
    \nInputs:\n- `allocations`: `{lock_id: thread_id}` specifying which thread currently\
    \ holds each lock.\n- `requests`: `[[thread_id, lock_id], ...]` listing threads\
    \ waiting to acquire specific locks.\n\nWait-For Graph Construction:\n- If `thread_A`\
    \ requests `lock_id`, and `allocations[lock_id] == thread_B` (where `thread_A\
    \ != thread_B`):\n  there is a directed edge: `thread_A -> thread_B` (Thread A\
    \ is waiting for Thread B).\n\nDeadlock Detection:\n- Run 3-color DFS cycle detection\
    \ (0: unvisited, 1: currently visiting in recursion stack, 2: fully visited).\n\
    - Search starting from lexicographically sorted thread IDs.\n- If a cycle is detected,\
    \ record the cycle path (e.g. `[\"T1\", \"T2\", \"T1\"]`) and the sorted unique\
    \ list of `deadlocked_threads`.\n\nReturn a dictionary containing:\n- `\"has_deadlock\"\
    `: `bool`\n- `\"cycle\"`: `list[str]` (empty if no cycle)\n- `\"deadlocked_threads\"\
    `: `list[str]` (empty if no cycle)"
  oa_story: "**Swiggy Delivery Matcher \u2014 Lock Inversion Incident**\n\nDuring\
    \ peak lunch hour, Swiggy's delivery assignment service froze completely. Thread\
    \ 1 held the Delivery Partner lock and requested the Order lock. Simultaneously,\
    \ Thread 2 held the Order lock and requested the Delivery Partner lock.\n\nNeither\
    \ thread could progress, freezing order dispatch across Bengaluru. Implement this\
    \ Resource Allocation Graph cycle detector to diagnose deadlocks before system\
    \ hangs occur."
  trigger_keywords:
  - wait-for graph
  - detect_deadlock
  - deadlocked_threads
  examples:
  - input: 'allocations = {"L1": "T1", "L2": "T2"}, requests = [["T1", "L2"], ["T2",
      "L1"]]'
    output: '{"has_deadlock": True, "cycle": ["T1", "T2", "T1"], "deadlocked_threads":
      ["T1", "T2"]}'
    explanation: T1 waits for T2, and T2 waits for T1, creating a circular wait cycle.
  - input: 'allocations = {"L1": "T1", "L2": "T2"}, requests = [["T1", "L3"], ["T2",
      "L1"]]'
    output: '{"has_deadlock": False, "cycle": [], "deadlocked_threads": []}'
    explanation: No cycle exists since L3 is unallocated.
  constraints:
  - 0 <= len(allocations) <= 500
  - 0 <= len(requests) <= 500
constraint_quiz:
  prompt: What graph condition indicates a deadlock in a single-unit resource allocation
    graph?
  options:
  - A directed cycle in the Wait-For Graph
  - An undirected path connecting any two nodes
  - A node with degree greater than 2
  - A bipartite coloring mismatch
  answer: 0
  explanation: In single-unit resource systems, a directed cycle in the Wait-For Graph
    is both necessary and sufficient for deadlock.
pattern_quiz:
  prompt: How does 3-color DFS identify directed graph cycles without false positives?
  options:
  - A back-edge to a node currently marked with Color 1 (in current recursion stack)
    proves a directed cycle
  - Any edge to a Color 2 node proves a cycle
  - Counting total visited nodes exceeding edge count
  - Sorting node IDs alphabetically
  answer: 0
  explanation: Gray (color 1) nodes represent ancestors on the current recursion call
    stack. Re-encountering a gray node confirms a directed cycle.
function:
  name: detect_deadlock
  params:
  - name: allocations
  - name: requests
  returns: any
  compare: exact
starter_code: "class Solution:\n    def detect_deadlock(self, allocations: dict[str,\
  \ str], requests: list[list[str]]) -> dict:\n        pass\n"
