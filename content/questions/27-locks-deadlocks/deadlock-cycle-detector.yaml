journey:
- id: w27_s1_mutual_exclusion
  title: Mutual Exclusion & Race Conditions (Why We Lock)
  subtitle: The non-atomic nature of CPU memory increments and lost updates
  scenario: Two threads increment a shared counter variable count = count + 1 1,000
    times concurrently without a mutex. What happens to the final value?
  mechanism: 'Incrementing is not an atomic CPU instruction: it involves 1. Read memory
    to register, 2. Add 1, 3. Write register to memory. An interleaved thread context
    switch overwrites updates, causing lost increments. Mutexes enforce mutual exclusion
    so only one thread enters the critical section.'
  prediction:
    prompt: If Thread A and Thread B each increment a shared counter 1,000 times without
      locks on a multi-core machine, what is the final counter value?
    choices:
    - id: opt_a
      label: Less than 2,000 (often 1,200 to 1,600) due to race condition overwrites.
      explanation: Correct! Without mutual exclusion, interleaved reads and writes
        overwrite each other, causing lost updates.
      is_correct: true
    - id: opt_b
      label: Exactly 2,000 every single time.
      explanation: Misconception! Without synchronization, race conditions make deterministic
        results impossible.
      is_correct: false
    - id: opt_c
      label: Always 0 because concurrent writes cancel each other out.
      explanation: Incorrect! The value increments, but loses dozens or hundreds of
        operations due to clobbered registers.
      is_correct: false
    revealed_explanation: Locks are essential to enforce mutual exclusion on shared
      mutable state. However, introducing multiple locks creates the risk of Deadlocks.
  controls:
  - id: thread_count
    label: Concurrent Threads
    type: slider
    default: 2
    min: 2
    max: 8
    step: 1
    description: Number of threads competing for critical section
  - id: mutex_enabled
    label: Mutex Lock Enabled
    type: toggle
    default: false
    description: Acquire exclusive lock before modifying shared state
  visualizer_type: system_blueprint
  visualizer_config:
    title: Thread Race Condition & Interleaved CPU Assembly
- id: w27_s2_coffman_conditions
  title: The 4 Coffman Conditions for System Deadlock
  subtitle: The mathematical requirements that produce permanent thread freezes
  scenario: When does a multi-threaded system freeze in an unrecoverable deadlock?
  mechanism: 'Deadlock can occur if and only if all four Coffman conditions hold simultaneously:
    1. Mutual Exclusion (resources held exclusively), 2. Hold and Wait (processes
    holding resources request new ones), 3. No Preemption (resources cannot be forcibly
    taken), 4. Circular Wait (a closed cycle of processes waiting for each other).'
  prediction:
    prompt: If you break ANY ONE of the four Coffman conditions in an operating system,
      can a deadlock still occur?
    choices:
    - id: opt_a
      label: No! All 4 conditions are strictly required simultaneously; breaking any
        single condition makes deadlock mathematically impossible.
      explanation: Correct! Deadlock prevention algorithms focus on eliminating at
        least one Coffman condition (most commonly Circular Wait).
      is_correct: true
    - id: opt_b
      label: Yes, deadlocks can occur spontaneously due to CPU overheating.
      explanation: Incorrect! Deadlock is a logical scheduling and synchronization
        state, not a thermal fault.
      is_correct: false
    - id: opt_c
      label: Yes, breaking Circular Wait only delays the deadlock rather than preventing
        it.
      explanation: Misconception! Without circular wait, the resource allocation graph
        is a directed acyclic graph (DAG), which can never deadlock.
      is_correct: false
    revealed_explanation: Operating system and database architects prevent deadlocks
      by designing protocols that eliminate at least one Coffman condition.
  controls:
  - id: circular_wait_permitted
    label: Circular Wait Allowed
    type: toggle
    default: true
    description: Permit arbitrary circular locking patterns
  - id: preemption_permitted
    label: Resource Preemption Allowed
    type: toggle
    default: false
    description: Kernel can forcibly seize lock from waiting thread
  visualizer_type: system_blueprint
  visualizer_config:
    title: Coffman Conditions Matrix
- id: w27_s3_wait_for_graphs
  title: "Resource Allocation Graphs \u2794 Wait-For Graphs (WFG)"
  subtitle: Modeling threads and locks as a directed dependency graph
  scenario: How do database engines (PostgreSQL, MySQL InnoDB) and OS kernels monitor
    locks to detect deadlocks programmatically?
  mechanism: The kernel collapses the bipartite Resource Allocation Graph (threads
    and locks) into a directed Wait-For Graph (WFG) where nodes are threads. If Thread
    A requests a lock currently allocated to Thread B, a directed edge T_A -> T_B
    is added. For single-unit resources, a directed cycle in the WFG is necessary
    and sufficient for deadlock.
  prediction:
    prompt: If Thread 1 holds Lock A and requests Lock B, while Thread 2 holds Lock
      B and requests Lock A, what does the Wait-For Graph look like?
    choices:
    - id: opt_a
      label: 'A 2-node cycle: T1 -> T2 and T2 -> T1, proving an unresolvable circular
        deadlock.'
      explanation: Correct! T1 is waiting for T2 (owner of Lock B), and T2 is waiting
        for T1 (owner of Lock A). Neither can proceed.
      is_correct: true
    - id: opt_b
      label: A disconnected graph with no edges.
      explanation: Incorrect! Lock requests create directed dependencies between the
        requesting thread and the holding thread.
      is_correct: false
    - id: opt_c
      label: A self-loop on Lock A.
      explanation: Misconception! In a Wait-For Graph, nodes represent threads, not
        locks.
      is_correct: false
    revealed_explanation: 'Wait-For Graphs transform the deadlock problem into a classic
      graph problem: detecting directed cycles.'
  controls:
  - id: scenario_preset
    label: Lock Scenario
    type: select
    default: Classic Deadlock
    options:
    - Classic Deadlock
    - Chain No Cycle
    - 3-Thread Cycle
    description: Simulated thread lock allocations and requests
  visualizer_type: system_blueprint
  visualizer_config:
    title: Wait-For Graph (WFG) Directed Graph Canvas
- id: w27_s4_three_color_dfs
  title: "3-Color DFS Cycle Detection (White \u2794 Gray \u2794 Black)"
  subtitle: Detecting circular wait in O(V + E) time without infinite recursion
  scenario: How does the operating system detect cycles in a Wait-For Graph without
    falling into an infinite loop during graph traversal?
  mechanism: "The kernel uses 3-color Depth-First Search: 0 (White: unvisited), 1\
    \ (Gray: currently in the active recursion call stack), 2 (Black: fully explored\
    \ with all descendants verified acyclic). If DFS visits a node that is currently\
    \ Gray, it has found a back-edge pointing to an active ancestor \u2014 confirming\
    \ a directed cycle in O(V + E) time."
  prediction:
    prompt: During DFS traversal of a Wait-For Graph, which node color encounter indicates
      that a directed cycle exists?
    choices:
    - id: opt_a
      label: Encountering a Gray (visiting) node, indicating a back-edge to an active
        ancestor in the recursion call stack.
      explanation: Correct! A Gray node is currently in the active traversal stack;
        encountering it means a closed loop has been formed.
      is_correct: true
    - id: opt_b
      label: Encountering a Black (visited) node, meaning the search reached a finished
        branch.
      explanation: Incorrect! A Black node has already been completely explored and
        certified free of cycles.
      is_correct: false
    - id: opt_c
      label: Encountering a White (unvisited) node.
      explanation: Incorrect! White nodes are simply unvisited vertices waiting to
        be explored.
      is_correct: false
    revealed_explanation: 3-color DFS allows database engines like PostgreSQL to run
      deadlock detection asynchronously every deadlock_timeout (default 1000ms) with
      minimal CPU overhead.
  controls:
  - id: step_traversal
    label: Step DFS Traversal
    type: button
    default: true
    description: Advance DFS step-by-step watching White -> Gray -> Black transitions
  visualizer_type: system_blueprint
  visualizer_config:
    title: 3-Color DFS Recursion Stack Trace
- id: w27_s5_hierarchical_lock_ordering
  title: 'Deadlock Prevention: Hierarchical Global Lock Ordering'
  subtitle: Eliminating circular wait by design in production architectures
  scenario: Instead of letting threads deadlock and killing one after a timeout, how
    can high-performance distributed systems prevent deadlocks entirely?
  mechanism: 'Establish a global total ordering on all locks (e.g. by sorting lock
    IDs lexicographically: Lock_1 < Lock_2 < Lock_3). Every thread in the system must
    acquire locks in strictly increasing order. If Thread A holds Lock 1 and needs
    Lock 2, it acquires Lock 2. If Thread B needs both, it CANNOT acquire Lock 2 first.
    Circular wait becomes mathematically impossible.'
  prediction:
    prompt: If all threads in an application are strictly required to acquire locks
      in sorted order (Lock A before Lock B, Lock B before Lock C), what happens to
      deadlocks?
    choices:
    - id: opt_a
      label: Deadlocks are mathematically impossible because circular wait cannot
        form in an acyclic directed resource hierarchy.
      explanation: Correct! Hierarchical lock acquisition transforms the resource
        dependency graph into a DAG, completely eliminating circular wait.
      is_correct: true
    - id: opt_b
      label: Deadlocks happen twice as often because all threads queue for Lock A
        first.
      explanation: Misconception! Threads may queue (contention), but they will never
        deadlock (permanent circular freeze).
      is_correct: false
    - id: opt_c
      label: Locks become volatile and lose mutual exclusion guarantees.
      explanation: Incorrect! Mutual exclusion is preserved; only the acquisition
        sequence is disciplined.
      is_correct: false
    revealed_explanation: Hierarchical lock ordering is the gold-standard design pattern
      used in Linux kernel spinlocks, database transaction managers, and concurrent
      systems to prevent deadlocks proactively.
  controls:
  - id: enforce_lock_ordering
    label: Enforce Global Lock Ordering
    type: toggle
    default: true
    description: Sort lock acquisitions by global resource ID
  visualizer_type: system_blueprint
  visualizer_config:
    title: Lock Hierarchy DAG vs Unordered Circular Wait
