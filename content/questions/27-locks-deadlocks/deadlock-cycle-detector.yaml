    - T2
    - T3
  note: Three-thread circular wait
- args:
  - {}
  - []
  expected:
    has_deadlock: false
    cycle: []
    deadlocked_threads: []
  note: Empty graph
visualize_test: 0
drills:
- skill: setup
  title: Build wait-for edge
  goal: Map requester to lock holder.
  instructions: If `lock in allocations` and `allocations[lock] != requester`, return
    `(requester, allocations[lock])`, else None.
  function:
    name: drill_make_edge
    params:
    - name: requester
    - name: lock
    - name: allocations
  starter_code: "class Solution:\n    def drill_make_edge(self, requester: str, lock:\
    \ str, allocations: dict) -> list:\n        pass\n"
  tests:
  - args:
    - T1
    - L2
    - L2: T2
    expected:
    - T1
    - T2
  - args:
    - T1
    - L1
    - L1: T1
    expected: null
  solution: "class Solution:\n    def drill_make_edge(self, requester: str, lock:\
    \ str, allocations: dict) -> list:\n        if lock in allocations and allocations[lock]\
    \ != requester:\n            return [requester, allocations[lock]]\n        return\
    \ None\n"
  hint: Check if lock in allocations and not owned by requester.
- skill: core
  title: Detect back-edge in DFS
  goal: Identify when neighbor is currently in recursion stack.
  instructions: Return `True` if `color.get(neighbor) == 1`, else `False`.
  function:
    name: drill_is_back_edge
    params:
    - name: color
    - name: neighbor
  starter_code: "class Solution:\n    def drill_is_back_edge(self, color: dict, neighbor:\
    \ str) -> bool:\n        pass\n"
  tests:
  - args:
    - T1: 1
    - T1
    expected: true
  - args:
    - T1: 2
    - T1
    expected: false
  solution: "class Solution:\n    def drill_is_back_edge(self, color: dict, neighbor:\
    \ str) -> bool:\n        return color.get(neighbor) == 1\n"
  hint: Check if color is 1.
- skill: edge
  title: Extract cycle members
  goal: Return sorted unique thread IDs in the detected cycle.
  instructions: Return sorted unique elements of `cycle[:-1]` if cycle else `[]`.
  function:
    name: drill_cycle_members
    params:
    - name: cycle
  starter_code: "class Solution:\n    def drill_cycle_members(self, cycle: list) ->\
    \ list:\n        pass\n"
  tests:
  - args:
    - - T1
      - T2
      - T1
    expected:
    - T1
    - T2
  - args:
    - []
    expected: []
  solution: "class Solution:\n    def drill_cycle_members(self, cycle: list) -> list:\n\
    \        return sorted(set(cycle[:-1])) if cycle else []\n"
  hint: Slice `cycle[:-1]`, take set, sort.
hints:
- Construct directed adjacency list `adj` mapping waiting threads to holding threads.
- 'Use 3-color DFS: 0=unvisited, 1=in stack, 2=visited. Reaching color 1 reveals the
  cycle.'
- '| # Pseudocode Blueprint

  | build adj: for t, lock in requests: if lock in alloc: adj[t].append(alloc[lock])

  | run 3-color DFS from sorted threads

  | if neighbor color == 1: cycle found!

  | return has_deadlock, cycle, sorted(deadlocked_threads)'
solution:
  code: "class Solution:\n    def detect_deadlock(self, allocations: dict[str, str],\
    \ requests: list[list[str]]) -> dict:\n        adj: dict[str, list[str]] = {}\n\
    \        all_threads = set(allocations.values())\n        for t, lock in requests:\n\
    \            all_threads.add(t)\n            if lock in allocations:\n       \
    \         holder = allocations[lock]\n                if holder != t:\n      \
    \              adj.setdefault(t, []).append(holder)\n\n        color: dict[str,\
    \ int] = {}\n        cycle_found: list[str] = []\n\n        def dfs(u: str, path:\
    \ list[str]):\n            nonlocal cycle_found\n            color[u] = 1\n  \
    \          path.append(u)\n            for v in adj.get(u, []):\n            \
    \    if cycle_found:\n                    return\n                if color.get(v,\
    \ 0) == 1:\n                    idx = path.index(v)\n                    cycle_found\
    \ = path[idx:] + [v]\n                    return\n                elif color.get(v,\
    \ 0) == 0:\n                    dfs(v, path)\n            path.pop()\n       \
    \     color[u] = 2\n\n        for t in sorted(all_threads):\n            if color.get(t,\
    \ 0) == 0 and not cycle_found:\n                dfs(t, [])\n\n        deadlocked\
    \ = sorted(set(cycle_found[:-1])) if cycle_found else []\n        return {\n \
    \           \"has_deadlock\": len(cycle_found) > 0,\n            \"cycle\": cycle_found,\n\
    \            \"deadlocked_threads\": deadlocked,\n        }\n"
  explanation: Constructing the Wait-For Graph by linking requesters to lock holders
    models resource dependencies. Running a 3-color Depth-First Search reliably isolates
    directed circular dependencies without false positives from non-cyclical shared
    nodes.
  time: O(V + E) where V is threads and E is resource dependencies
  space: O(V + E) for the adjacency list and recursion stack
pitch_script: '**(Clarify)** "We need to construct a Wait-For Graph from lock allocations
  and pending requests and detect any circular wait deadlock cycles."


  **(Brute force)** "Scanning random pairs of threads misses multi-party cycles (e.g.
  T1 -> T2 -> T3 -> T1)."


  **(Trigger)** "Resource allocation dependencies mapped to directed graph cycles
  signals a Wait-For Graph with 3-color cycle detection."


  **(Optimal)** "We build a directed graph where each edge points from a waiting thread
  to the thread holding the requested lock. We perform 3-color DFS (white/gray/black).
  When an edge points to an active gray ancestor on the call stack, we slice the cycle
  path and identify the deadlocked threads."


  **(Complexity)** "Executes in O(V + E) time and O(V + E) space." '
