# Phase 1 pilot. Each lesson is reviewed by hand; do not bulk-generate this graph.
modules:
  - id: os-foundations
    citadel_id: os_concurrency
    title: From a running program to a safe shared counter
    summary: Learn what a process and thread are before diagnosing a race or using a lock.
    position: 1
    cue_card:
      elevator_pitch: A process is a running program with an address space; threads are execution paths inside it. Shared data needs coordination when operations can interleave.
      pillars:
        - The OS creates and schedules processes and threads; an application asks it for services through system calls.
        - Threads in one process share address-space data, while each thread has its own execution state.
        - A race occurs when the result depends on an uncontrolled order of reads and writes.
        - A mutex protects a critical section by allowing one owner at a time.
      tradeoffs:
        - Locks add waiting and can create deadlocks if acquired inconsistently; use the smallest correct critical section.
        - Separate processes offer stronger memory isolation but need explicit communication.
      candidate_trap: The default CPython GIL does not make an arbitrary read–modify–write operation safe. Explain the shared-state invariant and the actual lock.
    lessons:
      - id: os-process
        title: What is a process?
        summary: A saved program becomes a running process when the OS starts it.
        position: 1
        content:
          situation: You open a music app while a browser is already running. How does the computer keep both alive?
          explanation: A program is instructions stored on disk. When the operating system starts it, it creates a process with memory and resources for that running instance. The OS manages which process gets CPU time and controls access to files and devices. An app asks for protected services using a system call. Two launches of the same program can create separate processes.
          terms:
            - {name: Program, meaning: "Instructions saved as a file, before they run."}
            - {name: Process, meaning: One running instance of a program with its own address space and resources.}
            - {name: Operating system, meaning: Software that manages hardware resources and gives applications controlled services.}
          worked_example: A browser and music app are two running processes. The OS switches CPU time between their work and keeps their ordinary memory separate. Pausing the music app does not erase its saved program.
          second_example_prompt: "If you open the same editor twice and type different unsaved notes, what is shared and what is separate?"
          second_example: Opening two copies of a text editor can create two processes from one installed program. They may each hold a different unsaved document in memory.
          misconception: A program is the saved instructions; a process is a running instance. Two windows do not always imply two processes.
          checks:
            - prompt: You have one editor installed and open it twice. Which statement is best?
              choices: ["Every window must be a separate operating system.", "One program can have two running processes.", "A program is the same thing as a CPU core."]
              answer: 1
              explanation: The program is the stored instructions; each running instance can be a process.
            - prompt: An app wants to read a file. Who normally controls access to that device and file?
              choices: ["Any app directly reading arbitrary disk bytes.", "The operating system through a service call.", "The app's screen layout."]
              answer: 1
              explanation: The OS mediates access to resources; applications request those services.
          sources: [https://pages.cs.wisc.edu/~remzi/OSTEP/, https://pdos.csail.mit.edu/6.828/2021/overview.html]
      - id: os-thread
        title: What is a thread?
        summary: Threads are paths of work inside a process that can share data.
        position: 2
        prerequisites: [os-process]
        content:
          situation: A photo app responds to your clicks while it saves a large image. How can one app manage both activities?
          explanation: A process can contain multiple threads. Each thread follows its own path through the program and has its own execution state. Threads in the same process can access shared memory. That makes exchanging data convenient, but it also means one thread can observe another thread's changes. Separate processes do not ordinarily share the same address space directly.
          terms:
            - {name: Thread, meaning: One sequence of execution within a process.}
            - {name: Shared memory, meaning: Data in a process address space that more than one thread can access.}
            - {name: Execution state, meaning: The position and local state a thread needs to continue its work.}
          worked_example: One photo-app thread handles a button press while another prepares a save. Both may refer to the same document object. If they change it together, the app needs a coordination rule.
          second_example_prompt: "Two editor windows run as separate processes. Can they normally read each other's unsaved memory directly?"
          second_example: Two separate text-editor processes have separate address spaces. To exchange a document they normally use a file or some other explicit communication mechanism.
          misconception: Threads in one process share its address space, but each still has its own execution state. Separate processes can communicate when they use an explicit mechanism.
          checks:
            - prompt: Which pair can ordinarily access the same process memory directly?
              choices: ["Two unrelated processes.", "Two threads in one process.", "Two saved program files."]
              answer: 1
              explanation: Threads within one process share its address space; processes normally have separate address spaces.
            - prompt: What remains separate for two threads in the same process?
              choices: ["Every file the process can use.", "The entire program's address space.", "Their execution paths and local execution state."]
              answer: 2
              explanation: Threads share process resources but each needs its own state to resume execution.
          sources: [https://pages.cs.wisc.edu/~remzi/OSTEP/, https://www.cs.cornell.edu/courses/cs3410/2025fa/notes/threads.html]
      - id: os-race
        title: Why can two increments become one?
        summary: A race appears when the order of shared reads and writes changes the outcome.
        position: 3
        prerequisites: [os-thread]
        content:
          situation: Two workers each add one to a shared count. You expect two, but sometimes see one.
          explanation: An increment can be understood as reading a value, calculating a new value, then writing it. Those conceptual steps can interleave with another worker's steps. If both read the old value before either writes, both can write the same new value. The result depends on timing; that is a race condition. This model does not depend on a particular Python bytecode listing.
          terms:
            - {name: Interleaving, meaning: Steps from different workers occur in a mixed order.}
            - {name: Race condition, meaning: Correctness depends on an uncontrolled order of concurrent operations.}
            - {name: Lost update, meaning: One change overwrites another because both used an old value.}
          worked_example: Start with count 0. A reads 0; B reads 0; A writes 1; B writes 1. Two increments were requested, but the count is 1.
          second_example_prompt: "Two cashiers both see one free seat. What can go wrong if each reserves it without checking again?"
          second_example: Two cashiers read that one seat is available and both try to reserve it. Without coordination, each may tell a different customer the seat is theirs.
          misconception: A race does not require two CPU cores. Workers can interleave on one core and still read the same old value.
          visual:
            kind: race
            title: Follow the shared counter, one action at a time
            tracks:
              - id: overlap
                title: Workers overlap — one update is lost
                steps:
                  - label: Start with zero
                    explanation: Both workers intend to add one. Neither has read the shared count yet.
                    state: {Shared count: '0', A's local value: '—', B's local value: '—'}
                  - label: A reads zero
                    explanation: A stores a private copy of the current value before it writes anything.
                    state: {Shared count: '0', A's local value: '0', B's local value: '—'}
                  - label: B also reads zero
                    explanation: B reads the same old value. Both workers now plan to write one.
                    state: {Shared count: '0', A's local value: '0', B's local value: '0'}
                  - label: A writes one
                    explanation: A's increment is visible, but B still holds its old copy of zero.
                    state: {Shared count: '1', A's local value: '0', B's local value: '0'}
                  - label: B writes one
                    explanation: B writes one based on its old read. Two increments were requested, but the count is one.
                    state: {Shared count: '1', A's local value: '0', B's local value: '0'}
              - id: serial
                title: Workers take turns — both updates count
                steps:
                  - label: Start with zero
                    explanation: The intended work is the same. Only the ordering changes.
                    state: {Shared count: '0', A's local value: '—', B's local value: '—'}
                  - label: A reads zero
                    explanation: A reads the count before B begins its read–change–write sequence.
                    state: {Shared count: '0', A's local value: '0', B's local value: '—'}
                  - label: A writes one
                    explanation: A completes its increment. The shared count is now one.
                    state: {Shared count: '1', A's local value: '0', B's local value: '—'}
                  - label: B reads one
                    explanation: B sees A's completed change and calculates two.
                    state: {Shared count: '1', A's local value: '0', B's local value: '1'}
                  - label: B writes two
                    explanation: Both increments are reflected. A mutex can enforce this kind of non-overlap for a critical section.
                    state: {Shared count: '2', A's local value: '0', B's local value: '1'}
          checks:
            - prompt: Count starts at 0. A and B both read 0, then each writes its calculated value. What is the final count?
              choices: ["1", "2", "0"]
              answer: 0
              explanation: Both calculated 1 from the same old value, so the later write overwrites an equivalent value.
            - prompt: Why is this a race condition?
              choices: ["The code contains a loop.", "Two workers always use two CPU cores.", "The result can depend on the order of shared reads and writes."]
              answer: 2
              explanation: The uncontrolled interleaving changes whether one update is lost.
          sources: [https://pages.cs.wisc.edu/~remzi/OSTEP/]
      - id: os-mutex
        title: What does a mutex protect?
        summary: A lock gives one worker exclusive access to a critical section.
        position: 4
        prerequisites: [os-race]
        content:
          situation: The shared counter must be correct even when many threads update it.
          explanation: A mutex is a lock with one owner at a time. A thread acquires it before the critical section, performs the read–change–write sequence, then releases it. Other threads wait their turn. The lock protects an invariant such as “each completed increment changes the count once.” Holding it too long makes other workers wait; inconsistent lock order can cause deadlock later.
          terms:
            - {name: Mutex, meaning: A mutual-exclusion lock that allows one owner at a time.}
            - {name: Critical section, meaning: The steps that must not overlap with another worker's conflicting steps.}
            - {name: Invariant, meaning: "A rule the program must keep true, such as no lost increments."}
          worked_example: A acquires the lock, reads 0, writes 1 and releases it. B then acquires the lock, reads 1, writes 2 and releases it. The final count is 2.
          second_example_prompt: "A booking service runs on several servers. Would one in-process mutex protect the last seat for everyone?"
          second_example: For one available seat, a reservation system can protect the check-and-reserve operation so only one customer can claim it. A database transaction is often the real tool for this case; a local process lock alone would not protect multiple servers.
          misconception: Locking only the final write does not fix the lost update; protect the whole read–change–write section. A local mutex is not a lock shared by every server.
          checks:
            - prompt: Which part needs the counter's mutex?
              choices: ["Only the final print statement.", "The entire read–change–write sequence.", "Only the arithmetic after both threads already read."]
              answer: 1
              explanation: Protect all steps that must behave as one change to shared state.
            - prompt: Why should a lock usually cover no more work than necessary?
              choices: ["A longer lock changes the data type.", "Locks prevent all deadlocks automatically.", "Other workers must wait while it is held."]
              answer: 2
              explanation: An unnecessarily long critical section increases contention and can reduce responsiveness.
          sources: [https://pages.cs.wisc.edu/~remzi/OSTEP/, https://docs.python.org/3/library/threading.html]
  - id: db-foundations
    citadel_id: sql_dbms
    title: From tables to a safe money transfer
    summary: Build relational intuition before joins, transactions and storage internals.
    position: 1
    cue_card:
      elevator_pitch: A relational database stores rows in tables, uses keys to identify and connect them, joins to answer questions across tables, and transactions to keep multi-step changes safe.
      pillars:
        - A table has typed columns and rows; a primary key identifies a logical row.
        - A foreign key checks that a referenced row exists and expresses a relationship.
        - A join combines related rows using a stated matching condition.
        - A transaction groups changes so failure can roll them back together.
      tradeoffs:
        - A missing or incorrect join condition can multiply rows; inspect the relationship and expected cardinality.
        - Transactions protect correctness but may hold locks or conflict with concurrent work.
      candidate_trap: A foreign key is not a copy of the whole parent row, and an index is not the same as a primary key's logical identity.
    lessons:
      - id: db-table
        title: What is a table?
        summary: Rows describe individual records; columns describe their fields.
        position: 1
        content:
          situation: A school needs to remember students and courses after its website closes.
          explanation: A database stores structured information persistently. In a relational database, a table holds records of one kind. Each row is one record; columns name its fields and have data types. A database management system (DBMS) stores the data and answers queries. Begin with a small table before thinking about pages or indexes.
          terms:
            - {name: Table, meaning: A named collection of records with defined columns.}
            - {name: Row, meaning: One record in a table.}
            - {name: Column, meaning: One named field shared by the table's rows.}
          worked_example: A students table has columns student_id, name and year. The row (7, Asha, 1) describes one student. Another row can have a different student_id and the same name.
          second_example_prompt: "In a products table, is a price a new row or a value describing one product?"
          second_example: A products table has product_id, name and price. A price is data about a product, not a separate product row.
          misconception: A table is a logical collection of records. It does not mean every row is stored in one simple flat file on disk.
          checks:
            - prompt: In a students table, what does one row represent?
              choices: ["One student record.", "Every student name.", "One database server."]
              answer: 0
              explanation: A row is one record; the columns define its fields.
            - prompt: Where does the field name “price” belong in a products table?
              choices: ["In the server's process ID.", "In a column definition.", "As a separate database."]
              answer: 1
              explanation: A column names a field that product rows can carry.
          sources: [https://www.postgresql.org/docs/current/tutorial.html]
      - id: db-key
        title: How do keys identify and connect rows?
        summary: A primary key identifies a row; a foreign key refers to another table's row.
        position: 2
        prerequisites: [db-table]
        content:
          situation: Two students are named Asha. The school still needs to know which one enrolled in a course.
          explanation: A primary key is a column or combination of columns whose value uniquely identifies a row and cannot be null. A foreign key in another table refers to a valid row, usually by its primary key. The database can reject an enrollment that points to a student who does not exist. Keys express logical identity and relationships; they are not physical disk addresses.
          terms:
            - {name: Primary key, meaning: A non-null value or set of values that uniquely identifies a table row.}
            - {name: Foreign key, meaning: A column or columns constrained to refer to a valid row in another table.}
            - {name: Constraint, meaning: A rule the DBMS checks when data changes.}
          worked_example: students has student_id 7 for Asha. enrollments has (student_id 7, course_id 12). The enrollment's student_id is a foreign key to students.student_id. An enrollment with student_id 999 is rejected if no such student exists.
          second_example_prompt: "An order belongs to a customer. Which value identifies the order, and which value links it to the customer?"
          second_example: orders.order_id identifies an order; orders.customer_id points to customers.customer_id. A customer can have several orders without copying their full address into each order.
          misconception: A foreign key stores a reference value, not a copy of the entire parent row. Its constraint checks that the referenced row exists.
          checks:
            - prompt: Two students share the name Asha. Which field is a safer primary key?
              choices: ["A unique student_id.", "The name Asha.", "A random row position on disk."]
              answer: 0
              explanation: Names may repeat; a stable unique student_id can identify each logical student.
            - prompt: What should happen if an enrollment refers to a nonexistent student_id?
              choices: ["The name column becomes the primary key.", "The DBMS automatically invents a student.", "A foreign-key constraint can reject it."]
              answer: 2
              explanation: The foreign key protects the relationship by requiring a matching referenced row.
          sources: [https://www.postgresql.org/docs/current/ddl-constraints.html]
      - id: db-join
        title: How do we answer a question across tables?
        summary: A join matches related rows; the join type controls missing matches.
        position: 3
        prerequisites: [db-key]
        content:
          situation: The school wants a list of student names next to the courses they enrolled in.
          explanation: A join combines rows from two tables according to a matching condition, such as enrollments.student_id = students.student_id. An inner join keeps matching pairs. A left join keeps every row from the left table and fills unmatched right-side fields with null. Think about how many matches one row can have before writing SQL.
          terms:
            - {name: Join condition, meaning: The rule that says which rows correspond.}
            - {name: Inner join, meaning: Keeps row pairs that satisfy the match.}
            - {name: Left join, meaning: "Keeps every left row, even without a matching right row."}
          worked_example: Asha (id 7) has two enrollments, so joining students to enrollments produces two rows for her. Bilal (id 8) has none; an inner join omits him, while a left join keeps him with null enrollment fields.
          second_example_prompt: "How could you find customers who have never placed an order while keeping those customers in the result?"
          second_example: To find customers who never ordered, left join customers to orders and look for rows where the matched order ID is null. A missing join condition would produce many unrelated combinations.
          misconception: A join does not guarantee one output row per left row. One left row can match many right rows.
          visual:
            kind: join
            title: Match students with their enrollments
            tracks:
              - id: inner
                title: Inner join — only matching pairs
                steps:
                  - label: Start with two tables
                    explanation: Student IDs connect records. Asha has two enrollment rows; Bilal has none.
                    state: {Students: 'Asha (7), Bilal (8)', Enrollments: '7 → Math; 7 → Physics', Result rows: '—'}
                  - label: Match Asha
                    explanation: Asha's ID matches twice. A join can return multiple rows for one student.
                    state: {Students: 'Asha (7), Bilal (8)', Enrollments: '7 → Math; 7 → Physics', Result rows: 'Asha — Math; Asha — Physics'}
                  - label: Check Bilal
                    explanation: Bilal has no matching enrollment, so an inner join does not include him.
                    state: {Students: 'Asha (7), Bilal (8)', Enrollments: '7 → Math; 7 → Physics', Result rows: 'Asha — Math; Asha — Physics'}
              - id: left
                title: Left join — keep every student
                steps:
                  - label: Start with students on the left
                    explanation: A left join promises to keep every student, whether an enrollment exists or not.
                    state: {Students: 'Asha (7), Bilal (8)', Enrollments: '7 → Math; 7 → Physics', Result rows: '—'}
                  - label: Match Asha
                    explanation: Asha still produces two rows because she matches two enrollments.
                    state: {Students: 'Asha (7), Bilal (8)', Enrollments: '7 → Math; 7 → Physics', Result rows: 'Asha — Math; Asha — Physics'}
                  - label: Keep Bilal
                    explanation: Bilal is kept with a null course because no enrollment matches his ID.
                    state: {Students: 'Asha (7), Bilal (8)', Enrollments: '7 → Math; 7 → Physics', Result rows: 'Asha — Math; Asha — Physics; Bilal — null'}
          checks:
            - prompt: Which join keeps students who have not enrolled in any course?
              choices: ["A join with no matching condition.", "A left join starting from students.", "An inner join only."]
              answer: 1
              explanation: A left join retains all students, including those with no enrollment match.
            - prompt: One student has two enrollments. How many joined rows can that student produce?
              choices: ["2", "0 always", "1 always"]
              answer: 0
              explanation: The student row matches each of its two enrollment rows.
          sources: [https://www.postgresql.org/docs/current/tutorial-join.html]
      - id: db-transaction
        title: How do several changes succeed together?
        summary: A transaction groups related writes and can roll them back after failure.
        position: 4
        prerequisites: [db-join]
        content:
          situation: A school transfers a fee payment from one account to another. The system must not lose the money halfway through.
          explanation: A transaction treats related database changes as one unit. If a step fails before commit, the DBMS can roll back the unit so the partial changes do not remain. Atomicity is this all-or-nothing property. Other ACID properties cover valid rules, concurrent visibility and durability after commit; each needs a later lesson before advanced isolation questions.
          terms:
            - {name: Transaction, meaning: A unit of related database operations.}
            - {name: Commit, meaning: Finish a successful transaction so its changes become permanent.}
            - {name: Rollback, meaning: Undo the transaction's uncommitted changes after failure.}
          worked_example: Account A has 100 and B has 50. In one transaction, subtract 20 from A and add 20 to B, then commit. If the second operation fails, roll back; balances remain 100 and 50, not 80 and 50.
          second_example_prompt: "A shop reduces stock, then fails to create the order. What should happen to the stock change?"
          second_example: An online shop reduces stock and creates an order in one transaction. If order creation fails, the stock reduction should not remain by itself.
          misconception: Atomicity handles all-or-nothing changes; it does not by itself answer every concurrency or business-rule question. Isolation and constraints matter too.
          checks:
            - prompt: A transfer subtracts money but fails before adding it to the destination. What should happen?
              choices: ["Create a foreign key instead.", "Roll back the transaction's uncommitted changes.", "Keep the subtraction alone."]
              answer: 1
              explanation: Atomicity means the related operations succeed together or are undone together.
            - prompt: When should the transfer transaction commit?
              choices: ["Before any statement runs.", "Immediately after subtracting from A.", "After both balance changes succeed and required rules hold."]
              answer: 2
              explanation: Commit only when the unit of work is complete and valid.
          sources: [https://www.postgresql.org/docs/current/tutorial-transactions.html]
  - id: os-systems
    citadel_id: os_concurrency
    title: How the OS shares time, memory and resources
    summary: Move from a single running process to scheduling, virtual memory and safe waiting.
    position: 2
    cue_card:
      elevator_pitch: The OS schedules runnable work, gives processes virtual address spaces, and coordinates access to resources; concurrency bugs arise when shared state or waiting rules are wrong.
      pillars:
        - A scheduler chooses runnable work; a blocked task is waiting rather than using a CPU.
        - Virtual addresses are translated to physical memory and pages can be absent.
        - A deadlock is a cycle of workers waiting for resources held by one another.
      tradeoffs:
        - Frequent switching improves responsiveness but consumes time saving and restoring state.
        - More isolation and coordination improve safety but cost memory or waiting time.
      candidate_trap: Concurrency means work overlaps in time; parallelism means work executes simultaneously. Neither requires the other in every situation.
    lessons:
      - id: os-scheduling
        title: How can one CPU run many apps?
        summary: Separate runnable work from waiting work and see why the OS switches tasks.
        position: 1
        prerequisites: [os-process]
        content:
          situation: Music keeps playing while a browser loads a page on a laptop with one busy CPU core.
          explanation: A CPU core executes one instruction stream at a time. The OS scheduler chooses which runnable thread gets a turn. When its turn ends, the OS can save its execution state and resume another thread; this is a context switch. A thread waiting for disk or network I/O is blocked and need not occupy the CPU while waiting. On several cores, some threads can run simultaneously.
          terms:
            - {name: Runnable, meaning: Ready to use a CPU when scheduled.}
            - {name: Blocked, meaning: Waiting for an event such as completed I/O.}
            - {name: Context switch, meaning: Saving one execution context and resuming another.}
          worked_example: A browser requests a file and waits for the network. While it waits, the scheduler runs the music app so playback continues. When data arrives, the browser becomes runnable again.
          second_example_prompt: "A calculator needs a long CPU calculation while you type in an editor. How can one CPU keep the editor responsive?"
          second_example: A calculator doing a long computation stays CPU-bound. Sharing the core with a text editor gives the editor a turn, though frequent switching itself has a cost.
          misconception: A waiting task is not necessarily using CPU time. Concurrency on one core does not mean simultaneous execution.
          checks:
            - prompt: A browser is waiting for a network reply. What can the CPU do meanwhile?
              choices: ["Run another runnable task.", "Turn the browser into a second CPU core.", "Only wait for the browser."]
              answer: 0
              explanation: I/O waiting frees the core to run other ready work.
            - prompt: Two threads take turns on one core. Are they running in parallel?
              choices: ["No, they must be separate processes.", "No, their work is concurrent but not simultaneous.", "Yes, every context switch creates a second core."]
              answer: 1
              explanation: Parallel work executes at the same time; interleaving on one core is concurrency.
          sources: [https://pages.cs.wisc.edu/~remzi/OSTEP/]
      - id: os-virtual-memory
        title: Why does each process see its own memory?
        summary: Learn virtual addresses and pages before page replacement algorithms.
        position: 2
        prerequisites: [os-scheduling]
        content:
          situation: Two copies of a game both use an address called 0x1000, yet changing one game's score does not change the other.
          explanation: A process uses virtual addresses. The OS and hardware translate those addresses through mappings to physical memory. Each process can have different mappings, so the same virtual address need not refer to the same physical bytes. Memory is managed in pages. If a needed page is absent, a page fault lets the OS resolve it or reject an invalid access. A valid page fault can still be slow when data must be fetched from storage.
          terms:
            - {name: Virtual address, meaning: An address used by a process before translation.}
            - {name: Page, meaning: A fixed-size unit used in virtual-memory mappings.}
            - {name: Page fault, meaning: A trap when a referenced virtual page is not currently mapped for the attempted access.}
          worked_example: Game A and game B both use virtual address 0x1000, but their mappings point to different physical pages. Their scores stay separate unless they intentionally share memory.
          second_example_prompt: "A photo editor touches image data that is not in physical memory yet. What must happen before it can continue?"
          second_example: A photo editor touches a large image page that is not resident. The OS may load the needed data before the editor can continue, making that access slower than a normal memory read.
          misconception: A page fault does not always mean a program bug. Some faults are resolved as part of normal memory management.
          checks:
            - prompt: Why can two processes use the same virtual address safely?
              choices: ["The CPU ignores both addresses.", "The address is always a disk location.", "Their mappings can point to different physical memory."]
              answer: 2
              explanation: Address translation and separate mappings give processes isolated views.
            - prompt: An app accesses a valid page that is not resident. What may happen?
              choices: ["The OS resolves a page fault and the app continues.", "A mutex automatically loads the page.", "The app must always be deleted."]
              answer: 0
              explanation: A valid missing page can be brought into memory or mapped by the OS.
          sources: [https://pages.cs.wisc.edu/~remzi/OSTEP/]
      - id: os-deadlock
        title: How can two workers wait forever?
        summary: Build from lock ownership to a circular wait and ways to break it.
        position: 3
        prerequisites: [os-mutex, os-scheduling]
        content:
          situation: One worker holds the printer lock and waits for the scanner; another holds the scanner lock and waits for the printer.
          explanation: A lock has an owner. A worker that requests an unavailable lock waits until its owner releases it. Here each worker holds one resource while waiting for the other, forming a cycle. Neither can make progress, so they are deadlocked. Acquiring locks in the same global order can prevent this particular cycle. Timeouts or detection and recovery are other strategies, with different costs.
          terms:
            - {name: Lock ownership, meaning: The worker currently permitted to use a protected resource.}
            - {name: Wait-for cycle, meaning: A chain of workers waiting that returns to its starting worker.}
            - {name: Deadlock, meaning: Workers cannot progress because each waits for resources held in the cycle.}
          worked_example: A holds printer then requests scanner. B holds scanner then requests printer. Draw A → B → A. If both acquire printer before scanner, this two-lock cycle cannot form.
          second_example_prompt: "Two transfers each need to lock two accounts. How can a consistent lock order prevent them waiting forever?"
          second_example: Two bank transfers lock account rows in opposite order. Sorting account IDs and always locking the smaller ID first prevents this specific ordering cycle.
          misconception: A slow task or a single worker waiting for a lock is not necessarily deadlocked. Look for a cycle that cannot resolve without intervention.
          checks:
            - prompt: A holds lock X and waits for Y; B holds Y and waits for X. What is the key problem?
              choices: ["A page fault.", "Two CPUs executing simultaneously.", "A circular wait with neither worker able to release its held lock."]
              answer: 2
              explanation: The ownership and waiting edges form a cycle.
            - prompt: What simple rule can prevent this two-lock ordering deadlock?
              choices: ["Make both locks permanent.", "Both workers acquire X before Y.", "Let each worker choose a random order."]
              answer: 1
              explanation: A consistent global order removes the opposing acquisition order.
          sources: [https://pages.cs.wisc.edu/~remzi/OSTEP/]
  - id: db-queries-and-storage
    citadel_id: sql_dbms
    title: Ask useful questions, then make them efficient
    summary: Learn filtering and indexes before studying physical pages or query plans.
    position: 2
    cue_card:
      elevator_pitch: SQL describes the rows you want; the database chooses a plan to find them. An index can speed a selective lookup but costs storage and writes.
      pillars:
        - SELECT chooses columns; WHERE filters rows using a condition.
        - A relational result can contain several rows; ordering is not guaranteed without ORDER BY.
        - An index is an auxiliary search structure, not the table itself.
      tradeoffs:
        - Indexes speed some reads but use space and must be updated on writes.
      candidate_trap: Do not claim an index always wins. Inspect the actual query plan and data distribution.
    lessons:
      - id: db-query
        title: How do we ask a table a question?
        summary: Use SELECT, WHERE and ORDER BY to reason about a result.
        position: 1
        prerequisites: [db-table]
        content:
          situation: A school wants the names of students in year 1, sorted alphabetically.
          explanation: A SQL SELECT specifies columns to return from a table. WHERE keeps rows satisfying a condition. ORDER BY requests a result order; without it, the database does not promise row order. Think about the expected result on a tiny table before optimizing it.
          terms:
            - {name: SELECT, meaning: The columns or expressions to return.}
            - {name: WHERE, meaning: A condition used to filter rows.}
            - {name: ORDER BY, meaning: A requested order for result rows.}
          worked_example: For students (7, Asha, 1) and (8, Bilal, 2), SELECT name FROM students WHERE year = 1 returns Asha. Add ORDER BY name to specify alphabetical order when several rows match.
          second_example_prompt: "A shop filters products cheaper than 500. Does selecting only the name also sort the results?"
          second_example: A shop can ask for product names WHERE price < 500, then ORDER BY price to show the cheapest first. Selecting only name does not make the rows sorted by name.
          misconception: The order in which rows happen to be stored or returned today is not a guaranteed SQL result order.
          checks:
            - prompt: Which clause keeps only year-1 students?
              choices: ["SELECT year", "ORDER BY year", "WHERE year = 1"]
              answer: 2
              explanation: WHERE filters the rows before they appear in the result.
            - prompt: How do you guarantee an alphabetical result?
              choices: ["Rely on insertion order.", "Add ORDER BY name.", "Add a primary key only."]
              answer: 1
              explanation: An explicit ORDER BY defines the output order.
          sources: [https://www.postgresql.org/docs/current/tutorial-sql.html]
      - id: db-index
        title: Why use an index?
        summary: Compare a table scan with a selective lookup before choosing an index.
        position: 2
        prerequisites: [db-query, db-key]
        content:
          situation: A library has a million books. A visitor searches for one ISBN instead of reading every shelf label.
          explanation: An index stores searchable keys with a way to find the matching table rows. A B-tree index can support equality and ordered range searches on its leading key columns. A table scan may still be better when a query needs most rows or the table is small. Every extra index uses space and must be maintained as rows change. Check the plan and measured workload rather than assuming every query needs an index.
          terms:
            - {name: Table scan, meaning: Reading table rows to test a query condition.}
            - {name: Index, meaning: An auxiliary structure that helps find rows by key.}
            - {name: Selectivity, meaning: How narrowly a condition limits matching rows.}
          worked_example: An ISBN equality lookup returns one book among a million. An index on ISBN may avoid checking every book row. If a query returns almost every row, a scan can be cheaper.
          second_example_prompt: "A food app often finds recent orders for one customer. What might an index help, and what does it cost on writes?"
          second_example: A food app finds recent orders for one customer. An index beginning with customer_id may help, but adding indexes to every column makes each order insert more expensive.
          misconception: A primary key is a logical uniqueness rule; an index is a physical access structure. Many databases implement a primary key with an index, but the concepts differ.
          checks:
            - prompt: Which query is a strong index candidate on a large books table?
              choices: ["Count all rows after every write.", "Read every book row.", "Find one known ISBN."]
              answer: 2
              explanation: A selective lookup can benefit from a suitable index.
            - prompt: Why not add an index to every column?
              choices: ["Indexes consume space and add work to writes.", "Indexes disable SELECT.", "Indexes remove all table rows."]
              answer: 0
              explanation: Index maintenance is part of the write path.
          sources: [https://www.postgresql.org/docs/current/indexes-intro.html]
  - id: network-foundations
    citadel_id: computer_networking
    title: From a web address to a response
    summary: Follow a request from client to server through addresses, DNS and TCP before diagnosing failures.
    position: 1
    cue_card:
      elevator_pitch: A browser resolves a name, connects to a server using a transport, sends an application request and interprets the response.
      pillars:
        - IP addresses help route packets toward a host; transport ports select a listening service or connection endpoint.
        - DNS maps a name to address records; it does not fetch the page.
        - TCP provides an ordered byte stream; applications define message boundaries.
        - A TCP connection begins with SYN, SYN-ACK and ACK; HTTP defines request and response meaning above the transport.
      tradeoffs:
        - Caches reduce lookup latency but changes may take time to propagate.
        - Reliable delivery and security need protocols and state beyond a raw packet.
      candidate_trap: HTTP/3 uses QUIC over UDP; HTTP is not universally tied to TCP.
    lessons:
      - id: net-client-server
        title: What happens when you open a website?
        summary: Meet the client, server, address and request before protocol details.
        position: 1
        content:
          situation: You type a school's website address into a browser and a timetable appears.
          explanation: The browser is a client asking a server for a resource. A URL identifies where and what to request. The browser needs a reachable server address, then sends a request and receives a response. DNS, transport and HTTP solve different parts of this journey. A response may contain HTML, data or an error rather than the page you expected.
          terms:
            - {name: Client, meaning: Software that initiates a request.}
            - {name: Server, meaning: Software that listens and responds to requests.}
            - {name: URL, meaning: An address identifying a resource and how to access it.}
          worked_example: The browser requests /timetable from the school's server. The server replies with page data that the browser renders.
          second_example_prompt: "A weather app asks an API for a forecast. Which side requests data, and which side responds?"
          second_example: A weather app sends a request to an API server and renders the returned forecast. It is still a client-server exchange although no traditional web page appears.
          misconception: A server is a role played by software, not necessarily a special kind of physical machine. One machine can run several servers.
          checks:
            - prompt: Who initiates a timetable request when you open a page?
              choices: ["The database table.", "The browser client.", "The monitor."]
              answer: 1
              explanation: The client starts the exchange by requesting a resource.
            - prompt: Can a server return something other than an HTML page?
              choices: ["Yes, it may return data or an error.", "No, all responses are HTML.", "Only if DNS is disabled."]
              answer: 0
              explanation: A server response depends on the request and application.
          sources: [https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Web_standards/How_the_web_works]
      - id: net-address-port
        title: What are an IP address and a port?
        summary: Separate finding a host from finding the service listening on it.
        position: 2
        prerequisites: [net-client-server]
        content:
          situation: A server runs a website and an API. Both are reachable through the same machine, so how does a request reach the right service?
          explanation: An IP address helps the network route packets toward a destination interface. A transport port helps the receiving computer direct traffic to a listening service or connection endpoint. A URL can include a port; a scheme such as HTTPS usually supplies a default port when none is written. The pair matters because one host can run several services. A port number alone is not a global address, and DNS answers normally identify addresses rather than opening the service for you.
          terms:
            - {name: IP address, meaning: A network-layer address used to route packets toward an interface.}
            - {name: Port, meaning: A transport-layer number used to distinguish services and connection endpoints.}
            - {name: Listening service, meaning: A program waiting for traffic on an address and port.}
          worked_example: A browser finds an address for school.example and connects to the site's HTTPS service, usually on port 443. The address helps reach the host; the port helps reach the intended service.
          second_example_prompt: "Your computer runs two local apps at 127.0.0.1:5174 and 127.0.0.1:8010. Why do the URLs show different apps?"
          second_example: Both URLs use the loopback address for your own computer. The different ports lead to different listening services. Changing only the port can change which local app answers.
          misconception: An IP address does not uniquely identify one website or application. The host may serve many services, and proxies or network address translation can add further routing steps.
          checks:
            - prompt: Two local services use the same IP address. What helps the computer send a connection to the intended service?
              choices: ["The page title.", "The transport port.", "The DNS cache alone."]
              answer: 1
              explanation: The destination port distinguishes listening services using the same destination address and transport protocol.
            - prompt: Does knowing a server's IP address alone prove that its website is listening and healthy?
              choices: ["Yes, the address contains the page content.", "Yes, DNS guarantees that every service is running.", "No, the service and its port may still be unavailable."]
              answer: 2
              explanation: Addressing tells the client where to try; it does not guarantee a response from the intended service.
          sources: [https://www.rfc-editor.org/rfc/rfc8200, https://www.rfc-editor.org/rfc/rfc6335]
      - id: net-dns
        title: How does a name lead to a server address?
        summary: Learn DNS resolution and caching before tracing a recursive lookup.
        position: 3
        prerequisites: [net-address-port]
        content:
          situation: You know the name school.example, but your browser needs a network address to reach it.
          explanation: DNS resolves a domain name to records such as an IP address. A resolver may answer from a cache or ask other DNS servers. A cached record can remain until its time-to-live expires. DNS supplies addressing information; it does not itself open the web page or guarantee that the application server is healthy.
          terms:
            - {name: Domain name, meaning: A human-readable name used to identify a network service.}
            - {name: DNS resolver, meaning: A service that looks up DNS records for a client.}
            - {name: TTL, meaning: The lifetime a DNS answer may be cached.}
          worked_example: The resolver returns an address for school.example. The browser uses that address to reach the server, then requests /timetable separately.
          second_example_prompt: "A shop changes its server address. Why might some visitors still reach the old address for a while?"
          second_example: A shop moves its service to a new address. Some clients may briefly use a cached old answer until the TTL allows a fresh lookup.
          misconception: DNS is an address lookup, not the request for the web page. A successful lookup does not prove the server will answer.
          checks:
            - prompt: What does DNS usually give the browser?
              choices: ["The complete rendered page.", "A database transaction.", "Address records for a name."]
              answer: 2
              explanation: DNS resolves names; other protocols handle the application exchange.
            - prompt: Why might a client still use an old address after a DNS change?
              choices: ["A prior answer is cached within its TTL.", "HTTP forbids address changes.", "TCP changes the domain name."]
              answer: 0
              explanation: DNS caches can retain an answer for its allowed lifetime.
          sources: [https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Web_standards/How_the_web_works]
      - id: net-transport
        title: How does information cross the network?
        summary: Compare packets and TCP's ordered byte stream before the handshake exercise.
        position: 4
        prerequisites: [net-dns]
        content:
          situation: A large photo cannot fit in one network packet, but it arrives intact in your browser.
          explanation: Networks carry data in packets. TCP establishes a connection and presents an ordered, reliable byte stream to the application, retransmitting lost data when possible. It does not know where one JSON message ends and another begins; the application protocol needs framing. UDP offers datagrams with different guarantees. Modern HTTP/3 runs over QUIC, which uses UDP and provides its own reliable streams.
          terms:
            - {name: Packet, meaning: A bounded unit of data sent through a network.}
            - {name: TCP, meaning: A transport protocol that provides an ordered byte stream.}
            - {name: Framing, meaning: A rule for finding application message boundaries in a stream.}
          worked_example: A photo is transmitted in pieces. TCP reassembles an ordered byte stream for the receiving application, which then interprets the bytes as the photo response.
          second_example_prompt: "A client sends two JSON documents on one TCP connection. Can the server assume each read returns exactly one document?"
          second_example: Two JSON documents sent on one TCP connection do not automatically arrive as two read calls. A length prefix or delimiter can tell the receiver where each document ends.
          misconception: TCP preserves byte order but does not preserve application write boundaries. One send is not guaranteed to equal one receive.
          checks:
            - prompt: Two JSON messages are sent on one TCP connection. How does the receiver know their boundaries?
              choices: ["Use an application framing rule.", "Assume each read returns one message.", "Ask DNS to split them."]
              answer: 0
              explanation: TCP is a byte stream; applications define message boundaries.
            - prompt: Does HTTP/3 always use a TCP connection?
              choices: ["Yes, all HTTP versions require TCP.", "No, HTTP/3 uses QUIC over UDP.", "No, it uses DNS as transport."]
              answer: 1
              explanation: HTTP/3 uses QUIC, which runs over UDP.
          sources: [https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview, https://www.rfc-editor.org/rfc/rfc9114]
      - id: net-handshake
        title: How does a TCP connection begin?
        summary: Walk through SYN, SYN-ACK and ACK before simulating a lost message.
        position: 5
        prerequisites: [net-transport]
        content:
          situation: Your browser knows the server's address and port. Before sending an HTTP request over TCP, how do both sides agree to start a connection?
          explanation: In the usual TCP opening, the client sends a SYN with its initial sequence number. The server replies with SYN-ACK, acknowledging the client's SYN and introducing its own sequence number. The client acknowledges the server's SYN with a final ACK. Each SYN consumes one sequence number, so acknowledging a SYN at 100 means expecting 101 next. If a message is lost, one or both sides may remain in a waiting state and retry; a sent message is not proof that the other side received it. The handshake establishes TCP state, not the identity or trustworthiness of the server; TLS is a separate step for HTTPS.
          terms:
            - {name: SYN, meaning: A TCP control flag used to start synchronizing a connection and its sequence numbers.}
            - {name: ACK, meaning: A TCP acknowledgment of what has been received and what sequence number is expected next.}
            - {name: ESTABLISHED, meaning: The TCP state in which a connection can carry application data.}
          worked_example: The client sends SYN seq 100. The server sends SYN-ACK seq 500, ack 101. The client replies ACK seq 101, ack 501. After receiving that last ACK, the server has confirmation of the exchange.
          second_example_prompt: "The server sends SYN-ACK, but that reply is lost before the client sees it. Has the three-message exchange finished at both ends?"
          second_example: The client still waits for a reply to its SYN, while the server has sent SYN-ACK and awaits the final ACK. TCP may retransmit and eventually complete or time out; the exchange has not completed at both ends yet.
          misconception: SYN-ACK is not the final message. It acknowledges the client's SYN while starting the server's side; the client must still acknowledge the server's SYN. TCP's handshake also does not encrypt the later data.
          visual:
            kind: model
            title: Trace the three messages before any HTTP request
            tracks:
              - id: success
                title: All three messages arrive
                steps:
                  - {label: Client sends SYN, explanation: 'The client proposes sequence number 100 and waits for a reply.', state: {Client: SYN-SENT, Server: LISTEN, Message: 'SYN seq 100'}}
                  - {label: Server sends SYN-ACK, explanation: 'The server acknowledges 100 by expecting 101 and proposes its own sequence number 500.', state: {Client: SYN-SENT, Server: SYN-RECEIVED, Message: 'SYN-ACK seq 500, ack 101'}}
                  - {label: Client sends final ACK, explanation: 'The client acknowledges the server''s SYN by expecting 501.', state: {Client: ESTABLISHED, Server: SYN-RECEIVED, Message: 'ACK seq 101, ack 501'}}
                  - {label: Server receives ACK, explanation: 'Both sides have completed the exchange and application data can flow.', state: {Client: ESTABLISHED, Server: ESTABLISHED, Next: HTTP request}}
              - id: lost-reply
                title: The server's reply is lost
                steps:
                  - {label: Client sends SYN, explanation: 'The client asks to start a connection and waits.', state: {Client: SYN-SENT, Server: LISTEN, Message: 'SYN seq 100'}}
                  - {label: Server sends SYN-ACK, explanation: 'The server sends a reply, but the network does not deliver it to the client.', state: {Client: SYN-SENT, Server: SYN-RECEIVED, Message: 'SYN-ACK lost'}}
                  - {label: No final ACK yet, explanation: 'The client cannot acknowledge a SYN it never received. A retry may follow; neither side has a confirmed completed exchange.', state: {Client: SYN-SENT, Server: SYN-RECEIVED, Next: Retry or timeout}}
          checks:
            - prompt: A client sends SYN with sequence number 100. What acknowledgment number should the server include in SYN-ACK?
              choices: ["101, because the SYN consumes one sequence number.", "100, because SYN is invisible to sequence numbers.", "500, regardless of the client's sequence number."]
              answer: 0
              explanation: TCP acknowledges the client's SYN by saying it expects sequence number 101 next.
            - prompt: A client never receives the server's SYN-ACK. What is the best description of the connection?
              choices: ["The final ACK has already reached the server.", "The handshake is not complete at both ends; a retry or timeout may follow.", "The HTTP request is automatically encrypted."]
              answer: 1
              explanation: The client remains waiting for SYN-ACK and cannot send the normal final ACK for a message it did not receive.
          sources: [https://www.rfc-editor.org/rfc/rfc9293]
  - id: backend-web-basics
    citadel_id: backend_apis
    title: From a web request to a reliable API
    summary: Understand HTTP messages and errors before framework or security exercises.
    position: 1
    cue_card:
      elevator_pitch: An API receives a request, validates it, performs work and sends a response with an appropriate status and body.
      pillars:
        - An HTTP request has a method, target, headers and sometimes a body.
        - A response has a status, headers and possibly a body.
        - The server validates input and reports failures at the right boundary.
      tradeoffs:
        - Rich error responses help clients but must avoid exposing secrets.
      candidate_trap: A 4xx means the request cannot be fulfilled as sent; a 5xx indicates a server-side failure. Do not use 500 for every error.
    lessons:
      - id: backend-http
        title: What is an HTTP request?
        summary: Learn method, path, headers, body and response before status-code diagnosis.
        position: 1
        prerequisites: [net-client-server]
        content:
          situation: A food app asks its backend for the menu, then sends a new order.
          explanation: HTTP is an application protocol for requests and responses. A request has a method such as GET or POST, a target path, headers that carry metadata and sometimes a body. A response includes a status, headers and optionally a body. GET is used to retrieve a resource; POST often asks the server to process submitted data. The network transport carries the bytes but HTTP gives the message its meaning.
          terms:
            - {name: Method, meaning: 'The requested action, such as GET or POST.'}
            - {name: Header, meaning: Metadata about the request or response.}
            - {name: Body, meaning: Optional message content such as an order payload.}
          worked_example: GET /menu asks for a menu. The server returns status 200 and JSON describing dishes. A later POST /orders can include JSON describing a chosen dish.
          second_example_prompt: "A calendar app lists meetings and creates a new one. Which HTTP methods would fit those actions?"
          second_example: A calendar app GETs /events to list meetings and POSTs /events with a new meeting. The same protocol works even though the data is not a web page.
          misconception: HTTP does not mean HTML only. APIs commonly exchange JSON over HTTP.
          checks:
            - prompt: Where should an order's submitted JSON normally go?
              choices: ["In a DNS record.", "In the request body.", "In the status code."]
              answer: 1
              explanation: The body carries submitted application data.
            - prompt: What does GET /menu usually express?
              choices: ["A request to retrieve the menu resource.", "A promise to create a new order.", "A command to resolve DNS."]
              answer: 0
              explanation: GET requests a representation of the targeted resource.
          sources: [https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview]
      - id: backend-status
        title: What does a response status tell the client?
        summary: Distinguish success, invalid requests and server failures.
        position: 2
        prerequisites: [backend-http]
        content:
          situation: A customer submits an order with a missing item ID. The app needs to say what went wrong.
          explanation: HTTP status codes summarize the outcome. A 2xx status indicates success; 4xx indicates a problem with the request as sent; 5xx indicates the server could not fulfill an otherwise valid request. The response body can explain the specific issue. Use a status that reflects the actual boundary failure, then provide a safe and actionable explanation.
          terms:
            - {name: 2xx, meaning: A successful outcome.}
            - {name: 4xx, meaning: A client request that cannot be fulfilled as sent.}
            - {name: 5xx, meaning: A server-side failure to fulfill the request.}
          worked_example: POST /orders with an unknown item ID can receive 400 or 422 depending on the API contract, with a body naming the invalid field. A database outage during a valid order can produce 503.
          second_example_prompt: "A product ID is missing, then a valid request crashes the server. Which response classes fit these different failures?"
          second_example: GET /products/999 can return 404 if that product does not exist. A server bug that crashes while processing a valid request is a 500-class failure.
          misconception: 500 is not a generic 'anything went wrong' response. A malformed or unauthorized request should not be presented as a server crash.
          checks:
            - prompt: A valid request fails because the database is unavailable. Which class fits?
              choices: ["2xx success.", "4xx invalid client request.", "5xx server failure."]
              answer: 2
              explanation: The server failed to fulfill a valid request.
            - prompt: A client asks for a resource that does not exist. Which status is commonly appropriate?
              choices: ["500 Internal Server Error.", "200 OK with invented data.", "404 Not Found."]
              answer: 2
              explanation: A missing targeted resource is commonly represented by 404.
          sources: [https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status]
  - id: python-foundations
    citadel_id: python_data
    title: Python values and functions before internals
    summary: Build a reliable mental model of names and values before memory puzzles.
    position: 1
    cue_card:
      elevator_pitch: Python names refer to objects; functions bind parameters to passed objects and can return new objects or mutate shared ones.
      pillars:
        - Assignment binds a name to an object.
        - Mutable objects can change in place; immutable objects cannot.
        - A function call creates local parameter bindings.
      tradeoffs:
        - Mutation can avoid copies but makes shared state harder to reason about.
      candidate_trap: Python does not pass a variable box by reference. It passes object references by assignment to local names.
    lessons:
      - id: py-names
        title: What does a Python variable hold?
        summary: Names refer to objects; assignment can make two names refer to the same object.
        position: 1
        content:
          situation: You set a = [1, 2], then b = a. Changing b seems to change a as well.
          explanation: In Python, assignment binds a name to an object. After b = a, both names refer to the same list object. A list is mutable, so b.append(3) changes the shared object that a also sees. Rebinding b to a different object does not change what a refers to. This model helps explain later function calls, closures and thread sharing.
          terms:
            - {name: Name, meaning: An identifier bound to an object.}
            - {name: Object, meaning: A value with a type and identity.}
            - {name: Mutable, meaning: Able to change its contents after creation.}
          worked_example: a = [1, 2]; b = a; b.append(3). Both names now show [1, 2, 3] because the one list changed.
          second_example_prompt: "Two parts of an app refer to the same shopping cart object. What happens if one part mutates it?"
          second_example: A shopping cart object is shared between a page component and a checkout helper. If the helper mutates that cart, the page can observe the updated items.
          misconception: Assignment does not always copy an object. Whether a later change is visible depends on rebinding versus mutation.
          checks:
            - prompt: After b = a for a list, what does b.append(3) do?
              choices: ["Copies a before changing b.", "Mutates the list both names refer to.", "Rebinds a to a new integer."]
              answer: 1
              explanation: Both names refer to one mutable list.
            - prompt: If b is rebound to a new list, what happens to a?
              choices: ["It automatically follows b.", "It becomes a function.", "It keeps referring to the original list."]
              answer: 2
              explanation: Rebinding b changes that name's binding, not a's.
          sources: [https://docs.python.org/3/tutorial/classes.html]
      - id: py-functions
        title: What happens when a function receives a value?
        summary: Follow local parameter names and distinguish mutation from rebinding.
        position: 2
        prerequisites: [py-names]
        content:
          situation: A helper receives your list and appends an item. Why did your original list change?
          explanation: A function call binds each parameter name to an argument object. If the function mutates a shared mutable object, the caller can observe the change. If the function only rebinds the local parameter to a new object, the caller's name still refers to its original object. Returning a result makes data flow explicit.
          terms:
            - {name: Parameter, meaning: A local name bound when the function is called.}
            - {name: Argument, meaning: The object supplied for a parameter at a call.}
            - {name: Rebinding, meaning: Making a name refer to a different object.}
          worked_example: def add(xs) calls xs.append(3). Calling add(a) mutates a's list. In contrast, def replace(xs) with xs = [3] only rebinds its local xs.
          second_example_prompt: "A photo filter should preserve the original image. Should it mutate that image or return a new one?"
          second_example: A photo filter can return a new image instead of changing the original. This is useful when the caller should keep the unedited image.
          misconception: Calling a function does not automatically copy every object, and rebinding a parameter does not rebind the caller's name.
          checks:
            - prompt: A function appends to a list supplied by the caller. What may the caller observe?
              choices: ["The function has created a new process.", "The same list has a new element.", "Its local variable name is deleted."]
              answer: 1
              explanation: Mutation changes the shared object.
            - prompt: A function assigns its parameter to a brand-new list. What happens to the caller's name?
              choices: ["It always points to the new list.", "It becomes an HTTP header.", "It still refers to the original list."]
              answer: 2
              explanation: A local parameter rebinding does not change the caller's binding.
          sources: [https://docs.python.org/3/tutorial/controlflow.html#defining-functions]
  - id: ai-foundations
    citadel_id: ai_resume
    title: From examples to useful AI outputs
    summary: Learn what a model learns and what an embedding represents before RAG workflows.
    position: 1
    cue_card:
      elevator_pitch: Machine learning fits patterns from examples; an embedding maps an item to numbers for comparison, and a language model predicts text using learned statistical structure.
      pillars:
        - Training data and evaluation data serve different purposes.
        - An embedding is a representation, not a factual answer.
        - Model output needs validation against the task and source evidence.
      tradeoffs:
        - More context can help, but irrelevant context increases cost and can confuse the answer.
      candidate_trap: A high similarity score does not prove that retrieved text is true or that it answers the question.
    lessons:
      - id: ai-model
        title: What does a model learn from examples?
        summary: Separate training, prediction and evaluation before using AI tools.
        position: 1
        content:
          situation: A mail app learns to flag spam from many examples of spam and ordinary mail.
          explanation: A machine-learning model is a program whose behavior is shaped by training data. During training, its parameters are adjusted to reduce an error measure on examples. After training, it makes predictions on new inputs. Evaluation on held-out examples checks whether patterns generalize instead of merely matching the training set. A model can still be wrong, biased or outdated.
          terms:
            - {name: Training, meaning: Adjusting model parameters using examples.}
            - {name: Prediction, meaning: An output produced for a new input.}
            - {name: Evaluation, meaning: Measuring how well outputs meet a task goal.}
          worked_example: A spam model trains on labeled mail and predicts whether a new message is spam. Testing on messages it never trained on gives a more meaningful quality estimate.
          second_example_prompt: "A model labels a photo from a breed it has rarely seen. Why might its prediction be wrong?"
          second_example: A photo app learns examples of cats and dogs, then labels a new photo. Poor lighting or an unfamiliar breed can still cause an error.
          misconception: Training on examples does not make a model a database of verified facts or guarantee correct predictions.
          checks:
            - prompt: Why test on examples the model did not train on?
              choices: ["To measure generalization to new inputs.", "To replace all training data.", "To force every prediction to be correct."]
              answer: 0
              explanation: Held-out evaluation reveals whether learned patterns transfer beyond training examples.
            - prompt: Can a well-trained model still make a wrong prediction?
              choices: ["Only when DNS fails.", "Yes, because new inputs and data limitations can expose errors.", "No, training guarantees correctness."]
              answer: 1
              explanation: Learned patterns are estimates, not guarantees.
          sources: [https://developers.google.com/machine-learning/crash-course]
      - id: ai-embedding
        title: What is an embedding used for?
        summary: Represent items as vectors and compare similarity without mistaking it for truth.
        position: 2
        prerequisites: [ai-model]
        content:
          situation: A student asks for notes about protecting a shared counter, but the notes use the words mutual exclusion.
          explanation: An embedding model maps text or other inputs to numeric vectors. Similar items can be near one another in that vector space, so a search system can retrieve related notes even when words differ. Similarity is a retrieval signal, not proof that the result is correct or sufficient. Retrieval-augmented generation later combines retrieval with a model that drafts an answer from selected context.
          terms:
            - {name: Vector, meaning: An ordered list of numbers.}
            - {name: Embedding, meaning: A learned numeric representation of an item.}
            - {name: Similarity, meaning: A measure of closeness between representations.}
          worked_example: The question shared counter may retrieve a note titled mutex and mutual exclusion because their meanings are related in the model's representation.
          second_example_prompt: "An image search finds a visually similar product. Can similarity alone prove its price or quality?"
          second_example: A shopping site can retrieve visually similar products from image embeddings. Similar appearance does not mean two products have the same price or quality.
          misconception: A close vector match is not a citation or a truth check. Inspect the retrieved source before using it to answer.
          checks:
            - prompt: What does an embedding give a search system?
              choices: ["A guaranteed factual answer.", "A numeric representation for comparing items.", "A database transaction."]
              answer: 1
              explanation: Embeddings support similarity comparisons.
            - prompt: A note has high similarity to a question. Is it automatically correct evidence?
              choices: ["No, similarity alone does not establish truth or relevance to the exact claim.", "Yes, every close vector is verified.", "Yes, if the numbers are large."]
              answer: 0
              explanation: Retrieval candidates still need source and claim checks.
          sources: [https://developers.google.com/machine-learning/crash-course/embeddings]
  - id: os-coordination-and-io
    citadel_id: os_concurrency
    title: Coordinate work and understand waiting
    summary: Learn counting permits, persistent files and async waiting after the process and thread basics.
    position: 3
    cue_card:
      elevator_pitch: A mutex protects one critical section, a semaphore limits simultaneous entrants, a file persists data, and an async task yields during supported waits.
      pillars:
        - Synchronization primitives solve different ownership and capacity problems.
        - Files give processes a named interface to persistent bytes.
        - An event loop can make progress on other tasks when one task awaits non-blocking I/O.
      tradeoffs:
        - More concurrency can improve throughput for waiting work but may add coordination and failure complexity.
      candidate_trap: Async does not make CPU-heavy Python code fast on one event-loop thread; blocking the loop delays other tasks.
    lessons:
      - id: os-semaphore
        title: What if several workers may enter, but not everyone?
        summary: A semaphore counts available permits; compare it with a one-owner mutex.
        position: 1
        prerequisites: [os-mutex]
        content:
          situation: A small study room has three seats and ten students arrive. How can the room avoid admitting a fourth student?
          explanation: A counting semaphore begins with a number of permits. A worker acquires a permit before entering and releases it when leaving. If no permit is available, a worker waits. This limits how many workers are inside at once. A mutex instead expresses exclusive ownership of one critical section. A semaphore does not automatically protect every shared value used by its workers; the rule must match the resource being guarded.
          terms:
            - {name: Permit, meaning: One unit of capacity that a worker may acquire.}
            - {name: Semaphore, meaning: A synchronization primitive that tracks available permits.}
            - {name: Mutex, meaning: A lock for exclusive ownership of a critical section.}
          worked_example: A pool has three database connections. The first three requests acquire one permit each. The fourth waits until a request releases its connection and permit.
          second_example_prompt: "Only two big media conversions can run at once. What limits capacity, and what protects a separate shared counter?"
          second_example: A media converter limits active large jobs to two to avoid exhausting memory. This is a capacity limit; a separate mutex may still be needed for a shared job counter.
          misconception: A semaphore with three permits does not make updates to one shared counter atomic. Capacity control and exclusive state protection are different jobs.
          visual:
            kind: model
            title: Follow two permits through three arrivals
            tracks:
              - id: acquire-release
                title: Workers acquire and release
                steps:
                  - {label: Start with two free permits, explanation: A and B may each acquire one permit., state: {Free permits: '2', Inside: 'Nobody', Waiting: 'Nobody'}}
                  - {label: A enters, explanation: A acquires one permit and starts work., state: {Free permits: '1', Inside: 'A', Waiting: 'Nobody'}}
                  - {label: B enters, explanation: B acquires the final permit., state: {Free permits: '0', Inside: 'A, B', Waiting: 'Nobody'}}
                  - {label: C arrives, explanation: 'No permit is free, so C waits rather than entering.', state: {Free permits: '0', Inside: 'A, B', Waiting: 'C'}}
                  - {label: A leaves, explanation: A releases a permit; C may acquire it and begin., state: {Free permits: '0', Inside: 'B, C', Waiting: 'Nobody'}}
              - id: unsafe-counter
                title: Capacity is not counter safety
                steps:
                  - {label: Two workers hold permits, explanation: Both may be inside at once because capacity is two., state: {Free permits: '0', Inside: 'A, B', Shared count: '0'}}
                  - {label: Both read the old count, explanation: A and B each read zero before either writes., state: {Free permits: '0', Inside: 'A, B', Shared count: '0'}}
                  - {label: Both write one, explanation: Capacity control did not make their counter update atomic., state: {Free permits: '0', Inside: 'A, B', Shared count: '1, not 2'}}
          checks:
            - prompt: A pool allows three active workers. What should the fourth worker do when all permits are held?
              choices: ["Enter anyway because semaphores are only labels.", "Delete another worker's data.", "Wait until a permit is released."]
              answer: 2
              explanation: With no permit available, the fourth worker waits for one to be released.
            - prompt: Does a three-permit semaphore by itself make a shared counter update atomic?
              choices: ["No, several permit holders can still modify the counter together.", "Only if the counter is on disk.", "Yes, any semaphore protects every variable."]
              answer: 0
              explanation: Protect the counter's read-change-write sequence with an appropriate exclusive rule.
          sources: [https://pages.cs.wisc.edu/~remzi/OSTEP/threads-sema.pdf]
      - id: os-files
        title: What does saving a file actually involve?
        summary: Connect path, file handle, buffering and durable storage.
        position: 2
        prerequisites: [os-process]
        content:
          situation: You save a document, close the app, then open it tomorrow. Where did the words go?
          explanation: A file is a named interface to persistent data; a directory helps organize names and paths. An app asks the OS to open a path and receives a handle or file descriptor for later reads and writes. Writes may first sit in memory buffers, so a successful write call does not always mean bytes are already durable after power loss. Closing, flushing and synchronization have different guarantees that depend on the OS and storage system.
          terms:
            - {name: Path, meaning: A name that locates a file through directories.}
            - {name: File descriptor, meaning: A process-local handle for an opened file or I/O resource.}
            - {name: Buffer, meaning: Temporary memory holding data before later processing or storage.}
          worked_example: A notes app opens notes.txt, writes new text through a file descriptor, and closes it. The file remains after the process exits, unlike an unsaved string in the app's memory.
          second_example_prompt: "A payment log exists only in memory when the process exits. Is the payment record durable?"
          second_example: A payment log may require an explicit durability step before telling the user it is safely recorded. Merely changing an in-memory list would disappear on restart.
          misconception: A successful write is not a universal guarantee that a sudden power loss cannot lose the data. Durability depends on the full storage path.
          checks:
            - prompt: Why can a document remain after its app process exits?
              choices: ["The data was stored through the file system.", "A thread keeps running invisibly.", "The CPU core remembers it forever."]
              answer: 0
              explanation: File-system storage outlives the process's ordinary in-memory state.
            - prompt: What does a file descriptor represent?
              choices: ["A permanent public URL.", "The file's visual icon.", "A process-local handle to an opened I/O resource."]
              answer: 2
              explanation: The process uses the descriptor to refer to its opened resource.
          sources: [https://pages.cs.wisc.edu/~remzi/OSTEP/]
      - id: os-async
        title: When should one task let another run?
        summary: Compare async waiting with threads and CPU-heavy work.
        position: 3
        prerequisites: [os-scheduling, os-thread, os-files]
        content:
          situation: A web service waits for many slow network replies. Should one worker stare at each connection until it answers?
          explanation: An async task can pause at an await point while a supported non-blocking I/O operation is unfinished. An event loop runs another ready task and later resumes the waiting one. This is concurrency, not automatic parallel execution on multiple CPU cores. Threads can also overlap waits but use OS-scheduled execution paths. Processes offer separate address spaces and can run CPU work on different cores. Choose by workload, libraries and isolation needs.
          terms:
            - {name: Async task, meaning: A unit of work that can cooperate with an event loop at await points.}
            - {name: Event loop, meaning: A scheduler that resumes ready async tasks and handles supported events.}
            - {name: Blocking call, meaning: An operation that holds the current execution path until it completes.}
          worked_example: A server starts request A and awaits a database response. The loop serves request B while A waits. When A's result is ready, the loop resumes A.
          second_example_prompt: "A server event loop starts resizing hundreds of large images. Why might other requests stall?"
          second_example: Resizing hundreds of large images is CPU-heavy. Running that computation directly on one event-loop thread can delay every request; a worker process or another suitable execution strategy may be better.
          misconception: Writing async def does not make synchronous disk or CPU work non-blocking. The operation and its library must cooperate with the loop or be offloaded.
          checks:
            - prompt: Request A awaits a supported network operation. What can an event loop do?
              choices: ["Run another ready async task.", "Force the network reply to finish instantly.", "Turn one CPU core into two."]
              answer: 0
              explanation: The loop can use the wait time to advance other ready work.
            - prompt: A CPU-heavy loop runs without yielding on the event-loop thread. What happens?
              choices: ["All other tasks automatically run on new CPU cores.", "DNS turns the work into I/O.", "The loop may delay other tasks until the work yields or finishes."]
              answer: 2
              explanation: CPU work that does not yield blocks progress on that event-loop thread.
          sources: [https://docs.python.org/3/library/asyncio.html, https://docs.python.org/3/library/asyncio-task.html]
  - id: db-data-correctness-and-storage
    citadel_id: sql_dbms
    title: Model facts, coordinate transactions and inspect pages
    summary: Move from logical tables to update anomalies, concurrent transactions and physical storage.
    position: 3
    cue_card:
      elevator_pitch: Good schema design stores each fact in a deliberate place, isolation controls what concurrent transactions observe, and the DBMS stores rows in pages rather than isolated bytes.
      pillars:
        - Separate entities and relationships to avoid repeated facts that can disagree.
        - Atomicity and isolation solve different problems in concurrent transactions.
        - A query plan and storage layout are implementation details below logical SQL.
      tradeoffs:
        - More tables can reduce update anomalies but require joins for some reads.
        - Stronger isolation may need retries or more coordination.
      candidate_trap: PostgreSQL's common 8 KB page and SQLite's default 4 KB page are different; a physical tuple location is not a stable business key.
    lessons:
      - id: db-normalization
        title: Why split repeated facts into related tables?
        summary: Understand update anomalies before formal normal forms.
        position: 1
        prerequisites: [db-key, db-join]
        content:
          situation: Every course enrollment row repeats the student's phone number. One phone change requires updating five rows.
          explanation: If the phone number is a fact about the student, storing it in every enrollment duplicates that fact. A missed update can leave conflicting phone numbers. Put student facts in students and enrollment facts in enrollments, connected by student_id. This is the practical motivation for normalization. Later normal-form rules make such dependencies precise; splitting tables is useful only when the relationships and constraints remain correct.
          terms:
            - {name: Redundancy, meaning: The same logical fact is stored repeatedly.}
            - {name: Update anomaly, meaning: Repeated copies of a fact can disagree after a partial update.}
            - {name: Normalization, meaning: Organizing relations around dependencies to reduce anomalies.}
          worked_example: Before splitting, Asha's phone appears in Math and Physics enrollments. After splitting, students stores one phone for Asha; enrollments stores two rows referring to her ID.
          second_example_prompt: "A shop repeats one supplier address on every product. What happens when that address changes?"
          second_example: A shop stores a supplier address on every product row. Moving the supplier means many edits; a suppliers table can hold the address once and products can refer to it.
          misconception: Normalization does not mean creating the maximum possible number of tables. The decomposition must preserve meaning and be joined correctly when needed.
          checks:
            - prompt: A student's phone appears on each of five enrollment rows. What problem can result?
              choices: ["One missed update leaves contradictory phone numbers.", "The DBMS must stop supporting joins.", "Nothing can ever go wrong."]
              answer: 0
              explanation: Repeated copies of one fact can become inconsistent.
            - prompt: Where should a fact about one student usually live?
              choices: ["In a table describing that student", "In the server's CPU register.", "referenced by enrollments.", "On every enrollment row."]
              answer: 0
              explanation: A student fact belongs with the student; enrollment rows record relationships.
          sources: [https://www.postgresql.org/docs/current/tutorial-fk.html, https://www.postgresql.org/docs/current/ddl-constraints.html]
      - id: db-isolation
        title: What if two transactions change the same data?
        summary: Separate all-or-nothing atomicity from concurrent visibility and lost updates.
        position: 2
        prerequisites: [db-transaction, os-race]
        content:
          situation: Two people each try to buy the last ticket. Both read that one seat remains.
          explanation: A transaction can be atomic yet still conflict with another transaction. Isolation controls how concurrent operations observe and affect one another. If both buyers read one available seat and each writes a result based on that old value, a lost update or oversell can occur without an appropriate rule. Database engines offer isolation levels and coordination tools such as row locking, conditional updates or optimistic checks; exact behavior varies by engine and isolation level.
          terms:
            - {name: Isolation, meaning: Rules for interactions among concurrent transactions.}
            - {name: Lost update, meaning: One transaction's write overwrites an effect based on an earlier read.}
            - {name: Retry, meaning: Repeating a transaction after a detected conflict.}
          worked_example: A and B both read stock 1. A writes stock 0 and commits. B must not blindly write its own stale result and also claim a sale. A conditional update that succeeds only when stock remains positive can make one buyer fail safely.
          second_example_prompt: "Two editors load the same profile and save different changes. How could the app avoid silently losing one save?"
          second_example: Two editors update one profile. A version-number check can reject the second stale save and ask the user to review changes rather than silently overwriting the first.
          misconception: Atomicity alone does not solve concurrent reads and writes. It protects a transaction's all-or-nothing outcome, while isolation governs overlap with other transactions.
          checks:
            - prompt: Both buyers read one ticket left. What must the system prevent?
              choices: ["Both sales succeeding from the same stale stock value.", "Either buyer seeing the product page.", "A transaction containing more than one statement."]
              answer: 0
              explanation: The available-stock rule must hold despite concurrent attempts.
            - prompt: Is rollback after a half-completed transfer the same concern as two buyers racing?
              choices: ["Yes, both are only about table names.", "No, rollback is atomicity while the overlap needs isolation or coordination.", "No, concurrency cannot affect databases."]
              answer: 1
              explanation: Atomicity and isolation address different failure modes.
          sources: [https://www.postgresql.org/docs/current/transaction-iso.html]
      - id: db-pages
        title: Why does a database read pages instead of one byte?
        summary: Meet storage pages and row locations before heap scans and index internals.
        position: 3
        prerequisites: [db-index, os-files]
        content:
          situation: A library clerk fetches a whole tray of index cards to find one record rather than lifting one letter from storage.
          explanation: A DBMS organizes table and index data into fixed-size pages, which are units of storage and caching. PostgreSQL tables commonly use 8 KB pages; SQLite's documented default is 4 KB, and both can have different configured sizes. A heap scan examines relevant table pages; an index can point toward candidate rows. PostgreSQL ctid describes a physical row-version location, which can change when rows are updated or moved. Use a logical key for durable identity.
          terms:
            - {name: Page, meaning: A fixed-size unit of database storage and caching.}
            - {name: Heap scan, meaning: Reading table pages to inspect rows for a condition.}
            - {name: ctid, meaning: 'A PostgreSQL physical row-version location, not a stable logical ID.'}
          worked_example: A PostgreSQL table with many rows spans multiple pages. A query without a useful index may read pages and test rows. Finding one matching row does not imply reading exactly that row's bytes from storage.
          second_example_prompt: "A database reads data in pages. Does every engine use the same page size and physical row layout?"
          second_example: A SQLite database normally starts with 4096-byte pages. The same conceptual page/row distinction applies, but its page size and physical row identifiers differ from PostgreSQL's.
          misconception: An 8 KB page is not universal across databases. A physical location such as PostgreSQL ctid should not be used as a permanent customer ID.
          visual:
            kind: model
            title: Two ways to find one book record
            tracks:
              - id: scan
                title: No useful index
                steps:
                  - {label: Start at the table, explanation: The query asks for ISBN 7. The table spans three illustrative pages., state: {Page 1: 'ISBN 1, 2', Page 2: 'ISBN 4, 5', Page 3: 'ISBN 7, 8'}}
                  - {label: Inspect page 1, explanation: 'The target is not here, so continue.', state: {Pages visited: '1', Match: 'None yet', Next: 'Page 2'}}
                  - {label: Inspect page 2, explanation: These rows do not match either., state: {Pages visited: '2', Match: 'None yet', Next: 'Page 3'}}
                  - {label: Inspect page 3, explanation: The matching row is found after checking three pages in this toy example., state: {Pages visited: '3', Match: 'ISBN 7', Next: 'Done'}}
              - id: indexed
                title: Suitable index
                steps:
                  - {label: Search the index, explanation: An index on ISBN narrows the search to a candidate row location., state: {Search key: 'ISBN 7', Index result: 'Candidate on page 3', Table page: 'Not visited yet'}}
                  - {label: Fetch and verify, explanation: 'The database may fetch the table page and verify the row, depending on the plan.', state: {Search key: 'ISBN 7', Index result: 'Candidate on page 3', Table page: 'Page 3 visited'}}
                  - {label: Compare the work, explanation: 'For this selective lookup, the index avoids scanning all table pages; it still consumes storage and write work.', state: {Table pages scanned: 'Fewer in this model', Match: 'ISBN 7', Cost: 'Index maintenance on writes'}}
          checks:
            - prompt: Are all databases required to use 8 KB pages?
              choices: ["No, PostgreSQL commonly uses 8 KB while SQLite defaults to 4 KB.", "No, every row is exactly one byte.", "Yes, it is a SQL rule."]
              answer: 0
              explanation: Page size depends on the database engine and configuration.
            - prompt: Which value should identify a customer across updates?
              choices: ["PostgreSQL ctid alone.", "The last byte offset read from disk.", "A stable logical customer key."]
              answer: 2
              explanation: A logical key identifies the row as a business entity; physical locations can change.
          sources: [https://www.postgresql.org/docs/current/storage-page-layout.html, https://www.postgresql.org/docs/current/ddl-system-columns.html, https://www.sqlite.org/pragma.html]
